                <div className="flex-1 overflow-y-auto p-6">
                  {(() => {
                    const [sequences, setSequences] = useState([]);
                    const [seqLoading, setSeqLoading] = useState(true);
                    const [editingSequence, setEditingSequence] = useState(null);
                    const [newSequence, setNewSequence] = useState({
                      name: '',
                      description: '',
                      triggerType: 'manual',
                      triggerValue: '',
                      fromName: '',
                      replyTo: '',
                      isActive: true,
                      steps: []
                    });
                    const [showNewForm, setShowNewForm] = useState(false);

                    // Load sequences
                    useEffect(() => {
                      const loadSequences = async () => {
                        if (!supabase || !dataContext?.organization?.id) return;
                        try {
                          const { data } = await supabase
                            .from('email_sequences')
                            .select('*, email_sequence_steps(*)')
                            .eq('organization_id', dataContext.organization.id)
                            .order('created_at', { ascending: false });
                          setSequences(data || []);
                        } catch (e) {
                          console.error('Failed to load sequences:', e);
                        } finally {
                          setSeqLoading(false);
                        }
                      };
                      loadSequences();
                    }, []);

                    // Create new sequence
                    const createSequence = async () => {
                      if (!supabase || !dataContext?.organization?.id || !newSequence.name) return;
                      try {
                        const { data, error } = await supabase
                          .from('email_sequences')
                          .insert({
                            organization_id: dataContext.organization.id,
                            name: newSequence.name,
                            description: newSequence.description,
                            trigger_type: newSequence.triggerType,
                            trigger_value: newSequence.triggerValue || null,
                            from_name: newSequence.fromName || null,
                            reply_to: newSequence.replyTo || null,
                            is_active: newSequence.isActive,
                            created_by: user?.id
                          })
                          .select()
                          .single();

                        if (error) throw error;
                        setSequences(prev => [{ ...data, email_sequence_steps: [] }, ...prev]);
                        setNewSequence({ name: '', description: '', triggerType: 'manual', triggerValue: '', fromName: '', replyTo: '', isActive: true, steps: [] });
                        setShowNewForm(false);
                        showNotification('Sequence created');
                      } catch (e) {
                        showNotification('Failed to create sequence', 'error');
                      }
                    };

                    // Toggle sequence active
                    const toggleActive = async (seq) => {
                      if (!supabase) return;
                      try {
                        const { error } = await supabase
                          .from('email_sequences')
                          .update({ is_active: !seq.is_active })
                          .eq('id', seq.id);
                        if (error) throw error;
                        setSequences(prev => prev.map(s => s.id === seq.id ? { ...s, is_active: !s.is_active } : s));
                      } catch (e) {
                        showNotification('Failed to update', 'error');
                      }
                    };

                    // Delete sequence
                    const deleteSequence = async (seq) => {
                      if (!confirm(`Delete "${seq.name}"? This cannot be undone.`)) return;
                      if (!supabase) return;
                      try {
                        const { error } = await supabase
                          .from('email_sequences')
                          .delete()
                          .eq('id', seq.id);
                        if (error) throw error;
                        setSequences(prev => prev.filter(s => s.id !== seq.id));
                        showNotification('Sequence deleted');
                      } catch (e) {
                        showNotification('Failed to delete', 'error');
                      }
                    };

                    // Add step to sequence
                    const addStep = async (seqId) => {
                      if (!supabase) return;
                      const seq = sequences.find(s => s.id === seqId);
                      const stepNumber = (seq?.email_sequence_steps?.length || 0) + 1;
                      try {
                        const { data, error } = await supabase
                          .from('email_sequence_steps')
                          .insert({
                            sequence_id: seqId,
                            step_number: stepNumber,
                            delay_days: stepNumber === 1 ? 0 : 2,
                            delay_hours: 0,
                            subject: `Step ${stepNumber}: Follow-up`,
                            body_html: '<p>Hi {{firstName}},</p><p>Just following up on my previous email...</p><p>Best,<br>{{companyName}} Team</p>',
                            skip_conditions: { if_replied: true }
                          })
                          .select()
                          .single();
                        if (error) throw error;
                        setSequences(prev => prev.map(s => s.id === seqId ? {
                          ...s,
                          email_sequence_steps: [...(s.email_sequence_steps || []), data].sort((a, b) => a.step_number - b.step_number)
                        } : s));
                        showNotification('Step added');
                      } catch (e) {
                        showNotification('Failed to add step', 'error');
                      }
                    };

                    // Update step
                    const updateStep = async (stepId, updates) => {
                      if (!supabase) return;
                      try {
                        const { error } = await supabase
                          .from('email_sequence_steps')
                          .update(updates)
                          .eq('id', stepId);
                        if (error) throw error;
                        setSequences(prev => prev.map(s => ({
                          ...s,
                          email_sequence_steps: s.email_sequence_steps?.map(st =>
                            st.id === stepId ? { ...st, ...updates } : st
                          )
                        })));
                      } catch (e) {
                        showNotification('Failed to update step', 'error');
                      }
                    };

                    // Delete step
                    const deleteStep = async (stepId, seqId) => {
                      if (!supabase) return;
                      try {
                        const { error } = await supabase
                          .from('email_sequence_steps')
                          .delete()
                          .eq('id', stepId);
                        if (error) throw error;
                        setSequences(prev => prev.map(s => s.id === seqId ? {
                          ...s,
                          email_sequence_steps: s.email_sequence_steps?.filter(st => st.id !== stepId)
                        } : s));
                        showNotification('Step deleted');
                      } catch (e) {
                        showNotification('Failed to delete step', 'error');
                      }
                    };

                    const triggerLabels = {
                      manual: 'Manual enrollment',
                      status_change: 'When status changes to',
                      milestone: 'When milestone reached'
                    };

                    if (seqLoading) {
                      return (
                        <div className="flex items-center justify-center py-12">
                          <div className="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                        </div>
                      );
                    }

                    return (
                      <div className="space-y-6">
                        {/* Create New Button */}
                        {!showNewForm ? (
                          <button
                            onClick={() => setShowNewForm(true)}
                            className="w-full py-3 border-2 border-dashed border-gray-300 rounded-xl text-gray-500 hover:border-blue-400 hover:text-blue-600 transition-colors"
                          >
                            + Create New Sequence
                          </button>
                        ) : (
                          <div className="bg-blue-50 rounded-xl p-4 border border-blue-200">
                            <h4 className="font-semibold text-gray-900 mb-3">New Email Sequence</h4>
                            <div className="space-y-3">
                              <input
                                type="text"
                                value={newSequence.name}
                                onChange={(e) => setNewSequence(prev => ({ ...prev, name: e.target.value }))}
                                placeholder="Sequence name (e.g., 'Post-Qualified Nurture')"
                                className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm"
                              />
                              <textarea
                                value={newSequence.description}
                                onChange={(e) => setNewSequence(prev => ({ ...prev, description: e.target.value }))}
                                placeholder="Description (optional)"
                                rows={2}
                                className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm"
                              />
                              <div className="grid grid-cols-2 gap-3">
                                <div>
                                  <label className="block text-xs font-medium text-gray-600 mb-1">Trigger Type</label>
                                  <select
                                    value={newSequence.triggerType}
                                    onChange={(e) => setNewSequence(prev => ({ ...prev, triggerType: e.target.value, triggerValue: '' }))}
                                    className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm"
                                  >
                                    <option value="manual">Manual enrollment</option>
                                    <option value="status_change">Status change</option>
                                    <option value="milestone">Milestone reached</option>
                                  </select>
                                </div>
                                {newSequence.triggerType !== 'manual' && (
                                  <div>
                                    <label className="block text-xs font-medium text-gray-600 mb-1">
                                      {newSequence.triggerType === 'status_change' ? 'Status' : 'Milestone'}
                                    </label>
                                    {newSequence.triggerType === 'status_change' ? (
                                      <select
                                        value={newSequence.triggerValue}
                                        onChange={(e) => setNewSequence(prev => ({ ...prev, triggerValue: e.target.value }))}
                                        className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm"
                                      >
                                        <option value="">Select status...</option>
                                        <option value="Qualified">Qualified</option>
                                        <option value="Follow Up">Follow Up</option>
                                        <option value="Deck Sent">Deck Sent</option>
                                      </select>
                                    ) : (
                                      <select
                                        value={newSequence.triggerValue}
                                        onChange={(e) => setNewSequence(prev => ({ ...prev, triggerValue: e.target.value }))}
                                        className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm"
                                      >
                                        <option value="">Select milestone...</option>
                                        <option value="deckSent">Deck Sent</option>
                                        <option value="discoveryCall">Discovery Call</option>
                                        <option value="ceoMeetingHeld">CEO Meeting Held</option>
                                        <option value="proposalSent">Proposal Sent</option>
                                      </select>
                                    )}
                                  </div>
                                )}
                              </div>
                              <div className="flex gap-2">
                                <button
                                  onClick={createSequence}
                                  disabled={!newSequence.name}
                                  className="px-4 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700 disabled:opacity-50"
                                >
                                  Create Sequence
                                </button>
                                <button
                                  onClick={() => setShowNewForm(false)}
                                  className="px-4 py-2 border border-gray-200 rounded-lg text-sm font-medium hover:bg-gray-50"
                                >
                                  Cancel
                                </button>
                              </div>
                            </div>
                          </div>
                        )}

                        {/* Sequences List */}
                        {sequences.length === 0 ? (
                          <div className="text-center py-12 text-gray-500">
                            <div className="text-4xl mb-2">📧</div>
                            <p>No sequences yet. Create one to start automating follow-ups.</p>
                          </div>
                        ) : (
                          <div className="space-y-4">
                            {sequences.map(seq => (
                              <div key={seq.id} className={`border rounded-xl overflow-hidden ${seq.is_active ? 'border-green-200 bg-green-50/30' : 'border-gray-200 bg-gray-50/50'}`}>
                                {/* Sequence Header */}
                                <div className="p-4 flex items-center justify-between">
                                  <div className="flex items-center gap-3">
                                    <button
                                      onClick={() => toggleActive(seq)}
                                      className={`px-2 py-1 rounded-full text-xs font-medium ${seq.is_active ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}
                                    >
                                      {seq.is_active ? '● Active' : '○ Paused'}
                                    </button>
                                    <div>
                                      <h4 className="font-semibold text-gray-900">{seq.name}</h4>
                                      <p className="text-xs text-gray-500">
                                        {triggerLabels[seq.trigger_type]}
                                        {seq.trigger_value && <span className="font-medium"> "{seq.trigger_value}"</span>}

                                                  <label className="text-xs text-gray-500">Days</label>

                                                    type="number"
                                                    value={step.delay_days}

                                                    className="w-16 px-2 py-1 border rounded text-sm"
                                                    min="0"
                                                  />
                                                </div>
                                                <div>
                                                  <label className="text-xs text-gray-500">Hours</label>
                                                  <input
                                                    type="number"
                                                    value={step.delay_hours}
                                                    onChange={(e) => updateStep(step.id, { delay_hours: parseInt(e.target.value) || 0 })}
                                                    className="w-16 px-2 py-1 border rounded text-sm"
                                                    min="0"
                                                    max="23"
                                                  />
                                                </div>
                                              </div>
                                            )}
                                            <input
                                              type="text"
                                              value={step.subject}
                                              onChange={(e) => updateStep(step.id, { subject: e.target.value })}
                                              placeholder="Email subject"
                                              className="w-full px-2 py-1 border rounded text-sm"
                                            />
                                            <textarea
                                              value={step.body_html}
                                              onChange={(e) => updateStep(step.id, { body_html: e.target.value })}
                                              placeholder="Email body (HTML)"
                                              rows={3}
                                              className="w-full px-2 py-1 border rounded text-sm font-mono"
                                            />
                                            <div className="text-xs text-gray-400">
                                              Tokens: {'{{contact}}'}, {'{{firstName}}'}, {'{{company}}'}, {'{{companyName}}'}, {'{{ceoName}}'}
                                            </div>
                                          </div>
                                        </div>
                                      ))}
                                      <button
                                        onClick={() => addStep(seq.id)}
                                        className="w-full py-2 border-2 border-dashed border-gray-300 rounded-lg text-sm text-gray-500 hover:border-blue-400 hover:text-blue-600"
                                      >
                                        + Add Step
                                      </button>
                                    </div>
                                  </div>
                                )}
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    );
                  })()}
                </div>
              </div>
            </div>
          )}

          {/* Notes Slide-out Panel */}
          {showNotesPanel && selectedLead && (
            <div className="fixed inset-0 z-50">
              {/* Backdrop */}
              <div
                className="absolute inset-0 bg-black bg-opacity-30"
                onClick={() => setShowNotesPanel(false)}
              />
              {/* Panel */}
              <div className="absolute right-0 top-0 h-full w-full max-w-md bg-white shadow-2xl flex flex-col animate-slide-in-right">
                {/* Header */}
                <div className="flex items-center justify-between p-4 border-b border-gray-200 bg-gradient-to-r from-yellow-50 to-amber-50">
                  <div className="flex items-center gap-2">
                    <span className="text-2xl">📝</span>
                    <div>
                      <h2 className="font-bold text-gray-900">Notes</h2>
                      <p className="text-sm text-gray-500">{selectedLead.company}</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowNotesPanel(false)}
                    className="p-2 hover:bg-gray-100 rounded-lg transition-colors"
                  >
                    <svg className="w-6 h-6 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M6 18L18 6M6 6l12 12" />
                    </svg>
                  </button>
                </div>

                {/* Add Note Input */}
                <div className="p-4 border-b border-gray-100 bg-white">
                  <div className="flex gap-2">
                    <input
                      id="call-notes-input"
                      type="text"
                      value={callNotes}
                      onChange={(e) => setCallNotes(e.target.value)}
                      onKeyDown={(e) => {
                        if (e.key === 'Enter' && callNotes.trim()) {
                          e.preventDefault();
                          addCallNotes();
                        }
                      }}
                      placeholder="Add a note... (Enter to save)"
                      className="flex-1 px-4 py-3 border border-gray-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-yellow-500 focus:border-transparent"
                      autoFocus
                    />
                    <button
                      onClick={addCallNotes}
                      disabled={!callNotes.trim()}
                      className="px-4 py-3 bg-yellow-500 text-white rounded-xl font-medium hover:bg-yellow-600 disabled:bg-gray-200 disabled:text-gray-400 disabled:cursor-not-allowed transition-colors"
                    >
                      💾
                    </button>
                  </div>
                </div>

                {/* Notes History */}
                <div className="flex-1 overflow-y-auto p-4 space-y-3">
                  {selectedLead.notes ? (
                    selectedLead.notes.split('\n\n').filter(n => n.trim()).map((note, idx) => (
                      <div key={idx} className="p-4 bg-yellow-50 rounded-xl text-gray-700 border-l-4 border-yellow-400 flex justify-between items-start gap-3 group hover:bg-yellow-100 transition-colors">
                        <span className="flex-1 text-sm leading-relaxed">{note}</span>
                        <button
                          onClick={() => {
                            if (confirm('Delete this note?')) {
                              const notesArray = selectedLead.notes.split('\n\n').filter(n => n.trim());
                              notesArray.splice(idx, 1);
                              const newNotes = notesArray.join('\n\n');
                              const updatedLead = { ...selectedLead, notes: newNotes };
                              setLeads(leads.map(l => l.id === selectedLead.id ? updatedLead : l));
                              setSelectedLead(updatedLead);
                              showNotification('Note deleted');
                            }
                          }}
                          className="text-gray-300 hover:text-red-500 transition-colors opacity-0 group-hover:opacity-100 shrink-0 p-1"
                          title="Delete this note"
                        >
                          🗑️
                        </button>
                      </div>
                    ))
                  ) : (
                    <div className="flex flex-col items-center justify-center h-full text-center py-12">
                      <span className="text-4xl mb-3">📝</span>
                      <p className="text-gray-500 font-medium">No notes yet</p>
                      <p className="text-sm text-gray-400 mt-1">Add your first note above</p>
                    </div>
                  )}
                </div>

                {/* Footer with count */}
                {selectedLead.notes && (
                  <div className="p-3 border-t border-gray-100 bg-gray-50 text-center">
                    <span className="text-xs text-gray-500">
                      {selectedLead.notes.split('\n\n').filter(n => n.trim()).length} note{selectedLead.notes.split('\n\n').filter(n => n.trim()).length !== 1 ? 's' : ''}
                    </span>
                  </div>
                )}
              </div>
            </div>
          )}

          {/* Onboarding Tour Modal */}
          {showOnboarding && (
            <div className="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center z-[100]">
              <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl mx-4 overflow-hidden">
                {/* Progress Bar */}
                <div className="h-1 bg-gray-200">
                  <div
                    className="h-full bg-blue-600 transition-all duration-300"
                    style={{ width: `${((onboardingStep + 1) / onboardingSteps.length) * 100}%` }}
                  ></div>
                </div>

                <div className="p-8">
                  {/* Icon */}
                  <div className="w-16 h-16 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-2xl flex items-center justify-center mx-auto mb-6">
                    <span className="text-3xl">
                      {onboardingStep === 0 ? '👋' :
                       onboardingStep === 1 ? '➕' :
                       onboardingStep === 2 ? '🔍' :
                       onboardingStep === 3 ? '📚' :
                       onboardingStep === 4 ? '📝' :
                       onboardingStep === 5 ? '📅' :
                       onboardingStep === 6 ? '📊' : '🚀'}
                    </span>
                  </div>

                  {/* Content */}
                  <h3 className="text-xl font-bold text-gray-900 text-center mb-3">
                    {onboardingSteps[onboardingStep].title}
                  </h3>
                  <p className="text-gray-600 text-center mb-8">
                    {onboardingSteps[onboardingStep].description}
                  </p>

                  {/* Navigation */}
                  <div className="flex gap-3">
                    {onboardingStep > 0 && (
                      <button
                        onClick={() => setOnboardingStep(onboardingStep - 1)}
                        className="flex-1 py-3 border border-gray-200 rounded-xl hover:bg-gray-50 font-medium"
                      >
                        Back
                      </button>
                    )}
                    {onboardingStep < onboardingSteps.length - 1 ? (
                      <button
                        onClick={() => setOnboardingStep(onboardingStep + 1)}
                        className="flex-1 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-medium"
                      >
                        Next
                      </button>
                    ) : (
                      <button
                        onClick={() => {
                          setShowOnboarding(false);
                          const saved = loadFromStorage() || {};
                          saveToStorage({ ...saved, onboardingCompleted: true });
                          showNotification('Welcome! Start by selecting a lead or adding a new one.');
                        }}
                        className="flex-1 py-3 bg-green-600 text-white rounded-xl hover:bg-green-700 font-medium"
                      >
                        Get Started!
                      </button>
                    )}
                  </div>

                  {/* Skip */}
                  <button
                    onClick={() => {
                      setShowOnboarding(false);
                      const saved = loadFromStorage() || {};
                      saveToStorage({ ...saved, onboardingCompleted: true });
                    }}
                    className="w-full mt-4 text-sm text-gray-500 hover:text-gray-700"
                  >
                    Skip tour
                  </button>

                  {/* Step dots */}
                  <div className="flex justify-center gap-2 mt-6">
                    {onboardingSteps.map((_, i) => (
                      <div
                        key={i}
                        className={`w-2 h-2 rounded-full transition-colors ${
                          i === onboardingStep ? 'bg-blue-600' : i < onboardingStep ? 'bg-blue-300' : 'bg-gray-300'
                        }`}

            </div>

        </div>

    // ==================== MODE SELECTION SCREEN ====================
    const ModeSelectionScreen = ({ onSelectLocal, onSelectCloud }) => {
      return (
        <div className="min-h-screen bg-gradient-to-br from-blue-50 via-indigo-50 to-purple-50 flex items-center justify-center p-4">
          <div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden">
            {/* Header */}
            <div className="bg-gradient-to-r from-blue-600 to-indigo-600 p-8 text-center">
              <div className="w-16 h-16 bg-white/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
                <span className="text-4xl">📞</span>
              </div>
              <h1 className="text-2xl font-bold text-white mb-2">Welcome to Outbound Sales Engine</h1>
              <p className="text-blue-100">AI-Powered Cold Calling & Lead Generation</p>
            </div>

            {/* Mode Selection */}
            <div className="p-8">
              <h2 className="text-lg font-semibold text-gray-900 text-center mb-6">How will you be using this app?</h2>

              <div className="grid md:grid-cols-2 gap-4">
                {/* Single User Option */}
                <button
                  onClick={onSelectLocal}
                  className="p-6 border-2 border-gray-200 rounded-xl hover:border-blue-400 hover:bg-blue-50 transition-all text-left group"
                >
                  <div className="flex items-center gap-3 mb-3">

                    </div>

                    </div>

                  <ul className="text-sm text-gray-600 space-y-1">
                    <li>✓ No account required</li>
                    <li>✓ Data saved in browser</li>
                    <li>✓ Full feature access</li>
                    <li>✓ Works offline</li>
                  </ul>
                  <div className="mt-4 text-xs text-gray-400">Best for individual sales reps</div>
                </button>

                {/* Multi-User Option */}
                <button
                  onClick={onSelectCloud}
                  className="p-6 border-2 border-gray-200 rounded-xl hover:border-purple-400 hover:bg-purple-50 transition-all text-left group"
                >
                  <div className="flex items-center gap-3 mb-3">
                    <div className="w-12 h-12 bg-purple-100 rounded-xl flex items-center justify-center text-2xl group-hover:bg-purple-200 transition-colors">
                      ☁️
                    </div>
                    <div>
                      <div className="font-semibold text-gray-900">Multi-User / Team</div>
                      <div className="text-xs text-purple-600 font-medium">Requires Setup</div>
                    </div>
                  </div>
                  <ul className="text-sm text-gray-600 space-y-1">
                    <li>✓ Team collaboration</li>
                    <li>✓ Cloud sync across devices</li>
                    <li>✓ Twilio calling & SMS</li>
                    <li>✓ White-label branding</li>
                  </ul>
                  <div className="mt-4 text-xs text-gray-400">Requires Supabase backend</div>
                </button>

              <p className="text-xs text-gray-400 text-center mt-6">
                You can switch modes later in Settings
              </p>
            </div>
          </div>
        </div>
      );
    };

    // ==================== ROOT WRAPPER ====================
    const RootApp = () => {
      const [authPage, setAuthPage] = useState('login');
      const [showSetup, setShowSetup] = useState(false);
      const [useLocalMode, setUseLocalMode] = useState(() => {
        // If hosted mode is configured, always use cloud (users just login)
        if (isHostedMode) return false;
        // Check if user has already chosen a mode
        const savedMode = localStorage.getItem('outboundSalesEngineMode');
        if (savedMode === 'local') return true;
        if (savedMode === 'cloud') return false;
        // No choice made yet - will show selection screen
        return null;
      });
      const [showModeSelection, setShowModeSelection] = useState(() => {
        // Skip mode selection in hosted mode - go straight to login
        if (isHostedMode) return false;
        const savedMode = localStorage.getItem('outboundSalesEngineMode');
        return savedMode === null; // Show selection if no mode saved
      });

      // Show mode selection for first-time users (only when NOT in hosted mode)
      if (!isHostedMode && showModeSelection && useLocalMode === null) {
        return (
          <ModeSelectionScreen
            onSelectLocal={() => {
              localStorage.setItem('outboundSalesEngineMode', 'local');
              setUseLocalMode(true);
              setShowModeSelection(false);
            }}
            onSelectCloud={() => {
              localStorage.setItem('outboundSalesEngineMode', 'cloud');
              setUseLocalMode(false);
              setShowModeSelection(false);
              setShowSetup(true); // Go to Supabase setup
            }}
          />
        );
      }

      // If local mode selected or no Supabase configured, show the app directly
      if (useLocalMode || !supabase) {
        return (
          <DataProvider forceLocal={true}>
            <App />
          </DataProvider>
        );
      }

      // Show setup page if requested
      if (showSetup) {
        return <SetupPage onComplete={() => setShowSetup(false)} />;
      }

      return (
        <AuthProvider>
          <AuthenticatedApp
            onShowSetup={() => setShowSetup(true)}
            authPage={authPage}
            setAuthPage={setAuthPage}
          />
        </AuthProvider>
      );
    };

    const AuthenticatedApp = ({ onShowSetup, authPage, setAuthPage }) => {
      const { user, loading: authLoading, isAuthenticated } = useAuth();

      if (authLoading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
            <div className="text-center">
              <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              <p className="text-gray-600">Loading...</p>
            </div>
          </div>
        );
      }

      if (!isAuthenticated) {
        if (authPage === 'register') {
          return <RegisterPage onSwitchToLogin={() => setAuthPage('login')} />;
        }
        return (
          <LoginPage
            onSwitchToRegister={() => setAuthPage('register')}
            onSwitchToSetup={onShowSetup}
          />
        );
      }

      return (
        <OrgProvider>
          <OrgGate />
        </OrgProvider>
      );
    };

    const OrgGate = () => {
      const { organization, loading: orgLoading, reload: reloadOrg } = useOrg();
      const [inviteStatus, setInviteStatus] = useState(null); // 'checking', 'accepting', 'accepted', 'error', null
      const [inviteError, setInviteError] = useState(null);

      // Check for invite token in URL
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const inviteToken = params.get('invite');

        if (inviteToken && supabase && !organization) {
          acceptInvitation(inviteToken);
        }
      }, [organization]);

      const acceptInvitation = async (token) => {
        setInviteStatus('accepting');
        setInviteError(null);

        try {
          // Use the Supabase RPC function to accept the invitation
          const { data, error } = await supabase.rpc('accept_invitation', {
            p_token: token
          });

          if (error) throw error;

          if (data?.success) {
            setInviteStatus('accepted');
            // Clear the invite token from URL
            const url = new URL(window.location.href);
            url.searchParams.delete('invite');
            window.history.replaceState({}, '', url.toString());
            // Reload organization data
            await reloadOrg();
          } else {
            throw new Error(data?.error || 'Failed to accept invitation');
          }
        } catch (err) {
          console.error('Error accepting invitation:', err);
          setInviteStatus('error');
          setInviteError(err.message || 'Invalid or expired invitation');
        }
      };

      // Show invite acceptance status
      if (inviteStatus === 'accepting') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
            <div className="text-center bg-white rounded-2xl p-8 shadow-xl">
              <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              <p className="text-gray-600">Accepting invitation...</p>
            </div>
          </div>
        );
      }

      if (inviteStatus === 'accepted') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
            <div className="text-center bg-white rounded-2xl p-8 shadow-xl">
              <div className="text-5xl mb-4">🎉</div>
              <h2 className="text-xl font-bold text-gray-900 mb-2">Welcome to the Team!</h2>
              <p className="text-gray-600 mb-4">Your invitation has been accepted.</p>
              <button
                onClick={() => window.location.reload()}
                className="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
              >
                Continue to App
              </button>
            </div>
          </div>
        );
      }

      if (inviteStatus === 'error') {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
            <div className="text-center bg-white rounded-2xl p-8 shadow-xl max-w-md">
              <div className="text-5xl mb-4">❌</div>
              <h2 className="text-xl font-bold text-gray-900 mb-2">Invitation Error</h2>
              <p className="text-gray-600 mb-4">{inviteError}</p>
              <div className="space-y-2">
                <button
                  onClick={() => {
                    const url = new URL(window.location.href);
                    url.searchParams.delete('invite');
                    window.history.replaceState({}, '', url.toString());
                    setInviteStatus(null);
                  }}
                  className="w-full px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700"
                >
                  Continue Anyway
                </button>
                <p className="text-xs text-gray-500">
                  The invitation may have expired or already been used. Contact your team admin for a new invitation.
                </p>
              </div>
            </div>
          </div>
        );
      }

      if (orgLoading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
            <div className="text-center">
              <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              <p className="text-gray-600">Loading organization...</p>
            </div>
          </div>
        );
      }

      if (!organization) {
        return <OrgSetupPage />;
      }

      return (
        <DataProvider>
          <App />
        </DataProvider>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<ErrorBoundary><RootApp /></ErrorBoundary>);
  </script>
</body>
</html>
