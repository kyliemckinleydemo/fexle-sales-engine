<body class="bg-gray-50">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // ==================== LEAD SOURCES ====================
    const LEAD_SOURCES = {
      apollo: { name: 'Apollo.io', icon: '🚀', color: 'purple' },
      linkedin: { name: 'LinkedIn', icon: '💼', color: 'blue' },
      referral: { name: 'Referral', icon: '🤝', color: 'green' },
      website: { name: 'Website', icon: '🌐', color: 'cyan' },
      conference: { name: 'Conference/Event', icon: '🎪', color: 'orange' },
      coldOutreach: { name: 'Cold Outreach', icon: '📞', color: 'gray' },
      inbound: { name: 'Inbound', icon: '📥', color: 'teal' },
      partnerReferral: { name: 'Partner Referral', icon: '🏢', color: 'indigo' },
      manual: { name: 'Manual Entry', icon: '✏️', color: 'slate' }
    };

    // ==================== LEAD SCORING MODEL ====================
    const SCORING_WEIGHTS = {
      // Company Attributes (max 40 points)
      companySize: {
        '1-50': 5,
        '51-200': 15,
        '201-500': 20,  // Sweet spot for Fexle
        '501-1000': 15,
        '1000+': 10
      },
      revenue: {
        'Under $5M': 5,
        '$5M-$20M': 10,
        '$20M-$50M': 15,
        '$50M-$200M': 20,  // Sweet spot
        '$200M+': 15
      },
      // Role/Title (max 25 points)
      titleScore: {
        'CEO': 25, 'Managing Director': 25, 'Founder': 25,
        'COO': 22, 'CIO': 22, 'CTO': 22, 'CFO': 20,
        'VP': 18, 'Director': 15, 'Head of': 15,
        'Manager': 10, 'Other': 5
      },
      // Intent Signals (max 20 points)
      intentSignals: {
        hiringSalesforce: 10,
        researchingCRM: 8,
        recentFunding: 7,
        newExecutive: 5,
        expansion: 5,
        techStackMatch: 5
      },
      // Vertical Fit (max 15 points)
      verticalFit: {
        healthcare: 15,
        financial: 15,
        manufacturing: 12,
        professionalServices: 12,
        retail: 10,
        education: 10,
        nonprofit: 8,
        government: 8,
        realestate: 10,
        logistics: 10,
        hospitality: 8
      }
    };

    const calculateLeadScore = (lead) => {
      let score = 0;
      let breakdown = {};

      // Company Size Score
      const sizeScore = SCORING_WEIGHTS.companySize[lead.companySize] || 10;
      score += sizeScore;
      breakdown.companySize = sizeScore;

      // Revenue Score
      const revenueScore = SCORING_WEIGHTS.revenue[lead.revenue] || 10;
      score += revenueScore;
      breakdown.revenue = revenueScore;

      // Title Score
      let titleScore = 5;
      const titleLower = (lead.title || '').toLowerCase();
      if (titleLower.includes('ceo') || titleLower.includes('chief executive') || titleLower.includes('managing director') || titleLower.includes('founder')) {
        titleScore = 25;
      } else if (titleLower.includes('coo') || titleLower.includes('cio') || titleLower.includes('cto')) {
        titleScore = 22;
      } else if (titleLower.includes('cfo')) {
        titleScore = 20;
      } else if (titleLower.includes('vp') || titleLower.includes('vice president')) {
        titleScore = 18;
      } else if (titleLower.includes('director') || titleLower.includes('head of')) {
        titleScore = 15;
      } else if (titleLower.includes('manager')) {
        titleScore = 10;
      }
      score += titleScore;
      breakdown.title = titleScore;

      // Intent Signals Score
      let intentScore = 0;
      if (lead.intentSignals) {
        if (lead.intentSignals.hiringSalesforce) intentScore += 10;
        if (lead.intentSignals.researchingCRM) intentScore += 8;
        if (lead.intentSignals.recentFunding) intentScore += 7;
        if (lead.intentSignals.newExecutive) intentScore += 5;
        if (lead.intentSignals.expansion) intentScore += 5;
        if (lead.intentSignals.techStackMatch) intentScore += 5;
      }
      score += Math.min(intentScore, 20); // Cap at 20
      breakdown.intent = Math.min(intentScore, 20);

      // Vertical Fit Score
      const verticalScore = SCORING_WEIGHTS.verticalFit[lead.vertical] || 8;
      score += verticalScore;
      breakdown.vertical = verticalScore;

      // Normalize to 0-100
      const normalizedScore = Math.min(Math.round((score / 100) * 100), 100);
      
      return { score: normalizedScore, breakdown };
    };

    // ==================== APOLLO.IO INTEGRATION ====================
    const APOLLO_CONFIG = {
      baseUrl: 'https://api.apollo.io/v1',
      endpoints: {
        search: '/mixed_people/search',
        enrich: '/people/match',
        organization: '/organizations/enrich'
      }
    };

    const transformApolloLead = (apolloPerson, source = 'apollo') => {
      const org = apolloPerson.organization || {};
      
      // Determine company size bucket
      let companySize = '51-200';
      const employees = org.estimated_num_employees || apolloPerson.organization_num_employees || 0;
      if (employees <= 50) companySize = '1-50';
      else if (employees <= 200) companySize = '51-200';
      else if (employees <= 500) companySize = '201-500';
      else if (employees <= 1000) companySize = '501-1000';
      else companySize = '1000+';

      // Determine revenue bucket
      let revenue = '$20M-$50M';
      const annualRevenue = org.annual_revenue || 0;
      if (annualRevenue < 5000000) revenue = 'Under $5M';
      else if (annualRevenue < 20000000) revenue = '$5M-$20M';
      else if (annualRevenue < 50000000) revenue = '$20M-$50M';
      else if (annualRevenue < 200000000) revenue = '$50M-$200M';
      else revenue = '$200M+';

      // Map industry to vertical
      let vertical = 'professionalServices';
      const industry = (org.industry || '').toLowerCase();
      if (industry.includes('health') || industry.includes('medical') || industry.includes('hospital') || industry.includes('aged care')) {
        vertical = 'healthcare';
      } else if (industry.includes('financial') || industry.includes('bank') || industry.includes('insurance') || industry.includes('wealth')) {
        vertical = 'financial';
      } else if (industry.includes('manufactur') || industry.includes('industrial')) {
        vertical = 'manufacturing';
      } else if (industry.includes('retail') || industry.includes('ecommerce') || industry.includes('consumer')) {
        vertical = 'retail';
      } else if (industry.includes('education') || industry.includes('university') || industry.includes('school')) {
        vertical = 'education';
      } else if (industry.includes('nonprofit') || industry.includes('charity') || industry.includes('ngo')) {
        vertical = 'nonprofit';
      } else if (industry.includes('government') || industry.includes('public sector')) {
        vertical = 'government';
      } else if (industry.includes('real estate') || industry.includes('property')) {
        vertical = 'realestate';
      } else if (industry.includes('logistics') || industry.includes('transport') || industry.includes('shipping')) {
        vertical = 'logistics';
      } else if (industry.includes('hotel') || industry.includes('hospitality') || industry.includes('tourism')) {
        vertical = 'hospitality';
      }

      // Extract intent signals
      const intentSignals = {
        hiringSalesforce: (apolloPerson.intent_topics || []).some(t => t.toLowerCase().includes('salesforce')),
        researchingCRM: (apolloPerson.intent_topics || []).some(t => t.toLowerCase().includes('crm')),
        recentFunding: org.latest_funding_stage ? true : false,
        newExecutive: false, // Would need additional data
        expansion: org.is_hiring || false,
        techStackMatch: (org.technologies || []).some(t => ['salesforce', 'hubspot', 'dynamics'].includes(t.toLowerCase()))
      };

      const lead = {
        id: Date.now() + Math.random(),
        company: org.name || apolloPerson.organization_name || 'Unknown',
        contact: apolloPerson.name || `${apolloPerson.first_name || ''} ${apolloPerson.last_name || ''}`.trim(),
        title: apolloPerson.title || '',
        phone: apolloPerson.phone_numbers?.[0]?.sanitized_number || apolloPerson.mobile_phone || '',
        email: apolloPerson.email || '',
        vertical,
        companySize,
        revenue,
        employeeCount: employees,
        website: org.website_url || '',
        linkedinUrl: apolloPerson.linkedin_url || '',
        companyLinkedin: org.linkedin_url || '',
        city: apolloPerson.city || org.city || '',
        state: apolloPerson.state || org.state || '',
        country: apolloPerson.country || org.country || 'Australia',
        industry: org.industry || '',
        intentSignals,
        intentTopics: apolloPerson.intent_topics || [],
        technologies: org.technologies || [],
        source,
        sourceId: apolloPerson.id,
        importedAt: new Date().toISOString(),
        status: 'New Lead',
        lastContact: 'Never',
        notes: `Imported from ${LEAD_SOURCES[source]?.name || source}\nIndustry: ${org.industry || 'N/A'}\nEmployees: ${employees || 'N/A'}\nTechnologies: ${(org.technologies || []).slice(0, 5).join(', ') || 'N/A'}`,
        research: null
      };

      // Calculate score
      const { score } = calculateLeadScore(lead);
      lead.score = score;

      return lead;
    };

    // ==================== FEXLE COMPANY DATA ====================
    const FEXLE_INFO = {
      name: "Fexle Services",
      tagline: "Australia's Most Cost-Effective Salesforce Implementation Partner",
      size: "300+ Salesforce Professionals",
      locations: ["Sydney", "Melbourne", "Gold Coast"],
      model: "Hybrid onshore-offshore - Australian leadership, global development capacity",
      costAdvantage: "30-40% lower cost than traditional consultancies",
      status: "Salesforce Platinum Partner",
      parentCompany: "Xoriant (since 2024)",
      keyProducts: ["Agentforce", "Einstein Copilot", "Data Cloud", "Sales Cloud", "Service Cloud"],
      proofPoints: [
        "One client cut support ticket volume by 40% in 8 weeks",
        "213% ROI achieved by Wiley Publishing",
        "70% autonomous resolution during peak tax season (1-800-Accountant)",
        "84% faster resolution times",
        "700+ successful implementations"
      ],
      aiDeck: "AI Implementation Deck - practical guide on implementing Salesforce AI with real business impact"
    };

    // ==================== FEXLE CALL SCRIPTS ====================
    const FEXLE_SCRIPTS = {
      openings: {
        aiPressure: {
          name: "AI Pressure Question (Recommended)",
          script: `"Hi [NAME], this is [YOUR_NAME] from Fexle. I'll be honest — this is a cold call, so I'll be quick. Are you seeing pressure to do more with AI in your Salesforce environment, or is that not really on your radar yet?"`,
          why: "Opens with THEIR situation. Acknowledges the interruption. The question is easy to answer and gets them talking."
        },
        supportCost: {
          name: "Support Cost Question",
          script: `"Hi [NAME], this is [YOUR_NAME] from Fexle. Quick question — is reducing customer support costs something that's on your priority list this year, or is that not where the pressure is right now?"`,
          why: "Goes straight to a pain point. If they say yes, you have an opening. If they say no, you can pivot to sales performance."
        },
        salesPerformance: {
          name: "Sales Performance Question",
          script: `"Hi [NAME], this is [YOUR_NAME] from Fexle. I'm curious — are you getting everything you need out of Salesforce right now, or is there a gap between what it could do for your sales team and what it's actually doing?"`,
          why: "Invites them to share frustrations. Most Salesforce users feel they're not getting full value."
        },
        permissionHybrid: {
          name: "Permission + Problem Hybrid",
          script: `"Hi [NAME], this is [YOUR_NAME] from Fexle. I'll be honest — this is a cold call, so I'll be quick. A lot of companies we talk to are sitting on AI features in Salesforce they're not using yet — stuff that could genuinely cut support costs or speed up their sales cycle. Is that something you'd want to explore, or is this a bad time?"`,
          why: "Acknowledges the cold call, hints at value, gives them an easy out (which paradoxically makes them more likely to engage)."
        }
      },
      pivots: {
        primary: `"So here's why I called you specifically. Fexle is Australia's most cost-effective Salesforce implementation partner — we're 300 people with a hybrid onshore-offshore model that delivers implementations at 30-40% less than traditional consultancies. But what's really relevant right now is that Salesforce just released Agentforce — AI agents that can handle customer inquiries autonomously. One of our clients cut their support ticket volume by 40% in 8 weeks. Is that the kind of thing that would be useful to explore?"`,
        aiInterest: `"Perfect — that's exactly why I'm reaching out. Salesforce has released some genuinely useful AI this year — Agentforce for autonomous customer service, Einstein Copilot for sales reps, automated workflows that actually work. Most companies haven't dug into it yet because, frankly, their existing partners haven't either. We're different — we're 300 people focused only on Salesforce, and we're Australia's most cost-effective implementation partner. Our hybrid model means you get Australian project leadership with global development capacity at 30-40% lower cost. Would it be useful to see what's actually possible with these new tools?"`,
        costPressure: `"That's exactly what we help with. Fexle is Australia's most cost-effective Salesforce implementation partner — our hybrid onshore-offshore model delivers implementations at 30-40% less than Big Four consultancies. Same quality, smarter delivery model. And the new Salesforce AI features — Agentforce, Einstein — can dramatically reduce support costs in months, not years. We helped one client cut support ticket volume by 40% in 8 weeks. Would it be worth exploring what's possible for your situation?"`,
        salesGaps: `"You're not alone — most companies feel that way about Salesforce. Here's the thing: Salesforce's new AI tools — Einstein Copilot for reps, AI-powered forecasting, automated lead scoring — can genuinely close that gap. We're Fexle, Australia's most cost-effective Salesforce partner. Our hybrid model means you get enterprise-quality implementations at 30-40% less than traditional consultancies. We've helped companies improve deal velocity and win rates using these new tools. Would it be useful to see what might work for your team?"`
      },
      closes: {
        ceoMeeting: `"Here's what I'd suggest. I'd love to set up a 20-minute call with our CEO — no pitch, just a conversation. He'll walk you through the latest Salesforce AI innovations, what we're seeing work in companies like yours, and whether any of it makes sense for your plans. If it's not relevant, you'll know in 20 minutes. Would [specific day] at [specific time] work?"`,
        aiDeck: `"I get it — timing isn't always right for a call. Tell you what: we've put together a really practical deck on how to implement AI in Salesforce with real business impact — not theory, actual use cases and results. Would it be useful if I sent that over? It's a good way to see if our approach resonates, and if it does, we can talk further when the timing makes sense."`,
        deckAccepted: `"Great — I'll send it over today. It covers how companies are using Agentforce and Einstein to drive real results, plus some specific examples of cost reduction and sales improvement. Take a look when you have a chance, and I'll follow up in a week or so to see if it sparked any questions. If it's useful, we can set up time with our CEO to go deeper. Sound good?"`,
        hybrid: `"Here's an idea: let me send you our AI implementation deck — it's practical, not salesy, and shows how companies are getting real results from Salesforce AI. Take a look, and if it resonates, I'll connect you with our CEO for a 20-minute conversation to go deeper. That way you can see our thinking first before committing any time. Fair?"`
      },
      objections: {
        "We already have a Salesforce partner": `"Makes sense — most companies do. Quick question: are they bringing you insights on the new AI capabilities, or is that not really their focus? [If not] We've put together a deck on implementing AI in Salesforce with real business impact — practical, not theoretical. Might be a useful benchmark even if you stay with your current partner. Worth sending over?"`,
        "We're not looking for new vendors": `"Completely fair — I'm not asking you to switch anything today. What I can offer is our AI implementation deck — it shows how companies are getting real results from Salesforce AI. Good for staying current even if you're not making changes. Can I send it over so you have it when the time is right?"`,
        "Send me an email instead": `"Happy to. I'll include our AI implementation deck — it's the most useful thing I can share. It covers how to implement Salesforce AI with real business impact. Take a look, and if it resonates, we can talk further. What email should I use?"`,
        "We handle Salesforce in-house": `"That's great — strong internal teams are valuable. We've put together a deck on AI implementation in Salesforce that might be useful for your team — practical frameworks and real results, not vendor marketing. Could save them some research time. Worth sending over?"`,
        "We're not ready for AI yet": `"Honestly, that's what most companies say — and it's fair. What's changed is that Salesforce has made AI much more accessible. We've put together a deck that shows what's actually possible now and how to implement it with real impact. Good for planning even if you're not ready to move yet. Can I send it over?"`,
        "What makes you different?": `"Three things. First, we're Australia's most cost-effective Salesforce implementation partner — our hybrid onshore-offshore model means Australian project leadership with global development capacity at 30-40% lower cost. Second, we're 300 people focused only on Salesforce — not a generalist consultancy. Third, we're genuinely current on AI implementation — we've put together a deck on how to do it with real business impact. Want me to send it so you can see our thinking?"`,
        "Offshore development concerns me": `"That's a fair concern — and exactly why we built a hybrid model. Your project leads and architects are onshore, right here in Australia. The offshore team handles development under their direct supervision. You get local accountability with the cost benefits of a global team. It's how we deliver enterprise quality at 30-40% lower cost. Want to see how it works in practice?"`,
        "We're happy with our current setup": `"Glad to hear it. Quick question: are you using any of the new AI features — Agentforce, Einstein Copilot? Those are where we're seeing the biggest impact. We have a deck on implementing AI in Salesforce that might be useful even if you're not making changes — good for staying current. Worth sending over?"`,
        "Call me back later": `"Totally fair. Let me send you our AI implementation deck in the meantime — it's practical and worth a look when you have 10 minutes. I'll follow up in a couple weeks to see if it sparked any questions. If the timing's better then, we can set up a proper conversation. Sound good?"`,
        "Too expensive": `"I understand budget is critical. Here's the thing — our hybrid model means we deliver at 30-40% less than traditional consultancies. And the AI features we implement typically show ROI in months, not years. One client cut support ticket volume by 40% in 8 weeks. Would it help to see a business case from a similar company?"`
      },
      followUp: {
        call: `"Hi [NAME], it's [YOUR_NAME] from Fexle. I sent over our AI implementation deck last week — did you get a chance to look at it? [If yes] What stood out to you? [If no] No worries — I know things get busy. The key takeaway is how companies are using Agentforce to cut support costs and Einstein to improve sales performance — real results, not just theory. Would it be worth a quick call with our CEO to explore whether any of that applies to your situation?"`,
        email: {
          subject: "Quick question about the AI deck",
          body: `Hi [NAME],

I sent over our Salesforce AI implementation deck last week. Curious if anything resonated — particularly the sections on [support cost reduction / sales performance improvement].

If it's useful, I'd love to connect you with our CEO for a 20-minute conversation to go deeper. If the timing's not right, no worries — just let me know and I'll check back in a few months.

— [YOUR_NAME]`
        }
      },
      keyMessages: [
        "Fexle — 300-person Salesforce specialist based in Sydney",
        "Australia's most cost-effective Salesforce implementation partner",
        "Hybrid onshore-offshore — Australian leadership, global development capacity, 30-40% lower cost",
        "Agentforce, Einstein Copilot, automated workflows — stuff that actually works now",
        "One client cut support ticket volume by 40% in 8 weeks",
        "Our AI implementation deck — practical, not theoretical, shows how to get real results",
        "20-minute call with our CEO — no pitch, just a conversation"
      ],
      // Scripts for prospects NOT currently using Salesforce
      openingsNonSF: {
        crmPain: {
          name: "CRM Pain Question (Recommended)",
          script: `"Hi [NAME], this is [YOUR_NAME] from Fexle. I'll be quick — I'm calling because we help mid-sized Australian companies get better visibility into their sales pipeline and customer relationships. Quick question: are you happy with how you're currently tracking customer interactions and sales opportunities, or is that an area where you're looking to improve?"`,
          why: "Opens with business value, not product. Gets them talking about their current situation without assuming any tool."
        },
        growthChallenge: {
          name: "Growth Challenge Question",
          script: `"Hi [NAME], this is [YOUR_NAME] from Fexle. Quick question for you — as your business has grown, has keeping track of customer relationships and sales opportunities become harder, or do you have that pretty well sorted?"`,
          why: "Connects to a universal growth pain point. Works whether they use spreadsheets, basic tools, or nothing at all."
        },
        techStack: {
          name: "Tech Stack Curiosity",
          script: `"Hi [NAME], this is [YOUR_NAME] from Fexle. We're a Salesforce implementation partner, and I'm curious — what are you using to manage customer relationships and sales tracking today? Spreadsheets, another CRM, or something else?"`,
          why: "Direct and honest. Gets intel on their current setup immediately so you can tailor the conversation."
        },
        aiOpportunity: {
          name: "AI Opportunity Question",
          script: `"Hi [NAME], this is [YOUR_NAME] from Fexle. I'll be honest — this is a cold call, so I'll keep it short. We're seeing a lot of companies looking at AI to automate customer service and boost sales productivity. Is that something on your radar, or is that not where your priorities are right now?"`,
          why: "Leads with AI value prop which is relevant regardless of current CRM. Opens door to discuss Salesforce as the AI-ready platform."
        },
        competitorPain: {
          name: "Current System Frustration",
          script: `"Hi [NAME], this is [YOUR_NAME] from Fexle. We specialise in helping companies move to Salesforce from other systems — or from spreadsheets and manual processes. Quick question: are you getting everything you need from your current setup, or are there gaps that are starting to slow the business down?"`,
          why: "Positions migration expertise upfront. Invites them to share frustrations with their current approach."
        }
      },
      pivotsNonSF: {
        fromSpreadsheets: `"I hear that a lot — spreadsheets work until they don't. The challenge is when you need to see your full pipeline at a glance, or when multiple people need to update the same data, or when a key person leaves and takes all the relationship knowledge with them. That's exactly when companies look at Salesforce. The good news is, Salesforce has gotten much more accessible, and with Fexle's hybrid model, we can implement it at 30-40% less than the big consultancies. Would it be worth a quick conversation to see what's actually involved?"`,
        fromHubSpot: `"HubSpot's a good starting point, but a lot of companies outgrow it — especially around reporting, workflow automation, and now AI. Salesforce's new AI features like Agentforce and Einstein are genuinely game-changing, and HubSpot isn't anywhere close. The other thing is scale — Salesforce handles enterprise complexity that HubSpot struggles with. We've helped several companies migrate from HubSpot to Salesforce, and the ROI is usually clear within months. Want to hear what that looks like?"`,
        fromDynamics: `"Dynamics works for some companies, but what we often hear is that it's clunky, the Salesforce integrations are better, and the AI features aren't as mature. Salesforce has really pulled ahead on the AI side — Agentforce, Einstein Copilot, automated workflows. And as a pure-play Salesforce partner, we can implement faster and at lower cost than the Microsoft consultancies. Would it be worth exploring what a migration could look like?"`,
        fromLegacy: `"Legacy systems are tough — they work until you need them to do something new. The challenge is they can't adapt to things like AI, modern integrations, or mobile access. A lot of companies are facing this right now. Salesforce is designed to evolve with you, and with the new AI capabilities, you're not just fixing today's problems — you're setting up for the next 10 years. We specialise in helping companies migrate from legacy systems. Would a conversation about what's involved be useful?"`,
        fromNothing: `"Honestly, that's where a lot of growing companies are. You get by with spreadsheets and email until suddenly you can't — deals fall through, customer history is scattered, and growth actually becomes harder. The smart move is getting on a proper platform before it becomes urgent. Salesforce is the market leader for good reason, and with Fexle's hybrid model, it's more affordable than most people think. Would it be useful to see what's actually involved in getting started?"`,
        aiAngle: `"Here's what's changed: AI is no longer future stuff — it's working right now. Salesforce's Agentforce can handle customer inquiries 24/7, Einstein Copilot helps sales reps work faster, and automated workflows can replace hours of manual work. But you need a platform that supports it. Salesforce is purpose-built for AI in a way that other CRMs and definitely spreadsheets aren't. And with Fexle, you get Salesforce implementation at 30-40% less than traditional consultancies. Would it be worth exploring what AI could do for your business?"`
      },
      objectionsNonSF: {
        "We use HubSpot and it works fine": `"That's fair — HubSpot is solid for getting started. The question is: are you bumping into its limits yet? Things like complex reporting, workflow automation, or scaling with your growth? And the big one now is AI — Salesforce's Agentforce and Einstein are way ahead of anything HubSpot offers. We've helped companies migrate when they hit that ceiling. Would it be useful to understand what the upgrade path looks like, even if you're not ready now?"`,
        "We use Dynamics 365": `"Makes sense — it's a common choice, especially for Microsoft shops. What we often hear is that the CRM side of Dynamics is clunky compared to Salesforce, and the ecosystem isn't as rich. Plus Salesforce is genuinely ahead on AI right now. We've done several Dynamics to Salesforce migrations, and the feedback is usually 'wish we'd done this sooner.' Would it be worth a conversation about what's involved?"`,
        "We just use spreadsheets": `"Honestly, a lot of companies do — and it works until it doesn't. The tipping point is usually when you can't see your full pipeline, when deals slip through the cracks, or when someone leaves and takes all the relationship knowledge with them. The good news is Salesforce is more accessible than people think, especially with Fexle's 30-40% lower cost model. Would it be useful to see what getting started actually looks like?"`,

    // ==================== GOOGLE SHEETS INTEGRATION ====================

    const SHEETS_COLUMNS = {
      leads: [
        'id', 'company', 'contact', 'title', 'phone', 'email', 'vertical', 
        'score', 'status', 'source', 'companySize', 'revenue', 'employeeCount',
        'website', 'linkedinUrl', 'city', 'state', 'industry', 'lastContact',

    // Convert lead object to row array for Sheets
    const leadToRow = (lead) => {
      return SHEETS_COLUMNS.leads.map(col => {
        const val = lead[col];
        if (val === null || val === undefined) return '';
        if (typeof val === 'object') return JSON.stringify(val);
        return String(val);
      });
    };

    // Convert row array from Sheets to lead object
    const rowToLead = (row, headers) => {
      const lead = {};
      headers.forEach((header, i) => {
        let val = row[i] || '';
        // Parse JSON fields
        if (['intentSignals', 'research', 'technologies', 'intentTopics'].includes(header)) {
          try {
            val = val ? JSON.parse(val) : null;
          } catch (e) {
            val = null;
          }
        }
        // Parse numbers
        if (['score', 'employeeCount', 'id', 'leadId'].includes(header)) {
          val = val ? parseInt(val) : (header === 'score' ? 50 : 0);
        }
        // Parse booleans
        if (header === 'completed') {
          val = val === 'true' || val === true;
        }
        lead[header] = val;
      });
      return lead;
    };

    // Google Sheets API wrapper
    const GoogleSheetsAPI = {
      // Fetch all leads from Google Sheet
      fetchLeads: async (webAppUrl) => {
        try {
          const response = await fetch(`${webAppUrl}?action=getLeads`, {
            method: 'GET',
            mode: 'cors'
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          if (data.error) throw new Error(data.error);
          
          const headers = data.headers || SHEETS_COLUMNS.leads;
          return (data.rows || []).map(row => rowToLead(row, headers));
        } catch (error) {
          console.error('Error fetching leads from Sheets:', error);
          throw error;

      // Fetch all tasks from Google Sheet
      fetchTasks: async (webAppUrl) => {

          const data = await response.json();
          if (data.error) throw new Error(data.error);

          return (data.rows || []).map(row => rowToLead(row, headers));

          console.error('Error fetching tasks from Sheets:', error);
          throw error;

      // Sync leads to Google Sheet (upsert)
      syncLeads: async (webAppUrl, leads, userName) => {
        try {
          const rows = leads.map(lead => ({
            ...lead,
            assignedTo: lead.assignedTo || userName,
            syncedAt: new Date().toISOString(),
            localModified: false
          })).map(leadToRow);

          const response = await fetch(webAppUrl, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'syncLeads',
              headers: SHEETS_COLUMNS.leads,
              rows: rows,
              userName: userName
            })
          });
          
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          if (data.error) throw new Error(data.error);
          return data;
        } catch (error) {
          console.error('Error syncing leads to Sheets:', error);
          throw error;
        }
      },

      // Sync tasks to Google Sheet
      syncTasks: async (webAppUrl, tasks, userName) => {
        try {
          const rows = tasks.map(task => {
            const row = {};
            SHEETS_COLUMNS.tasks.forEach(col => {
              row[col] = task[col] !== undefined ? task[col] : '';
            });
            row.assignedTo = task.assignedTo || userName;
            row.syncedAt = new Date().toISOString();
            return SHEETS_COLUMNS.tasks.map(col => String(row[col] || ''));
          });

          const response = await fetch(webAppUrl, {
            method: 'POST',
            mode: 'cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              action: 'syncTasks',

    // Merge strategy for syncing
    const mergeLeads = (localLeads, remoteLeads, strategy = 'remote-wins') => {
      const merged = new Map();
      
      // Index remote leads by ID
      remoteLeads.forEach(lead => {
        if (lead.id) merged.set(String(lead.id), { ...lead, source: 'remote' });
      });
      
      // Merge local leads
      localLeads.forEach(lead => {
        const id = String(lead.id);
        const existing = merged.get(id);
        
        if (!existing) {
          // New local lead
          merged.set(id, { ...lead, localModified: true });
        } else if (strategy === 'local-wins') {
          // Local takes precedence
          merged.set(id, { ...existing, ...lead });
        } else if (strategy === 'remote-wins') {
          // Remote takes precedence, but keep local modifications if newer
          const localDate = new Date(lead.lastContactDate || lead.createdDate || 0);
          const remoteDate = new Date(existing.syncedAt || 0);
          if (localDate > remoteDate) {
            merged.set(id, { ...existing, ...lead, localModified: true });
          }
        } else if (strategy === 'merge') {
          // Merge non-empty fields
          const mergedLead = { ...existing };
          Object.keys(lead).forEach(key => {
            if (lead[key] && (!existing[key] || existing[key] === '')) {
              mergedLead[key] = lead[key];
            }
          });
          merged.set(id, mergedLead);
        }
      });
      
      return Array.from(merged.values());
    };

    // ==================== CSV FUNCTIONS ====================
    const parseCSV = (csvText) => {
      const lines = csvText.trim().split('\n');
      if (lines.length < 2) return [];
      
      const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/['"]/g, ''));
      const leads = [];
      
      for (let i = 1; i < lines.length; i++) {
        const values = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
        const cleanValues = values.map(v => v.replace(/^"|"$/g, '').trim());
        
        if (cleanValues.length > 0) {
          const lead = {
            id: Date.now() + i,
            company: cleanValues[headers.indexOf('company')] || cleanValues[0] || '',
            contact: cleanValues[headers.indexOf('contact')] || cleanValues[headers.indexOf('name')] || cleanValues[1] || '',
            title: cleanValues[headers.indexOf('title')] || cleanValues[headers.indexOf('role')] || cleanValues[2] || '',
            phone: cleanValues[headers.indexOf('phone')] || cleanValues[3] || '',

// Paste this code in Extensions → Apps Script

function doGet(e) {
  const action = e.parameter.action;
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  
  try {
    if (action === 'getLeads') {
      return getSheetData(ss, 'Leads');
    } else if (action === 'getTasks') {
      return getSheetData(ss, 'Tasks');
    } else if (action === 'status') {
      return jsonResponse({ 
        status: 'connected', 
        sheetName: ss.getName(),
        leadsCount: getRowCount(ss, 'Leads'),
        tasksCount: getRowCount(ss, 'Tasks')
      });
    }
    return jsonResponse({ error: 'Unknown action' });
  } catch (error) {
    return jsonResponse({ error: error.message });
  }
}

function doPost(e) {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  const data = JSON.parse(e.postData.contents);
  
  try {
    if (data.action === 'syncLeads') {
      return syncData(ss, 'Leads', data.headers, data.rows);
    } else if (data.action === 'syncTasks') {
      return syncData(ss, 'Tasks', data.headers, data.rows);
    } else if (data.action === 'deleteLead') {
      return deleteRow(ss, 'Leads', data.leadId);
    }
    return jsonResponse({ error: 'Unknown action' });
  } catch (error) {
    return jsonResponse({ error: error.message });
  }
}

function getSheetData(ss, sheetName) {
  let sheet = ss.getSheetByName(sheetName);
  if (!sheet) {
    sheet = ss.insertSheet(sheetName);
    return jsonResponse({ headers: [], rows: [] });
  }
  
  const data = sheet.getDataRange().getValues();
  if (data.length === 0) {
    return jsonResponse({ headers: [], rows: [] });
  }
  
  const headers = data[0];
  const rows = data.slice(1);
  
  return jsonResponse({ headers, rows });
}

function syncData(ss, sheetName, headers, rows) {
  let sheet = ss.getSheetByName(sheetName);
  if (!sheet) {
    sheet = ss.insertSheet(sheetName);
  }
  
  // Get existing data
  const existingData = sheet.getDataRange().getValues();
  const existingHeaders = existingData[0] || [];
  const existingRows = existingData.slice(1);
  
  // Create ID index for existing rows
  const idIndex = existingHeaders.indexOf('id');
  const existingById = {};
  if (idIndex >= 0) {
    existingRows.forEach((row, i) => {
      existingById[row[idIndex]] = i + 2; // +2 for 1-indexed + header
    });
  }
  
  // Set headers if empty
  if (existingHeaders.length === 0) {
    sheet.getRange(1, 1, 1, headers.length).setValues([headers]);
  }
  
  // Upsert rows
  let updated = 0, inserted = 0;
  rows.forEach(row => {
    const rowId = row[headers.indexOf('id')];
    if (existingById[rowId]) {
      // Update existing row
      sheet.getRange(existingById[rowId], 1, 1, row.length).setValues([row]);
      updated++;
    } else {
      // Insert new row
      sheet.appendRow(row);
      inserted++;
    }
  });
  
  return jsonResponse({ 
    success: true, 
    updated, 
    inserted,
    total: rows.length 
  });
}

function deleteRow(ss, sheetName, id) {
  const sheet = ss.getSheetByName(sheetName);
  if (!sheet) return jsonResponse({ error: 'Sheet not found' });
  
  const data = sheet.getDataRange().getValues();
  const headers = data[0];
  const idIndex = headers.indexOf('id');
  
  if (idIndex < 0) return jsonResponse({ error: 'No ID column' });
  
  for (let i = data.length - 1; i >= 1; i--) {
    if (String(data[i][idIndex]) === String(id)) {
      sheet.deleteRow(i + 1);
      return jsonResponse({ success: true, deleted: id });
    }
  }
  
  return jsonResponse({ error: 'ID not found' });
}

function getRowCount(ss, sheetName) {
  const sheet = ss.getSheetByName(sheetName);
  return sheet ? Math.max(0, sheet.getLastRow() - 1) : 0;
}

function jsonResponse(data) {
  return ContentService
    .createTextOutput(JSON.stringify(data))
    .setMimeType(ContentService.MimeType.JSON);
}`}</pre>

                    onChange={(e) => setMeetingDetails({ ...meetingDetails, description: e.target.value })}
                    rows={4}
                    className="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                  />
                </div>
              </div>

              <div className="mt-6 space-y-3">
                <button
                  onClick={handleMeetingDownload}
                  disabled={!meetingDetails.startDate || !meetingDetails.startTime}
                  className="w-full py-3 bg-green-600 text-white rounded-xl font-medium hover:bg-green-700 transition-colors disabled:bg-gray-300 disabled:cursor-not-allowed"
                >
                  📥 Download .ICS Calendar Invite
                </button>
                <p className="text-xs text-gray-500 text-center">
                  Download the .ics file and attach it to your confirmation email to the prospect.
                  They can open it to add the meeting to their calendar.
                </p>
              </div>
            </div>
          </div>
        );

      // ==================== CEO CALENDAR COMPONENT ====================
      const CEOCalendar = () => {
        const timeSlots = ['09:00', '09:30', '10:00', '10:30', '11:00', '11:30', '12:00', '12:30', '13:00', '13:30', '14:00', '14:30', '15:00', '15:30', '16:00', '16:30', '17:00'];
        
        const getWeekDays = () => {
          const days = [];
          for (let i = 0; i < 5; i++) {
            const day = new Date(calendarWeekStart);
            day.setDate(day.getDate() + i);
            days.push(day);
          }
          return days;
        };

        const weekDays = getWeekDays();
        const today = new Date().toISOString().split('T')[0];

        const navigateWeek = (direction) => {
          const newStart = new Date(calendarWeekStart);
          newStart.setDate(newStart.getDate() + (direction * 7));
          setCalendarWeekStart(newStart);
        };

        const formatDate = (date) => date.toISOString().split('T')[0];
        
        const handleSlotClick = (date, time) => {
          const dateStr = formatDate(date);
          const booked = isSlotBooked(dateStr, time);
          const available = isSlotAvailable(dateStr, time);

          if (booked) {
            // Show booked meeting details
            setSelectedSlotForBooking({ ...booked, isBooked: true });
          } else if (selectedLead) {
            // Lead is selected - show booking form (schedule challenge if not available)
            setSelectedSlotForBooking({
              date: dateStr,
              time,
              id: `${dateStr}-${time}`,
              isScheduleChallenge: !available
            });
          } else {
            // No lead selected - toggle availability on/off
            toggleAvailability(dateStr, time);
            setSelectedSlotForBooking(null); // Clear sidebar
          }
        };

        const handleQuickBook = () => {
          if (!selectedSlotForBooking || !selectedLead) return;
          
          const isScheduleChallenge = selectedSlotForBooking.isScheduleChallenge;
          
          // For schedule challenge, we don't remove from availability (it wasn't there)
          const meeting = {
            id: `meeting-${Date.now()}`,
            date: selectedSlotForBooking.date,
            time: selectedSlotForBooking.time,
            duration: 20,
            leadId: selectedLead.id,
            leadName: selectedLead.contact,
            company: selectedLead.company,
            email: selectedLead.email,
            isScheduleChallenge: isScheduleChallenge,
            createdAt: new Date().toISOString()
          };
          
          setBookedMeetings([...bookedMeetings, meeting]);
          
          // Only remove from availability if it was an available slot
          if (!isScheduleChallenge) {
            setCeoAvailability(ceoAvailability.filter(s => s.id !== selectedSlotForBooking.id));
          }
          
          const scheduleNote = isScheduleChallenge 
            ? `\\n\\n⚠️ SCHEDULE CHALLENGE: This meeting was booked outside normal CEO availability windows at the prospect's request. Please confirm CEO availability.`
            : '';
          
          downloadICSFile({
            startDate: meeting.date,
            startTime: meeting.time,
            duration: meeting.duration,
            location: 'Video Call - Link to follow',
            title: isScheduleChallenge 
              ? `⚠️ [SCHEDULE CHALLENGE] Fexle CEO Call - ${selectedLead.company}`
              : `Fexle CEO Call - ${selectedLead.company}`,
            description: `20-minute conversation with Fexle CEO to discuss Salesforce AI innovations.${scheduleNote}`,
            attendeeName: selectedLead.contact,
            attendeeEmail: selectedLead.email,
            attendeeCompany: selectedLead.company
          });

          setLeads(leads.map(l => 
            l.id === selectedLead.id 
              ? { ...l, status: 'CEO Meeting Booked', lastContact: 'Just now', lastContactDate: new Date().toISOString() }
              : l
          ));

          const meetingDate = new Date(meeting.date);
          const reminderDate = new Date(meetingDate);
          reminderDate.setDate(reminderDate.getDate() - 1);

          setTasks([...tasks, {
            id: Date.now(),
            leadId: selectedLead.id,
            type: 'meeting',
            description: isScheduleChallenge 
              ? `⚠️ CONFIRM CEO AVAILABILITY: Meeting with ${selectedLead.company}`
              : `Prep for CEO meeting with ${selectedLead.company}`,
            dueDate: reminderDate.toISOString().split('T')[0],
            dueTime: '09:00',
            completed: false,
            createdAt: new Date().toISOString()
          }]);

          setSelectedSlotForBooking(null);
          showNotification(isScheduleChallenge 
            ? `⚠️ Schedule Challenge booked! Confirm with CEO.`
            : `Meeting booked! ICS file downloaded.`
          );
        };

        const addBulkAvailability = (preset) => {
          const newSlots = [];
          weekDays.forEach(day => {
            const dateStr = formatDate(day);
            if (new Date(dateStr) < new Date(today)) return;
            
            let times = [];
            if (preset === 'morning') times = ['09:00', '09:30', '10:00', '10:30', '11:00', '11:30'];
            if (preset === 'afternoon') times = ['14:00', '14:30', '15:00', '15:30', '16:00', '16:30'];
            if (preset === 'all') times = timeSlots.filter(t => t !== '12:00' && t !== '12:30');
            
            times.forEach(time => {
              const slotId = `${dateStr}-${time}`;
              if (!ceoAvailability.find(s => s.id === slotId) && !isSlotBooked(dateStr, time)) {
                newSlots.push({ id: slotId, date: dateStr, time, duration: 30 });
              }
            });
          });
          
          setCeoAvailability([...ceoAvailability, ...newSlots]);
          showNotification(`Added ${newSlots.length} available slots`);
        };

        const clearWeekAvailability = () => {
          const weekDates = weekDays.map(d => formatDate(d));
          setCeoAvailability(ceoAvailability.filter(s => !weekDates.includes(s.date)));
          showNotification('Cleared availability for this week');
        };

        return (
          <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-6xl max-h-[95vh] overflow-hidden flex flex-col">
              {/* Header */}
              <div className="px-6 py-4 border-b border-gray-200 flex items-center justify-between bg-gradient-to-r from-orange-500 to-amber-500 text-white">
                <div>
                  <h3 className="text-xl font-bold">📅 CEO Availability Calendar</h3>
                  <p className="text-orange-100 text-sm">Click slots to mark available • Click available slots to book</p>
                </div>
                <button onClick={() => setShowCalendarModal(false)} className="text-white hover:bg-white/20 rounded-lg p-2 text-xl">&times;</button>
              </div>

              <div className="flex flex-1 overflow-hidden">
                {/* Calendar Grid */}
                <div className="flex-1 p-4 overflow-auto">
                  {/* Week Navigation */}
                  <div className="flex items-center justify-between mb-4">
                    <button onClick={() => navigateWeek(-1)} className="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium">← Prev</button>
                    <h4 className="font-semibold text-gray-900">
                      {weekDays[0].toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })} - {weekDays[4].toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}
                    </h4>
                    <button onClick={() => navigateWeek(1)} className="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium">Next →</button>
                  </div>

                  {/* Quick Actions */}
                  <div className="flex gap-2 mb-4 flex-wrap">
                    <span className="text-sm text-gray-500 py-2">Quick add:</span>
                    <button onClick={() => addBulkAvailability('morning')} className="px-3 py-1.5 bg-blue-100 text-blue-700 rounded-lg text-sm hover:bg-blue-200">+ Mornings</button>
                    <button onClick={() => addBulkAvailability('afternoon')} className="px-3 py-1.5 bg-blue-100 text-blue-700 rounded-lg text-sm hover:bg-blue-200">+ Afternoons</button>
                    <button onClick={() => addBulkAvailability('all')} className="px-3 py-1.5 bg-green-100 text-green-700 rounded-lg text-sm hover:bg-green-200">+ Full Days</button>
                    <button onClick={clearWeekAvailability} className="px-3 py-1.5 bg-red-100 text-red-700 rounded-lg text-sm hover:bg-red-200">Clear Week</button>
                  </div>

                  {/* Calendar Grid */}
                  <div className="border border-gray-200 rounded-xl overflow-hidden">
                    {/* Day Headers */}
                    <div className="grid grid-cols-6 bg-gray-50 border-b border-gray-200">
                      <div className="p-3 text-xs font-medium text-gray-500 border-r border-gray-200">Time</div>
                      {weekDays.map(day => {
                        const dateStr = formatDate(day);
                        const isToday = dateStr === today;
                        const isPast = new Date(dateStr) < new Date(today);
                        return (
                          <div key={dateStr} className={`p-3 text-center border-r border-gray-200 last:border-r-0 ${isToday ? 'bg-blue-50' : ''} ${isPast ? 'opacity-50' : ''}`}>
                            <div className="text-xs font-medium text-gray-500">{day.toLocaleDateString('en-AU', { weekday: 'short' })}</div>
                            <div className={`text-lg font-bold ${isToday ? 'text-blue-600' : 'text-gray-900'}`}>{day.getDate()}</div>
                          </div>
                        );
                      })}
                    </div>

                    {/* Time Slots */}
                    <div className="max-h-[400px] overflow-y-auto">
                      {timeSlots.map(time => (
                        <div key={time} className="grid grid-cols-6 border-b border-gray-100 last:border-b-0">
                          <div className="p-2 text-xs text-gray-500 border-r border-gray-100 bg-gray-50 flex items-center justify-center">{time}</div>
                          {weekDays.map(day => {
                            const dateStr = formatDate(day);
                            const isPast = new Date(dateStr) < new Date(today);
                            const available = isSlotAvailable(dateStr, time);
                            const booked = isSlotBooked(dateStr, time);
                            
                            return (
                              <div
                                key={`${dateStr}-${time}`}
                                onClick={() => !isPast && handleSlotClick(day, time)}
                                className={`p-1 border-r border-gray-100 last:border-r-0 min-h-[40px] transition-all ${
                                  isPast ? 'bg-gray-100 cursor-not-allowed' 
                                    : booked ? (booked.isScheduleChallenge ? 'bg-amber-100 cursor-pointer hover:bg-amber-200' : 'bg-green-100 cursor-pointer hover:bg-green-200')
                                    : available ? 'bg-blue-100 cursor-pointer hover:bg-blue-200 border-2 border-blue-300' 
                                    : selectedLead ? 'hover:bg-amber-50 cursor-pointer border border-dashed border-gray-300' : 'hover:bg-gray-50 cursor-pointer'
                                }`}
                              >
                                {booked && <div className={`text-xs p-1 ${booked.isScheduleChallenge ? 'bg-amber-500' : 'bg-green-600'} text-white rounded truncate`}>{booked.isScheduleChallenge ? '⚠️ ' : ''}{booked.company?.substring(0, 10)}</div>}
                                {available && !booked && <div className="text-xs text-blue-600 text-center">✓</div>}
                              </div>
                            );
                          })}
                        </div>
                      ))}
                    </div>
                  </div>

                  {/* Legend */}
                  <div className="flex gap-4 mt-4 text-xs text-gray-500 flex-wrap">
                    <div className="flex items-center gap-2"><div className="w-4 h-4 bg-blue-100 border-2 border-blue-300 rounded"></div><span>Available</span></div>
                    <div className="flex items-center gap-2"><div className="w-4 h-4 bg-green-100 rounded"></div><span>Booked</span></div>
                    <div className="flex items-center gap-2"><div className="w-4 h-4 bg-amber-100 rounded"></div><span>Schedule Challenge</span></div>
                    <div className="flex items-center gap-2"><div className="w-4 h-4 bg-gray-100 rounded"></div><span>Unavailable</span></div>
                    {selectedLead && <div className="flex items-center gap-2"><div className="w-4 h-4 border border-dashed border-gray-400 rounded"></div><span>Click to book anyway</span></div>}
                  </div>
                </div>

                {/* Sidebar */}
                <div className="w-80 border-l border-gray-200 bg-gray-50 p-4 overflow-y-auto">
                  {selectedSlotForBooking ? (
                    selectedSlotForBooking.isBooked ? (
                      <div className="space-y-4">
                        <h4 className="font-semibold text-gray-900">
                          {selectedSlotForBooking.isScheduleChallenge ? '⚠️ Schedule Challenge Meeting' : '📅 Booked Meeting'}
                        </h4>
                        {selectedSlotForBooking.isScheduleChallenge && (
                          <div className="bg-amber-50 border border-amber-200 rounded-lg p-2">
                            <p className="text-xs text-amber-800">Booked outside normal CEO availability</p>
                          </div>
                        )}
                        <div className="bg-white rounded-xl p-4 shadow-sm">
                          <div className="text-lg font-bold text-gray-900">{selectedSlotForBooking.company}</div>
                          <div className="text-sm text-gray-600">{selectedSlotForBooking.leadName}</div>
                          <div className="text-sm text-gray-500 mt-2">{new Date(selectedSlotForBooking.date).toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
                          <div className="text-sm font-medium text-gray-900">{selectedSlotForBooking.time} AEST</div>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={() => {
                            const scheduleNote = selectedSlotForBooking.isScheduleChallenge 
                              ? `\\n\\n⚠️ SCHEDULE CHALLENGE: This meeting was booked outside normal CEO availability windows.`
                              : '';
                            downloadICSFile({
                              startDate: selectedSlotForBooking.date,
                              startTime: selectedSlotForBooking.time,
                              duration: selectedSlotForBooking.duration || 20,
                              location: 'Video Call - Link to follow',
                              title: selectedSlotForBooking.isScheduleChallenge 
                                ? `⚠️ [SCHEDULE CHALLENGE] Fexle CEO Call - ${selectedSlotForBooking.company}`
                                : `Fexle CEO Call - ${selectedSlotForBooking.company}`,
                              description: `CEO meeting with ${selectedSlotForBooking.leadName}${scheduleNote}`,
                              attendeeName: selectedSlotForBooking.leadName,
                              attendeeEmail: selectedSlotForBooking.email,
                              attendeeCompany: selectedSlotForBooking.company
                            });
                          }} className="flex-1 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">📥 Re-download ICS</button>
                          <button onClick={() => cancelMeeting(selectedSlotForBooking.id)} className="px-4 py-2 bg-red-100 text-red-700 rounded-lg text-sm font-medium hover:bg-red-200">Cancel</button>
                        </div>
                        <button onClick={() => setSelectedSlotForBooking(null)} className="w-full py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-100">Close</button>
                      </div>
                    ) : (
                      <div className="space-y-4">
                        <h4 className="font-semibold text-gray-900">
                          {selectedSlotForBooking.isScheduleChallenge ? '⚠️ Schedule Challenge' : '📅 Book This Slot'}
                        </h4>
                        
                        {selectedSlotForBooking.isScheduleChallenge && (
                          <div className="bg-amber-50 border border-amber-200 rounded-xl p-3">
                            <p className="text-sm text-amber-800 font-medium">Outside CEO Availability</p>
                            <p className="text-xs text-amber-700 mt-1">This time is not in the CEO's open slots. Book anyway if the prospect can't do other times.</p>
                          </div>
                        )}
                        
                        <div className="bg-white rounded-xl p-4 shadow-sm">
                          <div className="text-sm text-gray-500">{new Date(selectedSlotForBooking.date).toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
                          <div className="text-2xl font-bold text-gray-900">{selectedSlotForBooking.time}</div>
                          <div className="text-sm text-gray-500">AEST • 20 min</div>
                        </div>
                        {selectedLead ? (
                          <>
                            <div className="bg-blue-50 rounded-xl p-4">
                              <div className="text-xs text-blue-600 font-medium mb-1">BOOKING FOR</div>
                              <div className="font-semibold text-blue-900">{selectedLead.company}</div>
                              <div className="text-sm text-blue-700">{selectedLead.contact}</div>
                            </div>
                            <button onClick={handleQuickBook} className={`w-full py-3 text-white rounded-xl font-medium ${
                              selectedSlotForBooking.isScheduleChallenge 
                                ? 'bg-amber-600 hover:bg-amber-700' 
                                : 'bg-green-600 hover:bg-green-700'
                            }`}>
                              {selectedSlotForBooking.isScheduleChallenge 
                                ? '⚠️ Book Anyway & Download ICS' 
                                : '✓ Confirm & Download ICS'}
                            </button>
                          </>
                        ) : (
                          <div className="bg-amber-50 rounded-xl p-4">
                            <p className="text-sm text-amber-800">Select a lead first from Call Center to book this slot.</p>
                          </div>
                        )}
                        <button onClick={() => setSelectedSlotForBooking(null)} className="w-full py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-100">Cancel</button>
                      </div>
                    )
                  ) : (
                    <div className="space-y-4">
                      <h4 className="font-semibold text-gray-900">How to Use</h4>
                      <div className="space-y-3 text-sm text-gray-600">
                        <div className="flex gap-3"><span>1️⃣</span><span>Click empty slots to mark <strong>available</strong></span></div>
                        <div className="flex gap-3"><span>2️⃣</span><span>Select a lead in Call Center</span></div>
                        <div className="flex gap-3"><span>3️⃣</span><span>Click available slot to <strong>book</strong></span></div>
                        <div className="flex gap-3"><span>4️⃣</span><span>ICS downloads automatically</span></div>
                      </div>
                      <div className="border-t border-gray-200 pt-4">
                        <h4 className="font-semibold text-gray-900 mb-3">This Week</h4>
                        <div className="grid grid-cols-2 gap-3">
                          <div className="bg-white rounded-lg p-3 text-center shadow-sm">
                            <div className="text-2xl font-bold text-blue-600">{ceoAvailability.filter(s => weekDays.map(d => formatDate(d)).includes(s.date)).length}</div>
                            <div className="text-xs text-gray-500">Open</div>
                          </div>
                          <div className="bg-white rounded-lg p-3 text-center shadow-sm">
                            <div className="text-2xl font-bold text-green-600">{bookedMeetings.filter(m => weekDays.map(d => formatDate(d)).includes(m.date)).length}</div>
                            <div className="text-xs text-gray-500">Booked</div>
                          </div>
                        </div>
                      </div>
                      {bookedMeetings.length > 0 && (
                        <div className="border-t border-gray-200 pt-4">
                          <h4 className="font-semibold text-gray-900 mb-3">Upcoming</h4>
                          <div className="space-y-2 max-h-40 overflow-y-auto">
                            {bookedMeetings.filter(m => new Date(m.date) >= new Date(today)).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5).map(m => (
                              <div key={m.id} onClick={() => setSelectedSlotForBooking({ ...m, isBooked: true })} className="bg-white rounded-lg p-3 shadow-sm cursor-pointer hover:bg-gray-50">
                                <div className="font-medium text-gray-900 text-sm truncate">{m.company}</div>
                                <div className="text-xs text-gray-500">{new Date(m.date).toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' })} • {m.time}</div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                      {selectedLead && (
                        <div className="border-t border-gray-200 pt-4">
                          <div className="bg-blue-50 rounded-lg p-3">
                            <div className="text-xs text-blue-600 font-medium">SELECTED LEAD</div>
                            <div className="font-medium text-blue-900">{selectedLead.company}</div>
                            <div className="text-sm text-blue-700">{selectedLead.contact}</div>
                          </div>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      };

      // ==================== MAIN RENDER ====================
      return (
        <div className="min-h-screen bg-gray-50">
          {/* Notification */}
          {notification && (
            <div className={`fixed top-4 right-4 z-50 px-6 py-3 rounded-lg shadow-lg text-white ${
              notification.type === 'error' ? 'bg-red-600' : 'bg-green-600'
            }`}>
              {notification.message}
            </div>
          )}

          {/* Header */}
          <header className="bg-white border-b border-gray-200 sticky top-0 z-40">
            <div className="max-w-7xl mx-auto px-6 py-4">
              <div className="flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 bg-gradient-to-br from-blue-600 to-indigo-600 rounded-xl flex items-center justify-center shadow-lg shadow-blue-200">
                    <span className="text-white text-lg font-bold">F</span>
                  </div>
                  <div>
                    <h1 className="text-xl font-bold text-gray-900">Fexle Sales Engine</h1>
                    <p className="text-xs text-gray-500">AI-Powered Cold Calling & Lead Generation</p>
                  </div>
                </div>
                <div className="flex items-center gap-4">
                  <nav className="flex gap-1 bg-gray-100 p-1 rounded-xl">
                    {[
                      { id: 'dashboard', label: '🎯 Today' },
                      { id: 'callCenter', label: '📞 Call Center' },
                      { id: 'playbooks', label: '📋 Playbooks' },
                    ].map(tab => (
                      <button
                        key={tab.id}
                        onClick={() => setActiveTab(tab.id)}
                        className={`px-4 py-2 rounded-lg text-sm font-medium transition-all ${
                          activeTab === tab.id ? 'bg-white text-gray-900 shadow-sm' : 'text-gray-600 hover:text-gray-900'
                        }`}
                      >
                        {tab.label}
                      </button>
                    ))}
                  </nav>
                  
                  {/* Google Sheets Sync Button */}
                  {sheetsConnected && (
                    <button 
                      onClick={() => syncToSheets()}
                      disabled={syncStatus.syncing}
                      className={`px-3 py-2 rounded-xl text-sm font-medium transition-colors flex items-center gap-1 ${
                        syncStatus.syncing 
                          ? 'bg-gray-100 text-gray-400' 
                          : 'bg-green-100 text-green-700 hover:bg-green-200'
                      }`}
                      title={syncStatus.lastSync ? `Last sync: ${new Date(syncStatus.lastSync).toLocaleTimeString()}` : 'Sync to Google Sheets'}
                    >
                      {syncStatus.syncing ? '⏳' : '📊'} Sync
                    </button>
                  )}
                  
                  <button onClick={() => setShowApolloModal(true)} className="px-4 py-2 bg-gradient-to-r from-purple-600 to-indigo-600 text-white rounded-xl text-sm font-medium hover:from-purple-700 hover:to-indigo-700 transition-colors shadow-lg shadow-purple-200">
                    🚀 Apollo Search
                  </button>
                  <button onClick={() => setShowSourceStats(true)} className="px-3 py-2 bg-gray-100 text-gray-700 rounded-xl text-sm font-medium hover:bg-gray-200 transition-colors">
                    📊
                  </button>
                  <button onClick={() => setShowAddLead(true)} className="px-4 py-2 bg-blue-600 text-white rounded-xl text-sm font-medium hover:bg-blue-700 transition-colors shadow-lg shadow-blue-200">
                    + Add Lead
                  </button>
                  <button onClick={() => setShowCalendarModal(true)} className="px-4 py-2 bg-gradient-to-r from-orange-500 to-amber-500 text-white rounded-xl text-sm font-medium hover:from-orange-600 hover:to-amber-600 transition-colors shadow-lg shadow-orange-200">
                    📅 CEO Calendar
                  </button>
                </div>
              </div>
            </div>
          </header>

          {/* Main Content */}
          <main className="max-w-7xl mx-auto px-6 py-6">
            {activeTab === 'dashboard' && <Dashboard />}
            {activeTab === 'callCenter' && <CallCenter />}
            {activeTab === 'playbooks' && <Playbooks />}
          </main>

          {/* Modals */}
          {showAddLead && addLeadModalContent}
          {showImportModal && importModalContent}
          {showApolloModal && apolloModalContent}
          {showSourceStats && sourceStatsModalContent}
          {showScoreBreakdown && scoreBreakdownModalContent}
          {showSheetsModal && sheetsSetupModalContent}
          {showResearchModal && researchModalContent}
          {showSettings && settingsModalContent}
          {showTaskModal && taskModalContent}
          {showEmailModal && emailModalContent}
          {showMeetingModal && meetingModalContent}
          {showCalendarModal && <CEOCalendar />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
