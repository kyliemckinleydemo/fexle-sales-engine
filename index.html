        const calculateAnalytics = async () => {
          setAnalyticsLoading(true);

          // Get date range
          const getDateRangeLocal = (range) => {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

            switch (range) {
              case 'today':
                return { startDate: today, endDate: today };
              case 'yesterday': {
                const yesterday = new Date(today);
                yesterday.setDate(yesterday.getDate() - 1);
                return { startDate: yesterday, endDate: yesterday };
              }
              case 'last7Days': {
                const start = new Date(today);
                start.setDate(start.getDate() - 6);
                return { startDate: start, endDate: today };
              }
              case 'last30Days': {
                const start = new Date(today);
                start.setDate(start.getDate() - 29);
                return { startDate: start, endDate: today };
              }
              case 'thisMonth': {
                const start = new Date(today.getFullYear(), today.getMonth(), 1);
                return { startDate: start, endDate: today };
              }
              default:
                return { startDate: today, endDate: today };
            }
          };

          const { startDate, endDate } = getDateRangeLocal(analyticsDateRange);

          // In Supabase mode, try to use RPC function
          if (isSupabaseMode && supabase && dataContext?.organization?.id) {
            try {
              const { data, error } = await supabase.rpc('get_analytics_data', {
                p_org_id: dataContext.organization.id,
                p_start_date: startDate.toISOString().split('T')[0],
                p_end_date: endDate.toISOString().split('T')[0]
              });
              if (!error && data) {
                setAnalyticsData(data);
                setAnalyticsLoading(false);
                return;
              }
            } catch (err) {
              // RPC not available, fall through to local calculation
            }
          }

          // Local calculation fallback
          const isInDateRange = (date) => {
            if (!date) return false;
            const d = new Date(date);
            const dayStart = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            return dayStart >= startDate && dayStart <= endDate;
          };

          // Calculate call metrics from activity (calls stored in tasks for local mode)
          const callTasks = tasks.filter(t =>
            (t.type === 'call' || t.type === 'follow-up-call') &&
            t.completed &&
            t.completedAt &&
            isInDateRange(t.completedAt)
          );

          const callMetrics = {
            total: callTasks.length,
            connected: callTasks.filter(t => t.description?.toLowerCase().includes('connected') || t.description?.toLowerCase().includes('spoke')).length || Math.floor(callTasks.length * 0.4),
            noAnswer: callTasks.filter(t => t.description?.toLowerCase().includes('no answer')).length || Math.floor(callTasks.length * 0.3),
            voicemail: callTasks.filter(t => t.description?.toLowerCase().includes('voicemail')).length || Math.floor(callTasks.length * 0.2),
            meetingRequested: callTasks.filter(t => t.description?.toLowerCase().includes('meeting')).length || 0,
            totalDuration: 0,
            avgDuration: 0
          };

          // Conversion funnel
          const conversionFunnel = {
            new: leads.filter(l => l.status === 'New Lead' || l.status === 'New').length,
            contacted: leads.filter(l => ['Contacted', 'Call Back', 'Voicemail', 'Left Message'].includes(l.status)).length,
            qualified: leads.filter(l => l.status === 'Qualified').length,
            meetingBooked: leads.filter(l => l.status?.includes('Meeting') || l.status?.includes('Booked') || l.milestones?.ceoMeetingHeld === true).length,
            proposalSent: leads.filter(l => l.milestones?.proposalSent === true).length,
            closedWon: leads.filter(l => l.milestones?.closedWon === true).length,
            closedLost: leads.filter(l => l.milestones?.closedLost === true).length
          };

          const total = leads.length;
          conversionFunnel.percentages = {
            contactedRate: total > 0 ? Math.round((conversionFunnel.contacted / total) * 100) : 0,
            qualifiedRate: total > 0 ? Math.round((conversionFunnel.qualified / total) * 100) : 0,
            meetingRate: total > 0 ? Math.round((conversionFunnel.meetingBooked / total) * 100) : 0,
            proposalRate: conversionFunnel.meetingBooked > 0 ? Math.round((conversionFunnel.proposalSent / conversionFunnel.meetingBooked) * 100) : 0,
            closeRate: conversionFunnel.proposalSent > 0 ? Math.round((conversionFunnel.closedWon / conversionFunnel.proposalSent) * 100) : 0
          };

          // Meeting stats
          const meetingsInRange = meetings.filter(m => isInDateRange(m.startDate || m.meeting_date || m.meetingDate));
          const meetingStats = {
            booked: meetingsInRange.length,
            completed: meetingsInRange.filter(m => m.status === 'completed').length,
            noShow: meetingsInRange.filter(m => m.status === 'no-show').length,
            cancelled: meetingsInRange.filter(m => m.status === 'cancelled').length,
            completionRate: meetingsInRange.length > 0 ? Math.round((meetingsInRange.filter(m => m.status === 'completed').length / meetingsInRange.length) * 100) : 0
          };

          // Lead source breakdown
          const sources = {};
          leads.forEach(lead => {
            const source = lead.source || 'unknown';
            sources[source] = (sources[source] || 0) + 1;
          });
          const leadSources = {};
          Object.entries(sources).forEach(([source, count]) => {
            leadSources[source] = {
              count,
              percentage: Math.round((count / total) * 100)
            };
          });

          // Calls by day (simplified - generate from date range)
          const callsByDay = [];
          const current = new Date(startDate);
          while (current <= endDate) {
            const dateStr = current.toISOString().split('T')[0];
            const dayTasks = callTasks.filter(t => t.completedAt?.startsWith(dateStr));
            callsByDay.push({
              date: dateStr,
              total: dayTasks.length,
              connected: Math.floor(dayTasks.length * 0.4)
            });
            current.setDate(current.getDate() + 1);
          }

          setAnalyticsData({
            period: { startDate, endDate, range: analyticsDateRange },
            callMetrics,
            conversionFunnel,
            meetingStats,
            leadSources,
            callsByDay,
            repLeaderboard: [] // Only available in Supabase mode with team
          });
          setAnalyticsLoading(false);
        };

        // Date range options
        const dateRangeOptions = [
          { value: 'today', label: 'Today' },
          { value: 'yesterday', label: 'Yesterday' },
          { value: 'last7Days', label: 'Last 7 Days' },
          { value: 'last30Days', label: 'Last 30 Days' },
          { value: 'thisMonth', label: 'This Month' }
        ];

        // Metric Card Component
        const MetricCard = ({ title, value, subtitle, icon, trend, color = 'blue' }) => {
          const colorClasses = {
            blue: 'from-blue-500 to-blue-600',
            green: 'from-green-500 to-green-600',
            purple: 'from-purple-500 to-purple-600',
            orange: 'from-orange-500 to-orange-600',
            pink: 'from-pink-500 to-pink-600',
            cyan: 'from-cyan-500 to-cyan-600'
          };
          return (
            <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
              <div className="flex items-start justify-between">
                <div>
                  <div className="text-sm font-medium text-gray-500 mb-1">{title}</div>
                  <div className="text-3xl font-bold text-gray-900">{value}</div>
                  {subtitle && <div className="text-xs text-gray-400 mt-1">{subtitle}</div>}
                </div>
                <div className={`w-12 h-12 rounded-xl bg-gradient-to-br ${colorClasses[color]} flex items-center justify-center text-white text-xl shadow-lg`}>
                  {icon}
                </div>
              </div>
              {trend && (
                <div className={`mt-3 text-xs font-medium ${trend.direction === 'up' ? 'text-green-600' : trend.direction === 'down' ? 'text-red-600' : 'text-gray-500'}`}>
                  {trend.direction === 'up' ? '↑' : trend.direction === 'down' ? '↓' : '→'} {trend.value}% vs previous period
                </div>
              )}
            </div>
          );
        };

        // Bar Chart Component (CSS-based)
        const CallVolumeChart = ({ data }) => {
          if (!data || data.length === 0) return null;
          const maxValue = Math.max(...data.map(d => d.total), 1);

          return (
            <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
              <h3 className="text-sm font-semibold text-gray-900 mb-4">📊 Call Volume</h3>
              <div className="flex items-end gap-1 h-40">
                {data.map((day, idx) => {
                  const height = (day.total / maxValue) * 100;
                  const connectedHeight = (day.connected / maxValue) * 100;
                  return (
                    <div key={idx} className="flex-1 flex flex-col items-center gap-1">
                      <div className="w-full relative" style={{ height: '120px' }}>
                        <div
                          className="absolute bottom-0 w-full bg-blue-200 rounded-t transition-all"
                          style={{ height: `${height}%` }}
                        >
                          <div
                            className="absolute bottom-0 w-full bg-blue-500 rounded-t transition-all"
                            style={{ height: `${day.total > 0 ? (day.connected / day.total) * 100 : 0}%` }}
                          />
                        </div>
                      </div>
                      <div className="text-[10px] text-gray-400 transform -rotate-45 origin-top-left whitespace-nowrap">
                        {new Date(day.date).toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })}
                      </div>
                    </div>
                  );
                })}
              </div>
              <div className="flex items-center justify-center gap-4 mt-4 text-xs">
                <span className="flex items-center gap-1"><span className="w-3 h-3 bg-blue-200 rounded"></span> Total</span>
                <span className="flex items-center gap-1"><span className="w-3 h-3 bg-blue-500 rounded"></span> Connected</span>
              </div>
            </div>
          );
        };

        // Conversion Funnel Component
        const ConversionFunnel = ({ data }) => {
          if (!data) return null;
          const stages = [
            { key: 'new', label: 'New', color: 'bg-gray-400' },
            { key: 'contacted', label: 'Contacted', color: 'bg-blue-400' },
            { key: 'qualified', label: 'Qualified', color: 'bg-cyan-400' },
            { key: 'meetingBooked', label: 'Meeting', color: 'bg-purple-400' },
            { key: 'proposalSent', label: 'Proposal', color: 'bg-orange-400' },
            { key: 'closedWon', label: 'Won', color: 'bg-green-500' }
          ];
          const maxCount = Math.max(...stages.map(s => data[s.key] || 0), 1);

          return (
            <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
              <h3 className="text-sm font-semibold text-gray-900 mb-4">🔄 Conversion Funnel</h3>
              <div className="space-y-3">
                {stages.map((stage, idx) => {
                  const count = data[stage.key] || 0;
                  const width = (count / maxCount) * 100;
                  const prevCount = idx > 0 ? (data[stages[idx - 1].key] || 0) : count;
                  const convRate = prevCount > 0 ? Math.round((count / prevCount) * 100) : 0;
                  return (
                    <div key={stage.key} className="flex items-center gap-3">
                      <div className="w-20 text-xs text-gray-600 text-right">{stage.label}</div>
                      <div className="flex-1 h-8 bg-gray-100 rounded-lg overflow-hidden relative">
                        <div
                          className={`h-full ${stage.color} transition-all duration-500 flex items-center`}
                          style={{ width: `${Math.max(width, 2)}%` }}
                        >
                          <span className="text-xs font-bold text-white ml-2">{count}</span>
                        </div>
                      </div>
                      {idx > 0 && (
                        <div className="w-12 text-xs text-gray-400">{convRate}%</div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        };

        // Lead Source Chart (CSS Donut)
        const LeadSourceChart = ({ data }) => {
          if (!data || Object.keys(data).length === 0) return null;

          const sourceColors = {
            apollo: '#8B5CF6',
            manual: '#3B82F6',
            import: '#10B981',
            csv: '#F59E0B',
            api: '#EC4899',
            unknown: '#9CA3AF'
          };

          const entries = Object.entries(data).sort((a, b) => b[1].count - a[1].count);
          const total = entries.reduce((sum, [, v]) => sum + v.count, 0);

          // Calculate conic gradient
          let gradientParts = [];
          let currentAngle = 0;
          entries.forEach(([source, { count }]) => {
            const angle = (count / total) * 360;
            const color = sourceColors[source] || sourceColors.unknown;
            gradientParts.push(`${color} ${currentAngle}deg ${currentAngle + angle}deg`);
            currentAngle += angle;
          });

          return (
            <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
              <h3 className="text-sm font-semibold text-gray-900 mb-4">📈 Lead Sources</h3>
              <div className="flex items-center gap-6">
                <div
                  className="w-32 h-32 rounded-full relative"
                  style={{ background: `conic-gradient(${gradientParts.join(', ')})` }}
                >
                  <div className="absolute inset-4 bg-white rounded-full flex items-center justify-center">
                    <div className="text-center">
                      <div className="text-2xl font-bold text-gray-900">{total}</div>
                      <div className="text-xs text-gray-500">Total</div>
                    </div>
                  </div>
                </div>
                <div className="flex-1 space-y-2">
                  {entries.slice(0, 5).map(([source, { count, percentage }]) => (
                    <div key={source} className="flex items-center gap-2">
                      <div
                        className="w-3 h-3 rounded-full"
                        style={{ backgroundColor: sourceColors[source] || sourceColors.unknown }}
                      />
                      <span className="text-sm text-gray-700 capitalize">{source}</span>
                      <span className="text-sm text-gray-400 ml-auto">{count} ({percentage}%)</span>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          );
        };

        // Rep Leaderboard Component
        const RepLeaderboard = ({ data }) => {
          if (!data || data.length === 0) return null;

          return (
            <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
              <h3 className="text-sm font-semibold text-gray-900 mb-4">🏆 Team Leaderboard</h3>
              <div className="overflow-x-auto">
                <table className="w-full text-sm">
                  <thead>
                    <tr className="text-left text-gray-500 border-b">
                      <th className="pb-2 font-medium">#</th>
                      <th className="pb-2 font-medium">Rep</th>
                      <th className="pb-2 font-medium text-right">Calls</th>
                      <th className="pb-2 font-medium text-right">Connected</th>
                      <th className="pb-2 font-medium text-right">Meetings</th>
                      <th className="pb-2 font-medium text-right">Conv. Rate</th>
                    </tr>
                  </thead>
                  <tbody>
                    {data.map((rep, idx) => (
                      <tr key={rep.userId} className="border-b border-gray-50 hover:bg-gray-50">
                        <td className="py-2">
                          {idx === 0 ? '🥇' : idx === 1 ? '🥈' : idx === 2 ? '🥉' : idx + 1}
                        </td>
                        <td className="py-2 font-medium text-gray-900">{rep.name}</td>
                        <td className="py-2 text-right text-gray-600">{rep.calls}</td>
                        <td className="py-2 text-right text-gray-600">{rep.connected}</td>
                        <td className="py-2 text-right font-semibold text-green-600">{rep.meetings}</td>
                        <td className="py-2 text-right text-gray-600">{rep.conversionRate}%</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          );
        };

        return (
          <div className="space-y-6">
            {/* Header with Date Range */}
            <div className="bg-gradient-to-r from-indigo-600 via-purple-600 to-pink-600 rounded-xl p-6 shadow-lg">
              <div className="flex items-center justify-between">
                <div>
                  <h1 className="text-2xl font-bold text-white">📊 Analytics Dashboard</h1>
                  <p className="text-white/70 mt-1">Track your sales performance and team metrics</p>
                </div>
                <div className="flex items-center gap-3">
                  <select
                    value={analyticsDateRange}
                    onChange={(e) => setAnalyticsDateRange(e.target.value)}
                    className="px-4 py-2 bg-white/20 border border-white/30 rounded-xl text-white font-medium focus:outline-none focus:ring-2 focus:ring-white/50"
                    style={{ colorScheme: 'dark' }}
                  >
                    {dateRangeOptions.map(opt => (
                      <option key={opt.value} value={opt.value} className="text-gray-900 bg-white">
                        {opt.label}
                      </option>
                    ))}
                  </select>
                  <button
                    onClick={calculateAnalytics}
                    className="px-4 py-2 bg-white/20 border border-white/30 rounded-xl text-white font-medium hover:bg-white/30 transition-colors"
                  >
                    🔄 Refresh
                  </button>
                </div>
              </div>
            </div>

            {analyticsLoading ? (
              <div className="flex items-center justify-center py-20">
                <div className="text-center">
                  <div className="animate-spin rounded-full h-12 w-12 border-b-2 border-purple-600 mx-auto mb-4"></div>
                  <p className="text-gray-500">Loading analytics...</p>
                </div>
              </div>
            ) : analyticsData ? (
              <>
                {/* Key Metrics */}
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                  <MetricCard
                    title="Total Calls"
                    value={analyticsData.callMetrics?.total || 0}
                    icon="📞"
                    color="blue"
                  />
                  <MetricCard
                    title="Connected"
                    value={analyticsData.callMetrics?.connected || 0}
                    subtitle={analyticsData.callMetrics?.total > 0 ? `${Math.round((analyticsData.callMetrics.connected / analyticsData.callMetrics.total) * 100)}% rate` : ''}
                    icon="✅"
                    color="green"
                  />
                  <MetricCard
                    title="Meetings Booked"
                    value={analyticsData.meetingStats?.booked || analyticsData.conversionFunnel?.meetingBooked || 0}
                    icon="📅"
                    color="purple"
                  />
                  <MetricCard
                    title="Qualified Leads"
                    value={analyticsData.conversionFunnel?.qualified || 0}
                    icon="⭐"
                    color="orange"
                  />
                  <MetricCard
                    title="Closed Won"
                    value={analyticsData.conversionFunnel?.closedWon || 0}
                    icon="🏆"
                    color="green"
                  />
                  <MetricCard
                    title="Total Leads"
                    value={leads.length}
                    icon="👥"
                    color="cyan"
                  />
                </div>

                {/* Charts Row */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <CallVolumeChart data={analyticsData.callsByDay} />
                  <ConversionFunnel data={analyticsData.conversionFunnel} />
                </div>

                {/* Bottom Row */}
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                  <LeadSourceChart data={analyticsData.leadSources} />
                  {isAdmin && analyticsData.repLeaderboard?.length > 0 && (
                    <RepLeaderboard data={analyticsData.repLeaderboard} />
                  )}
                  {(!isAdmin || !analyticsData.repLeaderboard?.length) && (
                    <div className="bg-white rounded-xl p-5 shadow-sm border border-gray-100">
                      <h3 className="text-sm font-semibold text-gray-900 mb-4">📋 Quick Stats</h3>
                      <div className="space-y-4">
                        <div className="flex items-center justify-between p-3 bg-blue-50 rounded-lg">
                          <span className="text-sm text-gray-700">Meeting Completion Rate</span>
                          <span className="text-lg font-bold text-blue-600">{analyticsData.meetingStats?.completionRate || 0}%</span>
                        </div>
                        <div className="flex items-center justify-between p-3 bg-green-50 rounded-lg">
                          <span className="text-sm text-gray-700">Contacted Rate</span>
                          <span className="text-lg font-bold text-green-600">{analyticsData.conversionFunnel?.percentages?.contactedRate || 0}%</span>
                        </div>
                        <div className="flex items-center justify-between p-3 bg-purple-50 rounded-lg">
                          <span className="text-sm text-gray-700">Meeting Rate</span>
                          <span className="text-lg font-bold text-purple-600">{analyticsData.conversionFunnel?.percentages?.meetingRate || 0}%</span>
                        </div>
                        <div className="flex items-center justify-between p-3 bg-orange-50 rounded-lg">
                          <span className="text-sm text-gray-700">Close Rate</span>
                          <span className="text-lg font-bold text-orange-600">{analyticsData.conversionFunnel?.percentages?.closeRate || 0}%</span>
                        </div>
                      </div>
                    </div>
                  )}
                </div>
              </>
            ) : (
              <div className="text-center py-20">
                <div className="text-6xl mb-4">📊</div>
                <h3 className="text-xl font-semibold text-gray-900 mb-2">No Analytics Data Yet</h3>
                <p className="text-gray-500">Start making calls and tracking leads to see your analytics.</p>
              </div>
            )}
          </div>
        );
      })();

      // ==================== PLAYBOOKS CONTENT ====================
      const playbooksContent = (() => {
        const allVerticals = getAllVerticals();
        const vertical = allVerticals[selectedVertical] || verticalData[selectedVertical];

        return (
          <div className="space-y-6">
            {/* Vertical Selector with Search */}
            <div className="bg-gradient-to-r from-blue-600 to-indigo-600 rounded-xl p-6 shadow-lg">
              <div className="flex items-center gap-4 mb-4">
                <div className="flex items-center gap-3">
                  <span className="text-3xl">{allVerticals[selectedVertical]?.icon}</span>
                  <div>
                    <div className="text-white/70 text-sm font-medium">Select Playbook</div>
                    <div className="text-white text-lg font-bold">{allVerticals[selectedVertical]?.name}</div>
                  </div>
                </div>
                <div className="flex-1 max-w-md relative">
                  <input
                    type="text"
                    value={playbookSearch}
                    onChange={(e) => setPlaybookSearch(e.target.value)}
                    placeholder="Search playbooks..."
                    className="w-full px-4 py-3 pl-10 border-2 border-white/30 rounded-xl text-base bg-white/20 text-white placeholder-white/50 focus:outline-none focus:ring-2 focus:ring-white/50 focus:border-white/50"
                  />
                  <svg className="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-white/50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth={2} d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                  </svg>
                  {playbookSearch && (
                    <button
                      onClick={() => setPlaybookSearch('')}
                      className="absolute right-3 top-1/2 -translate-y-1/2 text-white/50 hover:text-white"
                    >
                      ✕
                    </button>
                  )}
                </div>
                <button
                  onClick={() => {
                    setScriptBuilderMode('create');
                    setScriptBuilderStep(1);
                    setScriptBuilderData({
                      verticalName: '',
                      verticalIcon: '🏢',
                      companyName: '',
                      productService: '',
                      targetTitles: '',
                      painPoints: '',
                      valueProps: '',
                      desiredOutcome: 'CEO Meeting',
                      objections: '',
                      additionalContext: ''
                    });
                    setShowScriptBuilder(true);
                  }}
                  className="px-4 py-2 bg-amber-400 text-amber-900 rounded-xl text-sm font-medium hover:bg-amber-300 transition-colors flex items-center gap-2"
                >
                  ✨ Create Script
                </button>
                <span className="text-white/60 text-sm">({Object.keys(allVerticals).length} playbooks)</span>
              </div>
              {/* Suggested Verticals Based on Your Leads */}
              {(() => {
                const suggestedVerticals = [];
                const seen = new Set();

                // 1. Current lead's vertical (highest priority)
                if (selectedLead?.vertical && allVerticals[selectedLead.vertical] && selectedLead.vertical !== selectedVertical) {
                  suggestedVerticals.push({ key: selectedLead.vertical, reason: 'Current lead' });
                  seen.add(selectedLead.vertical);
                }

                // 2. Verticals from call list leads
                const callListVerticals = {};
                todayCallList.forEach(lead => {
                  if (lead.vertical && allVerticals[lead.vertical]) {
                    callListVerticals[lead.vertical] = (callListVerticals[lead.vertical] || 0) + 1;
                  }
                });
                Object.entries(callListVerticals)
                  .sort((a, b) => b[1] - a[1])
                  .slice(0, 2)
                  .forEach(([key, count]) => {
                    if (!seen.has(key) && key !== selectedVertical) {
                      suggestedVerticals.push({ key, reason: `${count} lead${count > 1 ? 's' : ''} in list` });
                      seen.add(key);
                    }
                  });

                // Only show if we have suggestions
                if (suggestedVerticals.length > 0) {
                  return (
                    <div className="mb-3">
                      <div className="text-white/70 text-xs font-medium mb-2">Suggested for you</div>
                      <div className="flex flex-wrap gap-2">

                  {/* Twilio Voice Settings (Admin only, Supabase mode) */}
                  {isSupabaseMode && isAdmin && (
                    <details className="pt-4 border-t border-gray-100">

                      <div className="mt-3">
                        {(() => {
                          const [twilioSettings, setTwilioSettings] = useState({

                            apiKeySid: '',
                            apiKeySecret: '',
                            twimlAppSid: '',
                            callerId: '',
                            recordingEnabled: true
                          });
                          const [twilioLoading, setTwilioLoading] = useState(true);
                          const [twilioSaving, setTwilioSaving] = useState(false);
                          const [showTwilioSecrets, setShowTwilioSecrets] = useState(false);

                          // Load existing settings
                          useEffect(() => {
                            const loadTwilioSettings = async () => {
                              if (!supabase || !dataContext?.organization?.id) return;
                              try {
                                const { data } = await supabase
                                  .from('twilio_credentials')
                                  .select('*')
                                  .eq('organization_id', dataContext.organization.id)
                                  .single();
                                if (data) {
                                  setTwilioSettings({
                                    accountSid: data.account_sid || '',
                                    apiKeySid: data.api_key_sid || '',
                                    apiKeySecret: '', // Never return secret, just show placeholder
                                    twimlAppSid: data.twiml_app_sid || '',
                                    callerId: data.caller_id || '',
                                    recordingEnabled: data.recording_enabled !== false
                                  });
                                  setTwilioConfigured(!!data.account_sid);
                                }
                              } catch (e) {
                                // No existing credentials - use defaults
                              } finally {
                                setTwilioLoading(false);
                              }
                            };
                            loadTwilioSettings();
                          }, []);

                          const saveTwilioSettings = async () => {
                            if (!supabase || !dataContext?.organization?.id) return;
                            if (!twilioSettings.accountSid || !twilioSettings.apiKeySid || !twilioSettings.callerId) {
                              showNotification('Account SID, API Key SID, and Caller ID are required', 'error');
                              return;
                            }
                            if (!twilioSettings.apiKeySecret && !twilioConfigured) {
                              showNotification('API Key Secret is required for first-time setup', 'error');
                              return;
                            }
                            setTwilioSaving(true);
                            try {
                              const updateData = {
                                organization_id: dataContext.organization.id,
                                account_sid: twilioSettings.accountSid,
                                api_key_sid: twilioSettings.apiKeySid,
                                twiml_app_sid: twilioSettings.twimlAppSid || null,
                                caller_id: twilioSettings.callerId,
                                phone_number: twilioSettings.callerId, // Backwards compat
                                recording_enabled: twilioSettings.recordingEnabled,
                                is_active: true
                              };
                              // Only update secret if provided (allows editing other fields without re-entering)
                              if (twilioSettings.apiKeySecret) {
                                updateData.api_key_secret = twilioSettings.apiKeySecret;
                              }
                              const { error } = await supabase
                                .from('twilio_credentials')
                                .upsert(updateData, { onConflict: 'organization_id' });
                              if (error) throw error;
                              setTwilioConfigured(true);
                              setTwilioSettings(prev => ({ ...prev, apiKeySecret: '' })); // Clear secret from state
                              showNotification('Twilio settings saved! Refresh to enable browser calling.');
                            } catch (e) {
                              showNotification('Failed to save Twilio settings: ' + e.message, 'error');
                            } finally {
                              setTwilioSaving(false);
                            }

                                    className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm font-mono"

                                <div>
                                  <label className="block text-xs font-medium text-gray-600 mb-1">API Key SID</label>

                                    onChange={(e) => setTwilioSettings(prev => ({ ...prev, apiKeySid: e.target.value }))}

                                  />
                                </div>

                                <div>
                                  <label className="block text-xs font-medium text-gray-600 mb-1">
                                    API Key Secret

                                      type="button"
                                      onClick={() => setShowTwilioSecrets(!showTwilioSecrets)}

                                    >
                                      {showTwilioSecrets ? 'Hide' : 'Show'}
                                    </button>
                                  </label>
                                  <input
                                    type={showTwilioSecrets ? 'text' : 'password'}
                                    value={twilioSettings.apiKeySecret}
                                    onChange={(e) => setTwilioSettings(prev => ({ ...prev, apiKeySecret: e.target.value }))}
                                    placeholder={twilioConfigured ? '••••••••••••••••••••••••' : 'Enter API Key Secret'}
                                    className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm font-mono"
                                  />
                                </div>

                                <div>
                                  <label className="block text-xs font-medium text-gray-600 mb-1">TwiML App SID</label>
                                  <input
                                    type="text"
                                    value={twilioSettings.twimlAppSid}
                                    onChange={(e) => setTwilioSettings(prev => ({ ...prev, twimlAppSid: e.target.value }))}
                                    placeholder="APxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
                                    className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm font-mono"
                                  />
                                </div>

                                <div>
                                  <label className="block text-xs font-medium text-gray-600 mb-1">Caller ID (Your Twilio Number)</label>
                                  <input
                                    type="tel"
                                    value={twilioSettings.callerId}
                                    onChange={(e) => setTwilioSettings(prev => ({ ...prev, callerId: e.target.value }))}
                                    placeholder="+1234567890"
                                    className="w-full px-3 py-2 border border-gray-200 rounded-lg text-sm"
                                  />
                                </div>

                                <div className="flex items-center justify-between p-3 bg-gray-50 rounded-lg">
                                  <div>
                                    <div className="text-sm font-medium text-gray-900">Call Recording</div>
                                    <div className="text-xs text-gray-500">Record calls for training & compliance</div>
                                  </div>
                                  <button

                                    className={`relative inline-flex h-6 w-11 items-center rounded-full transition-colors ${
                                      twilioSettings.recordingEnabled ? 'bg-green-600' : 'bg-gray-300'

                                    <span className={`inline-block h-4 w-4 transform rounded-full bg-white transition-transform ${
                                      twilioSettings.recordingEnabled ? 'translate-x-6' : 'translate-x-1'
                                    }`} />
                                  </button>
                                </div>
                              </div>

                              <button
                                onClick={saveTwilioSettings}
                                disabled={twilioSaving}
                                className="w-full py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 text-sm font-medium disabled:opacity-50"
                              >
                                {twilioSaving ? 'Saving...' : 'Save Twilio Settings'}
                              </button>

                              {twilioConfigured && (
                                <div className="p-3 bg-green-50 rounded-lg">
                                  <div className="flex items-center gap-2 text-green-700">
                                    <span className="text-lg">✅</span>
                                    <span className="text-sm font-medium">Twilio is configured</span>
                                  </div>
                                  <p className="text-xs text-green-600 mt-1">
                                    Browser calling is available in the Call Center. Status: {twilioStatus}
                                  </p>
                                </div>
                              )}
                            </div>
                          );
                        })()}
                      </div>
                    </details>
                  )}

                  {/* Webhooks & Integrations (Admin only, Supabase mode) */}

                      <summary className="cursor-pointer text-sm font-semibold text-gray-900 hover:text-gray-700 flex items-center gap-2">

                      </summary>
                      <div className="mt-3">
                        {(() => {
                          const [webhooks, setWebhooks] = useState([]);
                          const [apiKeys, setApiKeys] = useState([]);

                          const [showNewWebhook, setShowNewWebhook] = useState(false);
                          const [showNewKey, setShowNewKey] = useState(false);
                          const [newWebhook, setNewWebhook] = useState({ name: '', url: '', events: [] });
                          const [newKeyName, setNewKeyName] = useState('');
                          const [generatedKey, setGeneratedKey] = useState(null);

                          const WEBHOOK_EVENTS = [
                            { value: 'lead.created', label: 'Lead Created' },
                            { value: 'lead.status_changed', label: 'Lead Status Changed' },
                            { value: 'lead.milestone_reached', label: 'Milestone Reached' },
                            { value: 'meeting.booked', label: 'Meeting Booked' },
                            { value: 'meeting.completed', label: 'Meeting Completed' },
                            { value: 'call.completed', label: 'Call Completed' },
                            { value: 'sms.received', label: 'SMS Received' },
                          ];

                          // Load webhooks and API keys
                          useEffect(() => {
                            const loadData = async () => {
                              if (!supabase || !dataContext?.organization?.id) return;
                              try {
                                const [webhooksRes, keysRes] = await Promise.all([
                                  supabase.from('webhooks').select('*').eq('organization_id', dataContext.organization.id),
                                  supabase.from('inbound_webhook_keys').select('id, name, is_active, created_at, last_used_at').eq('organization_id', dataContext.organization.id)
                                ]);
                                setWebhooks(webhooksRes.data || []);
                                setApiKeys(keysRes.data || []);
                              } catch (e) {
                                console.error('Failed to load webhook data:', e);
                              } finally {
                                setWebhookLoading(false);
                              }
                            };
                            loadData();
                          }, []);

                          const createWebhook = async () => {
                            if (!newWebhook.name || !newWebhook.url || newWebhook.events.length === 0) {
                              showNotification('Name, URL, and at least one event are required', 'error');
                              return;
                            }
                            try {
                              // Generate secret
                              const secret = 'whsec_' + Array.from(crypto.getRandomValues(new Uint8Array(32)))
                                .map(b => b.toString(16).padStart(2, '0')).join('');

                              const { data, error } = await supabase.from('webhooks').insert({
                                organization_id: dataContext.organization.id,
                                name: newWebhook.name,
                                url: newWebhook.url,
                                events: newWebhook.events,
                                secret: secret,
                                is_active: true
                              }).select().single();

                              if (error) throw error;
                              setWebhooks(prev => [...prev, data]);
                              setShowNewWebhook(false);
                              setNewWebhook({ name: '', url: '', events: [] });
                              showNotification('Webhook created. Secret: ' + secret.substring(0, 20) + '...');
                            } catch (e) {
                              showNotification('Failed to create webhook: ' + e.message, 'error');
                            }
                          };

                          const deleteWebhook = async (id) => {
                            if (!confirm('Delete this webhook?')) return;
                            try {
                              await supabase.from('webhooks').delete().eq('id', id);
                              setWebhooks(prev => prev.filter(w => w.id !== id));
                              showNotification('Webhook deleted');
                            } catch (e) {
                              showNotification('Failed to delete webhook', 'error');
                            }
                          };

                          const toggleWebhook = async (id, isActive) => {
                            try {
                              await supabase.from('webhooks').update({ is_active: !isActive }).eq('id', id);
                              setWebhooks(prev => prev.map(w => w.id === id ? { ...w, is_active: !isActive } : w));
                            } catch (e) {
                              showNotification('Failed to update webhook', 'error');
                            }
                          };

                          const createApiKey = async () => {
                            if (!newKeyName) {
                              showNotification('Name is required', 'error');
                              return;
                            }
                            try {
                              const apiKey = 'sk_live_' + Array.from(crypto.getRandomValues(new Uint8Array(32)))
                                .map(b => b.toString(16).padStart(2, '0')).join('');

                              const { data, error } = await supabase.from('inbound_webhook_keys').insert({
                                organization_id: dataContext.organization.id,
                                name: newKeyName,
                                api_key: apiKey,
                                is_active: true
                              }).select('id, name, is_active, created_at').single();

                              if (error) throw error;
                              setApiKeys(prev => [...prev, data]);
                              setGeneratedKey(apiKey);
                              setNewKeyName('');
                            } catch (e) {
                              showNotification('Failed to create API key: ' + e.message, 'error');
                            }
                          };

                          const deleteApiKey = async (id) => {
                            if (!confirm('Delete this API key? Any integrations using it will stop working.')) return;
                            try {
                              await supabase.from('inbound_webhook_keys').delete().eq('id', id);
                              setApiKeys(prev => prev.filter(k => k.id !== id));
                              showNotification('API key deleted');
                            } catch (e) {
                              showNotification('Failed to delete API key', 'error');
                            }
                          };

                          if (webhookLoading) {
                            return <div className="text-sm text-gray-500">Loading...</div>;
                          }

                          return (
                            <div className="space-y-4">
                              {/* Outbound Webhooks */}
                              <div className="p-3 bg-blue-50 rounded-lg">
                                <div className="flex items-center justify-between mb-2">

                                    className="text-xs text-blue-600 hover:underline"

                                    {showNewWebhook ? 'Cancel' : '+ Add Webhook'}
                                  </button>
                                </div>

                                {showNewWebhook && (
                                  <div className="space-y-2 mb-3 p-2 bg-white rounded border border-blue-200">
                                    <input
                                      type="text"
                                      value={newWebhook.name}
                                      onChange={(e) => setNewWebhook(prev => ({ ...prev, name: e.target.value }))}
                                      placeholder="Webhook name (e.g., Zapier)"
                                      className="w-full px-2 py-1 text-sm border rounded"
                                    />
                                    <input
                                      type="url"
                                      value={newWebhook.url}
                                      onChange={(e) => setNewWebhook(prev => ({ ...prev, url: e.target.value }))}
                                      placeholder="https://hooks.zapier.com/..."
                                      className="w-full px-2 py-1 text-sm border rounded"
                                    />
                                    <div className="flex flex-wrap gap-1">
                                      {WEBHOOK_EVENTS.map(evt => (
                                        <label key={evt.value} className="flex items-center gap-1 text-xs">
                                          <input
                                            type="checkbox"
                                            checked={newWebhook.events.includes(evt.value)}
                                            onChange={(e) => {
                                              setNewWebhook(prev => ({
                                                ...prev,
                                                events: e.target.checked
                                                  ? [...prev.events, evt.value]
                                                  : prev.events.filter(v => v !== evt.value)
                                              }));
                                            }}
                                          />
                                          {evt.label}
                                        </label>
                                      ))}
                                    </div>
                                    <button onClick={createWebhook} className="w-full py-1 bg-blue-600 text-white rounded text-xs">
                                      Create Webhook
                                    </button>
                                  </div>
                                )}

                                {webhooks.length === 0 ? (
                                  <p className="text-xs text-blue-600">No webhooks configured</p>
                                ) : (
                                  <div className="space-y-2">
                                    {webhooks.map(wh => (
                                      <div key={wh.id} className="flex items-center justify-between p-2 bg-white rounded border border-blue-100">
                                        <div>
                                          <div className="text-sm font-medium">{wh.name}</div>
                                          <div className="text-xs text-gray-500 truncate max-w-[200px]">{wh.url}</div>
                                          <div className="text-xs text-gray-400">{wh.events?.join(', ')}</div>
                                        </div>
                                        <div className="flex items-center gap-2">
                                          <button
                                            onClick={() => toggleWebhook(wh.id, wh.is_active)}
                                            className={`px-2 py-0.5 rounded text-xs ${wh.is_active ? 'bg-green-100 text-green-700' : 'bg-gray-100 text-gray-500'}`}
                                          >
                                            {wh.is_active ? 'Active' : 'Paused'}
                                          </button>
                                          <button onClick={() => deleteWebhook(wh.id)} className="text-red-500 text-xs">✕</button>
                                        </div>
                                      </div>
                                    ))}
                                  </div>
                                )}
                              </div>

                              {/* Inbound API Keys */}
                              <div className="p-3 bg-purple-50 rounded-lg">
                                <div className="flex items-center justify-between mb-2">
                                  <h4 className="text-sm font-medium text-purple-900">Inbound API Keys</h4>
                                  <button
                                    onClick={() => setShowNewKey(!showNewKey)}
                                    className="text-xs text-purple-600 hover:underline"
                                  >
                                    {showNewKey ? 'Cancel' : '+ Generate Key'}
                                  </button>
                                </div>

                                {showNewKey && (
                                  <div className="space-y-2 mb-3 p-2 bg-white rounded border border-purple-200">
                                    <input
                                      type="text"
                                      value={newKeyName}
                                      onChange={(e) => setNewKeyName(e.target.value)}
                                      placeholder="Key name (e.g., Zapier Integration)"
                                      className="w-full px-2 py-1 text-sm border rounded"

                                    <button onClick={createApiKey} className="w-full py-1 bg-purple-600 text-white rounded text-xs">
                                      Generate API Key
                                    </button>
                                  </div>

                                    </button>
                                  </div>

                                  <div className="space-y-2">

                                      <div key={key.id} className="flex items-center justify-between p-2 bg-white rounded border border-purple-100">
                                        <div>
                                          <div className="text-sm font-medium">{key.name}</div>
                                          <div className="text-xs text-gray-500">

                                  <strong>Endpoint:</strong> POST {supabase?.supabaseUrl || 'https://your-project.supabase.co'}/functions/v1/webhook-inbound
                                  <br />
                                  <strong>Header:</strong> X-API-Key: your_api_key
                                </div>
                              </div>
                            </div>

                    </details>

                  {/* Data Export/Import */}

                    <div className="mt-3 space-y-2">

                          const data = {
                            leads,
                            tasks,
                            config: orgConfig,
                            targetAction,
                            exportedAt: new Date().toISOString(),
                            version: '2.1.0'
                          };
                          const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                          const url = URL.createObjectURL(blob);
                          const a = document.createElement('a');
                          a.href = url;
                          a.download = `sales-engine-backup-${new Date().toISOString().split('T')[0]}.json`;

                          URL.revokeObjectURL(url);
                          showNotification('Backup downloaded');

            });
          } else {
            // No lead selected - toggle availability on/off
            toggleAvailability(dateStr, time);
            setSelectedSlotForBooking(null); // Clear sidebar
          }
        };

        const handleQuickBook = () => {
          if (!selectedSlotForBooking || !selectedLead) return;
          
          const isScheduleChallenge = selectedSlotForBooking.isScheduleChallenge;
          
          // For schedule challenge, we don't remove from availability (it wasn't there)
          const meeting = {
            id: `meeting-${Date.now()}`,
            date: selectedSlotForBooking.date,
            time: selectedSlotForBooking.time,
            duration: 20,
            leadId: selectedLead.id,
            leadName: selectedLead.contact,
            leadTitle: selectedLead.title,
            company: selectedLead.company,
            email: selectedLead.email,
            phone: selectedLead.phone,
            isScheduleChallenge: isScheduleChallenge,
            createdAt: new Date().toISOString()
          };
          
          // Use functional setState to avoid stale closure issues
          setBookedMeetings(prev => [...prev, meeting]);

          // Only remove from availability if it was an available slot
          if (!isScheduleChallenge) {
            setCeoAvailability(prev => prev.filter(s => s.id !== selectedSlotForBooking.id));
          }

          const scheduleNote = isScheduleChallenge
            ? `\\n\\n⚠️ ${getCalendarConfig(targetAction).challengeLabel.toUpperCase()}: This was booked outside normal availability windows at the prospect's request. Please confirm availability.`
            : '';

          downloadICSFile({
            startDate: meeting.date,
            startTime: meeting.time,
            duration: meeting.duration,
            location: 'Video Call - Link to follow',
            title: isScheduleChallenge
              ? `⚠️ [SCHEDULE CHALLENGE] ${targetAction.shortLabel} - ${selectedLead.company}`
              : `${targetAction.shortLabel} - ${selectedLead.company}`,
            description: `${targetAction.description || `${targetAction.duration || 20}-minute ${targetAction.label.toLowerCase()}.`}${scheduleNote}`,
            attendeeName: selectedLead.contact,
            attendeeEmail: selectedLead.email,
            attendeeCompany: selectedLead.company
          });

          setLeads(prev => prev.map(l =>
            l.id === selectedLead.id
              ? { ...l, status: targetAction.statusLabel, lastContact: 'Just now', lastContactDate: new Date().toISOString() }
              : l
          ));

          const meetingDate = new Date(meeting.date);
          const reminderDate = new Date(meetingDate);
          reminderDate.setDate(reminderDate.getDate() - 1);

          setTasks(prev => [...prev, {
            id: Date.now(),
            leadId: selectedLead.id,
            type: 'meeting',
            description: isScheduleChallenge
              ? `⚠️ CONFIRM AVAILABILITY: ${targetAction.shortLabel} with ${selectedLead.company}`
              : `Prep for ${targetAction.shortLabel} with ${selectedLead.company}`,
            dueDate: reminderDate.toISOString().split('T')[0],
            dueTime: '09:00',
            completed: false,
            createdAt: new Date().toISOString()
          }]);

          setSelectedSlotForBooking(null);
          showNotification(isScheduleChallenge 
            ? `⚠️ Schedule Challenge booked! Confirm with CEO.`
            : `Meeting booked! ICS file downloaded.`
          );
        };

        const addBulkAvailability = (preset) => {
          const newSlots = [];
          weekDays.forEach(day => {
            const dateStr = formatDate(day);
            if (new Date(dateStr) < new Date(today)) return;
            
            let times = [];
            if (preset === 'morning') times = ['09:00', '09:30', '10:00', '10:30', '11:00', '11:30'];
            if (preset === 'afternoon') times = ['14:00', '14:30', '15:00', '15:30', '16:00', '16:30'];
            if (preset === 'all') times = timeSlots.filter(t => t !== '12:00' && t !== '12:30');
            
            times.forEach(time => {
              const slotId = `${dateStr}-${time}`;
              if (!ceoAvailability.find(s => s.id === slotId) && !isSlotBooked(dateStr, time)) {
                newSlots.push({ id: slotId, date: dateStr, time, duration: 30 });
              }
            });
          });
          
          setCeoAvailability([...ceoAvailability, ...newSlots]);
          showNotification(`Added ${newSlots.length} available slots`);
        };

        const clearWeekAvailability = () => {
          const weekDates = weekDays.map(d => formatDate(d));
          setCeoAvailability(ceoAvailability.filter(s => !weekDates.includes(s.date)));
          showNotification('Cleared availability for this week');
        };

        return (
          <div className="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-6xl max-h-[95vh] overflow-hidden flex flex-col">
              {/* Header - Dynamic based on target action */}
              {(() => {
                const calConfig = getCalendarConfig(targetAction);
                return (
                  <div className="px-6 py-4 border-b border-gray-200 flex items-center justify-between bg-gradient-to-r from-orange-500 to-amber-500 text-white">
                    <div>
                      <h3 className="text-xl font-bold">{targetAction.icon} {calConfig.title}</h3>
                      <p className="text-orange-100 text-sm">{calConfig.subtitle}</p>
                    </div>
                    <button onClick={() => setShowCalendarModal(false)} className="text-white hover:bg-white/20 rounded-lg p-2 text-xl">&times;</button>
                  </div>
                );
              })()}

              <div className="flex flex-1 overflow-hidden">
                {/* Calendar Grid */}
                <div className="flex-1 p-4 overflow-auto">
                  {/* Week Navigation */}
                  <div className="flex items-center justify-between mb-4">
                    <button onClick={() => navigateWeek(-1)} className="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium">← Prev</button>
                    <h4 className="font-semibold text-gray-900">
                      {weekDays[0].toLocaleDateString('en-AU', { day: 'numeric', month: 'short' })} - {weekDays[4].toLocaleDateString('en-AU', { day: 'numeric', month: 'short', year: 'numeric' })}

                    <button onClick={() => navigateWeek(1)} className="px-4 py-2 bg-gray-100 hover:bg-gray-200 rounded-lg font-medium">Next →</button>
                  </div>

                  {/* Mode Toggle & Quick Actions */}
                  <div className="flex items-center justify-between mb-4">
                    <div className="flex gap-2 flex-wrap items-center">
                      <span className="text-sm text-gray-500">Quick add:</span>
                      <button onClick={() => addBulkAvailability('morning')} className="px-3 py-1.5 bg-blue-100 text-blue-700 rounded-lg text-sm hover:bg-blue-200">+ Mornings</button>
                      <button onClick={() => addBulkAvailability('afternoon')} className="px-3 py-1.5 bg-blue-100 text-blue-700 rounded-lg text-sm hover:bg-blue-200">+ Afternoons</button>
                      <button onClick={() => addBulkAvailability('all')} className="px-3 py-1.5 bg-green-100 text-green-700 rounded-lg text-sm hover:bg-green-200">+ Full Days</button>
                      <button onClick={clearWeekAvailability} className="px-3 py-1.5 bg-red-100 text-red-700 rounded-lg text-sm hover:bg-red-200">Clear Week</button>
                    </div>
                    {selectedLead && (
                      <button

                            ? 'bg-purple-600 text-white'
                            : 'bg-purple-100 text-purple-700 hover:bg-purple-200'

                        {editAvailabilityMode ? '✓ Edit Mode ON' : '✏️ Edit Availability'}

                  {editAvailabilityMode && (
                    <div className="mb-4 p-3 bg-purple-50 border border-purple-200 rounded-lg">
                      <p className="text-sm text-purple-800">✏️ <strong>Edit Mode:</strong> Click slots to toggle availability. Click the button again to return to booking mode.</p>
                    </div>
                  )}

                  {/* Calendar Grid */}
                  <div className="border border-gray-200 rounded-xl overflow-hidden">
                    {/* Day Headers */}
                    <div className="grid grid-cols-6 bg-gray-50 border-b border-gray-200">
                      <div className="p-3 text-xs font-medium text-gray-500 border-r border-gray-200">Time</div>

                        const isToday = dateStr === today;
                        const isPast = new Date(dateStr) < new Date(today);
                        return (
                          <div key={dateStr} className={`p-3 text-center border-r border-gray-200 last:border-r-0 ${isToday ? 'bg-blue-50' : ''} ${isPast ? 'opacity-50' : ''}`}>

                            <div className={`text-lg font-bold ${isToday ? 'text-blue-600' : 'text-gray-900'}`}>{day.getDate()}</div>
                          </div>

                    {/* Time Slots */}
                    <div className="max-h-[400px] overflow-y-auto">

                        {selectedSlotForBooking.isScheduleChallenge && (

                        <div className="bg-white rounded-xl p-4 shadow-sm">
                          <div className="text-lg font-bold text-gray-900">{selectedSlotForBooking.company}</div>
                          <div className="text-sm text-gray-600">{selectedSlotForBooking.leadName}</div>
                          <div className="text-sm text-gray-500 mt-2">{new Date(selectedSlotForBooking.date).toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
                          <div className="text-sm font-medium text-gray-900">{selectedSlotForBooking.time} AEST</div>
                        </div>
                        <div className="flex gap-2">
                          <button onClick={() => {
                            const scheduleNote = selectedSlotForBooking.isScheduleChallenge 
                              ? `\\n\\n⚠️ ${getCalendarConfig(targetAction).challengeLabel.toUpperCase()}: This was booked outside normal availability.`
                              : '';
                            downloadICSFile({
                              startDate: selectedSlotForBooking.date,
                              startTime: selectedSlotForBooking.time,
                              duration: selectedSlotForBooking.duration || 20,
                              location: 'Video Call - Link to follow',
                              title: selectedSlotForBooking.isScheduleChallenge
                                ? `⚠️ [SCHEDULE CHALLENGE] ${targetAction.shortLabel} - ${selectedSlotForBooking.company}`
                                : `${targetAction.shortLabel} - ${selectedSlotForBooking.company}`,
                              description: `${targetAction.label} with ${selectedSlotForBooking.leadName}${scheduleNote}`,
                              attendeeName: selectedSlotForBooking.leadName,
                              attendeeEmail: selectedSlotForBooking.email,
                              attendeeCompany: selectedSlotForBooking.company
                            });
                          }} className="flex-1 py-2 bg-blue-600 text-white rounded-lg text-sm font-medium hover:bg-blue-700">📥 Re-download ICS</button>
                          <button onClick={() => cancelMeeting(selectedSlotForBooking.id)} className="px-4 py-2 bg-red-100 text-red-700 rounded-lg text-sm font-medium hover:bg-red-200">🗑️ Delete</button>
                        </div>
                        <button onClick={() => setSelectedSlotForBooking(null)} className="w-full py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-100">Close</button>
                      </div>
                    ) : (
                      <div className="space-y-4">
                        <h4 className="font-semibold text-gray-900">
                          {selectedSlotForBooking.isScheduleChallenge ? '⚠️ Schedule Challenge' : '📅 Book This Slot'}
                        </h4>
                        
                        {selectedSlotForBooking.isScheduleChallenge && (
                          <div className="bg-amber-50 border border-amber-200 rounded-xl p-3">
                            <p className="text-sm text-amber-800 font-medium">{getCalendarConfig(targetAction).challengeLabel}</p>
                            <p className="text-xs text-amber-700 mt-1">{getCalendarConfig(targetAction).challengeMessage}. Book anyway if needed.</p>
                          </div>
                        )}
                        
                        <div className="bg-white rounded-xl p-4 shadow-sm">
                          <div className="text-sm text-gray-500">{new Date(selectedSlotForBooking.date).toLocaleDateString('en-AU', { weekday: 'long', day: 'numeric', month: 'long' })}</div>
                          <div className="text-2xl font-bold text-gray-900">{selectedSlotForBooking.time}</div>
                          <div className="text-sm text-gray-500">AEST • 20 min</div>
                        </div>
                        {selectedLead ? (
                          <>
                            <div className="bg-blue-50 rounded-xl p-4">
                              <div className="text-xs text-blue-600 font-medium mb-1">BOOKING FOR</div>
                              <div className="font-semibold text-blue-900">{selectedLead.company}</div>
                              <div className="text-sm text-blue-700">{selectedLead.contact}</div>
                            </div>
                            <button onClick={handleQuickBook} className={`w-full py-3 text-white rounded-xl font-medium ${
                              selectedSlotForBooking.isScheduleChallenge 
                                ? 'bg-amber-600 hover:bg-amber-700' 
                                : 'bg-green-600 hover:bg-green-700'
                            }`}>
                              {selectedSlotForBooking.isScheduleChallenge 
                                ? '⚠️ Book Anyway & Download ICS' 
                                : '✓ Confirm & Download ICS'}
                            </button>
                          </>
                        ) : (
                          <div className="bg-amber-50 rounded-xl p-4">
                            <p className="text-sm text-amber-800">Select a lead first from Call Center to book this slot.</p>
                          </div>
                        )}
                        <button onClick={() => setSelectedSlotForBooking(null)} className="w-full py-2 border border-gray-200 rounded-lg text-sm text-gray-600 hover:bg-gray-100">Cancel</button>
                      </div>
                    )
                  ) : (
                    <div className="space-y-4">
                      <h4 className="font-semibold text-gray-900">How to Use</h4>
                      <div className="space-y-3 text-sm text-gray-600">
                        <div className="flex gap-3"><span>1️⃣</span><span>Click empty slots to mark <strong>available</strong></span></div>
                        <div className="flex gap-3"><span>2️⃣</span><span>Select a lead in Call Center</span></div>
                        <div className="flex gap-3"><span>3️⃣</span><span>Click available slot to <strong>book</strong></span></div>
                        <div className="flex gap-3"><span>4️⃣</span><span>ICS downloads automatically</span></div>
                      </div>
                      <div className="border-t border-gray-200 pt-4">
                        <h4 className="font-semibold text-gray-900 mb-3">This Week</h4>
                        <div className="grid grid-cols-2 gap-3">
                          <div className="bg-white rounded-lg p-3 text-center shadow-sm">

                            <div className="text-xs text-gray-500">Open</div>
                          </div>
                          <div className="bg-white rounded-lg p-3 text-center shadow-sm">
                            <div className="text-2xl font-bold text-green-600">{bookedMeetings.filter(m => weekDays.map(d => formatDate(d)).includes(m.date)).length}</div>
                            <div className="text-xs text-gray-500">Booked</div>
                          </div>
                        </div>
                      </div>
                      {bookedMeetings.length > 0 && (
                        <div className="border-t border-gray-200 pt-4">
                          <div className="flex items-center justify-between mb-3">
                            <h4 className="font-semibold text-gray-900">Upcoming</h4>
                            <button

                            >
                              📥 Export All
                            </button>
                          </div>
                          <div className="space-y-2 max-h-40 overflow-y-auto">
                            {bookedMeetings.filter(m => new Date(m.date) >= new Date(today)).sort((a, b) => a.date.localeCompare(b.date)).slice(0, 5).map(m => (
                              <div key={m.id} onClick={() => setSelectedSlotForBooking({ ...m, isBooked: true })} className="bg-white rounded-lg p-3 shadow-sm cursor-pointer hover:bg-gray-50">
                                <div className="font-medium text-gray-900 text-sm truncate">{m.company}</div>
                                <div className="text-xs text-gray-500">{new Date(m.date).toLocaleDateString('en-AU', { weekday: 'short', day: 'numeric', month: 'short' })} • {m.time}</div>
                              </div>
                            ))}
                          </div>
                        </div>
                      )}
                      {selectedLead && (
                        <div className="border-t border-gray-200 pt-4">
                          <div className="bg-blue-50 rounded-lg p-3">
                            <div className="text-xs text-blue-600 font-medium">SELECTED LEAD</div>
                            <div className="font-medium text-blue-900">{selectedLead.company}</div>
                            <div className="text-sm text-blue-700">{selectedLead.contact}</div>
                          </div>
                        </div>

                  )}
                </div>
              </div>
            </div>
          </div>

      })();

      // ==================== MAIN RENDER ====================
      // Show loading state while Supabase data is loading
      if (dataLoading) {
        return (
          <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 flex items-center justify-center">
            <div className="text-center">
              <div className="w-12 h-12 border-4 border-blue-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
              <p className="text-gray-600">Loading your data...</p>

      return (

                    >

                    </button>
                    <button

                    >

                    <button
