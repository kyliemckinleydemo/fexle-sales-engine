<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.tailwindcss.com https://unpkg.com https://cdn.jsdelivr.net https://sdk.twilio.com; style-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; connect-src 'self' https://*.supabase.co https://*.supabase.in https://api.anthropic.com https://api.apollo.io https://api.resend.com https://api.stripe.com wss://*.supabase.co; frame-src https://checkout.stripe.com https://billing.stripe.com; img-src 'self' data: https:; font-src 'self' data:;">
  <title>Sales Engine - AI-Powered Lead Generation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://sdk.twilio.com/js/client/v1.14/twilio.min.js"></script>
  <script src="config/supabase.js"></script>
  <script src="config/app-config.js"></script>
  <script src="src/utils/scriptBuilder.browser.js"></script>
  <style>
    .scrollbar-thin::-webkit-scrollbar { width: 6px; }
    .scrollbar-thin::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 3px; }
    .scrollbar-thin::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    .scrollbar-thin::-webkit-scrollbar-thumb:hover { background: #aaa; }
    @keyframes pulse-border { 0%, 100% { border-color: #3b82f6; } 50% { border-color: #8b5cf6; } }
    .animate-pulse-border { animation: pulse-border 2s infinite; }
    @keyframes slide-in-right { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .animate-slide-in-right { animation: slide-in-right 0.2s ease-out; }
  </style>
</head>
<body class="bg-gray-50">
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useRef, createContext, useContext } = React;

    // ==================== ERROR BOUNDARY ====================
    // Catches render errors and shows friendly fallback UI
    class ErrorBoundary extends React.Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false, error: null };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true, error };
      }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary caught:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return React.createElement('div', {
            className: 'min-h-screen bg-gray-50 flex items-center justify-center p-8'
          },
            React.createElement('div', { className: 'text-center max-w-md' },
              React.createElement('div', { className: 'text-5xl mb-4' }, '\u26A0\uFE0F'),
              React.createElement('h1', { className: 'text-2xl font-bold text-gray-900 mb-2' }, 'Something went wrong'),
              React.createElement('p', { className: 'text-gray-600 mb-6' },
                'An unexpected error occurred. Please reload the page to continue.'
              ),
              React.createElement('button', {
                onClick: () => window.location.reload(),
                className: 'px-6 py-3 bg-blue-600 text-white rounded-xl hover:bg-blue-700 font-medium'
              }, 'Reload Page')
            )
          );
        }
        return this.props.children;
      }
    }

    // ==================== APP CONFIG ====================
    // Runtime configuration loaded from config/app-config.js
    // Deep-merges config values over hardcoded defaults
    const APP_CONFIG = window.APP_CONFIG || {};

    // Deep merge utility: merges source into target (source wins)
    // Arrays replace entirely, objects merge recursively, primitives override
    const mergeConfig = (defaults, overrides) => {
      if (!overrides || typeof overrides !== 'object') return defaults;
      if (!defaults || typeof defaults !== 'object') return overrides;
      if (Array.isArray(overrides)) return overrides;
      const result = { ...defaults };
      for (const key of Object.keys(overrides)) {
        if (overrides[key] !== undefined && overrides[key] !== null) {
          if (typeof overrides[key] === 'object' && !Array.isArray(overrides[key]) && typeof defaults[key] === 'object' && !Array.isArray(defaults[key])) {
            result[key] = mergeConfig(defaults[key], overrides[key]);
          } else {
            result[key] = overrides[key];
          }
        }
      }
      return result;
    };

    // ==================== SUPABASE CONFIGURATION ====================
    // Configuration is loaded from config/supabase.js (edit that file for deployments)
    // Falls back to URL params or localStorage for self-hosted/development setups
    const getSupabaseConfig = () => {
      // Use external config if provided (from config/supabase.js)
      const externalConfig = window.SUPABASE_CONFIG || {};
      if (externalConfig.url && externalConfig.anonKey) {
        return externalConfig;
      }
      // Otherwise check URL params or localStorage (for self-hosted setups)
      const params = new URLSearchParams(window.location.search);
      return {
        url: params.get('supabase_url') || localStorage.getItem('supabase_url') || '',
        anonKey: params.get('supabase_key') || localStorage.getItem('supabase_key') || ''
      };
    };

    // Reference for hosted mode detection
    const HOSTED_SUPABASE = window.SUPABASE_CONFIG || { url: '', anonKey: '' };

    const SUPABASE_CONFIG = getSupabaseConfig();
    // Allow E2E test mode via query param or localStorage (bypasses auth for testing)
    const isE2ETestMode = new URLSearchParams(window.location.search).get('e2e') === 'true'
      || localStorage.getItem('e2eTestMode') === 'true';
    const isHostedMode = !isE2ETestMode && HOSTED_SUPABASE.url && HOSTED_SUPABASE.anonKey;
    const supabase = SUPABASE_CONFIG.url && SUPABASE_CONFIG.anonKey
      ? window.supabase.createClient(SUPABASE_CONFIG.url, SUPABASE_CONFIG.anonKey)
      : null;

    // ==================== TARGET ACTION CONFIG ====================
    // Configurable via APP_CONFIG.targetActions — see config/app-config.js
    // Layering: hardcoded defaults ← APP_CONFIG.targetActions.default ← orgConfig.targetAction
    const _HARDCODED_TARGET_ACTION = {
      type: 'meeting',
      label: 'CEO Meeting',
      shortLabel: 'CEO Meeting',
      statusLabel: 'CEO Meeting Booked',
      milestoneLabel: 'CEO Meeting Held',
      milestoneKey: 'ceoMeetingHeld',
      buttonText: 'Schedule CEO Meeting',
      description: '20-minute conversation with our CEO',
      duration: 20,
      priority: 1,
      followUpDays: 1,
      icon: '📅',
      hostTitle: 'CEO',
      hostDescription: 'our CEO',
      emailSubjectPrefix: 'Confirmed: Call with',
      emailTemplate: 'meeting',
      color: {
        bg: 'bg-green-200',
        text: 'text-green-900',
        border: 'border-green-400'
      },
      calendar: {
        title: 'CEO Availability Calendar',
        subtitle: 'Click slots to mark available • Click available slots to book',
        slotLabel: 'Available',
        bookedLabel: 'Meeting Booked',
        challengeLabel: 'Schedule Challenge',
        challengeMessage: 'This time is outside normal availability - will be booked as a Schedule Challenge',
        mode: 'availability',
        allowMultipleBookings: false
      }
    };
    const DEFAULT_TARGET_ACTION = mergeConfig(_HARDCODED_TARGET_ACTION, APP_CONFIG.targetActions?.default);

    // Helper to get calendar config with defaults
    const getCalendarConfig = (targetAction) => {
      const defaults = {
        title: `${targetAction.shortLabel} Calendar`,
        subtitle: 'Click slots to set availability • Click to book',
        slotLabel: 'Available',
        bookedLabel: `${targetAction.shortLabel} Booked`,
        challengeLabel: 'Custom Time',
        challengeMessage: 'This time is outside normal availability',
        mode: 'availability',
        allowMultipleBookings: false
      };
      return { ...defaults, ...(targetAction.calendar || {}) };
    };

    // Helper to get target action config from organization config
    const getTargetAction = (config) => {
      return config?.targetAction || DEFAULT_TARGET_ACTION;
    };

    // ==================== AUTH CONTEXT ====================
    const AuthContext = createContext(null);

    const useAuth = () => {
      const context = useContext(AuthContext);
      if (!context) {
        throw new Error('useAuth must be used within AuthProvider');
      }
      return context;
    };

    const AuthProvider = ({ children }) => {
      const [user, setUser] = useState(null);
      const [session, setSession] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!supabase) {
          setLoading(false);
          return;
        }

        // Get initial session
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          setUser(session?.user ?? null);
          setLoading(false);
        });

        // Listen for auth changes
        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          setUser(session?.user ?? null);
        });

        return () => subscription.unsubscribe();
      }, []);

      const signUp = async (email, password, fullName) => {
        const { data, error } = await supabase.auth.signUp({
          email,
          password,
          options: {
            data: { full_name: fullName }
          }
        });
        return { data, error };
      };

      const signIn = async (email, password) => {
        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password
        });
        return { data, error };
      };

      const signOut = async () => {
        const { error } = await supabase.auth.signOut();
        return { error };
      };

      const resetPassword = async (email) => {
        const { data, error } = await supabase.auth.resetPasswordForEmail(email);
        return { data, error };
      };

      return (
        <AuthContext.Provider value={{
          user,
          session,
          loading,
          signUp,
          signIn,
          signOut,
          resetPassword,
          isAuthenticated: !!user
        }}>
          {children}
        </AuthContext.Provider>
      );
    };

    // ==================== ORGANIZATION CONTEXT ====================
    const OrgContext = createContext(null);

    const useOrg = () => {
      const context = useContext(OrgContext);
      if (!context) {
        throw new Error('useOrg must be used within OrgProvider');
      }
      return context;
    };

    const OrgProvider = ({ children }) => {
      const { user, isAuthenticated } = useAuth();
      const [organization, setOrganization] = useState(null);
      const [membership, setMembership] = useState(null);
      const [config, setConfig] = useState(null);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!supabase || !isAuthenticated) {
          setLoading(false);
          return;
        }

        loadOrganization();
      }, [isAuthenticated, user]);

      const loadOrganization = async () => {
        try {
          // Get user's organization membership
          const { data: memberships, error: memError } = await supabase
            .from('organization_members')
            .select('*, organizations(*)')
            .eq('user_id', user.id)
            .limit(1);

          if (memError) throw memError;

          if (memberships && memberships.length > 0) {
            const mem = memberships[0];
            setMembership(mem);
            setOrganization(mem.organizations);
            setConfig(mem.organizations.config || {});
          }
        } catch (err) {
          console.error('Error loading organization:', err);
        } finally {
          setLoading(false);
        }
      };

      const createOrganization = async (name, initialConfig = {}) => {
        try {
          const { data, error } = await supabase.rpc('create_organization', {
            p_name: name,
            p_config: initialConfig
          });
          if (error) throw error;

          await loadOrganization();
          return { data, error: null };
        } catch (err) {
          return { data: null, error: err };
        }
      };

      const updateConfig = async (newConfig) => {
        if (!organization) return { error: 'No organization' };

        try {
          const { data, error } = await supabase.rpc('update_org_config', {
            p_org_id: organization.id,
            p_config: newConfig
          });
          if (error) throw error;

          setConfig(data);
          return { data, error: null };
        } catch (err) {
          return { data: null, error: err };
        }
      };

      // ==================== TEAM MANAGEMENT ====================

      // Load team members
      const loadTeamMembers = async () => {
        if (!organization) return { data: [], error: null };

        try {
          const { data, error } = await supabase
            .from('organization_members')
            .select(`
              id,
              user_id,
              role,
              invited_by,
              invited_at,
              joined_at,
              created_at
            `)
            .eq('organization_id', organization.id)
            .order('created_at', { ascending: true });

          if (error) throw error;

          // Get user profiles for each member
          const memberIds = data.map(m => m.user_id);
          const { data: profiles, error: profileError } = await supabase
            .from('profiles')
            .select('id, full_name, email, avatar_url')
            .in('id', memberIds);

          if (profileError) {
            console.warn('Could not load profiles:', profileError);
          }

          // Merge profiles with members
          const membersWithProfiles = data.map(member => ({
            ...member,
            profile: profiles?.find(p => p.id === member.user_id) || null
          }));

          return { data: membersWithProfiles, error: null };
        } catch (err) {
          return { data: [], error: err };
        }
      };

      // Load pending invitations
      const loadInvitations = async () => {
        if (!organization) return { data: [], error: null };

        try {
          const { data, error } = await supabase
            .from('invitations')
            .select('*')
            .eq('organization_id', organization.id)
            .is('accepted_at', null)
            .gt('expires_at', new Date().toISOString())
            .order('created_at', { ascending: false });

          if (error) throw error;
          return { data, error: null };
        } catch (err) {
          return { data: [], error: err };
        }
      };

      // Invite a new team member
      const inviteTeamMember = async (email, role = 'member') => {
        if (!organization) return { data: null, error: 'No organization' };

        try {
          const { data, error } = await supabase
            .from('invitations')
            .insert({
              organization_id: organization.id,
              email: email.toLowerCase().trim(),
              role,
              invited_by: user.id
            })
            .select()
            .single();

          if (error) throw error;
          return { data, error: null };
        } catch (err) {
          return { data: null, error: err };
        }
      };

      // Update member role
      const updateMemberRole = async (memberId, newRole) => {
        if (!organization) return { error: 'No organization' };

        try {
          const { error } = await supabase
            .from('organization_members')
            .update({ role: newRole })
            .eq('id', memberId)
            .eq('organization_id', organization.id);

          if (error) throw error;
          return { error: null };
        } catch (err) {
          return { error: err };
        }
      };

      // Remove team member
      const removeTeamMember = async (memberId) => {
        if (!organization) return { error: 'No organization' };

        try {
          const { error } = await supabase
            .from('organization_members')
            .delete()
            .eq('id', memberId)
            .eq('organization_id', organization.id);

          if (error) throw error;
          return { error: null };
        } catch (err) {
          return { error: err };
        }
      };

      // Cancel invitation
      const cancelInvitation = async (invitationId) => {
        if (!organization) return { error: 'No organization' };

        try {
          const { error } = await supabase
            .from('invitations')
            .delete()
            .eq('id', invitationId)
            .eq('organization_id', organization.id);

          if (error) throw error;
          return { error: null };
        } catch (err) {
          return { error: err };
        }
      };

      // Resend invitation (create new token)
      const resendInvitation = async (invitationId) => {
        if (!organization) return { data: null, error: 'No organization' };

        try {
          // Get existing invitation
          const { data: existing, error: fetchError } = await supabase
            .from('invitations')
            .select('email, role')
            .eq('id', invitationId)
            .single();

          if (fetchError) throw fetchError;

          // Delete old invitation
          await supabase
            .from('invitations')
            .delete()
            .eq('id', invitationId);

          // Create new invitation with fresh token
          const { data, error } = await supabase
            .from('invitations')
            .insert({
              organization_id: organization.id,
              email: existing.email,
              role: existing.role,
              invited_by: user.id
            })
            .select()
            .single();

          if (error) throw error;
          return { data, error: null };
        } catch (err) {
          return { data: null, error: err };
        }
      };

      const isAdmin = membership?.role === 'owner' || membership?.role === 'admin';
      const isOwner = membership?.role === 'owner';

      return (
        <OrgContext.Provider value={{
          organization,
          membership,
          config,
          loading,
          isAdmin,
          isOwner,
          createOrganization,
          updateConfig,
          reload: loadOrganization,
          // Team management
          loadTeamMembers,
          loadInvitations,
          inviteTeamMember,
          updateMemberRole,
          removeTeamMember,
          cancelInvitation,
          resendInvitation
        }}>
          {children}
        </OrgContext.Provider>
      );
    };

    // ==================== DATA HOOKS (Supabase Integration) ====================
    const useLeads = () => {
      const { organization } = useOrg();
      const [leads, setLeads] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!supabase || !organization) {
          setLoading(false);
          return;
        }

        loadLeads();

        // Set up realtime subscription
        const channel = supabase
          .channel('leads-changes')
          .on('postgres_changes', {
            event: '*',
            schema: 'public',
            table: 'leads',
            filter: `organization_id=eq.${organization.id}`
          }, (payload) => {
            if (payload.eventType === 'INSERT') {
              setLeads(prev => [...prev, payload.new]);
            } else if (payload.eventType === 'UPDATE') {
              setLeads(prev => prev.map(l => l.id === payload.new.id ? payload.new : l));
            } else if (payload.eventType === 'DELETE') {
              setLeads(prev => prev.filter(l => l.id !== payload.old.id));
            }
          })
          .subscribe();

        return () => {
          supabase.removeChannel(channel);
        };
      }, [organization]);

      const loadLeads = async () => {
        try {
          const { data, error } = await supabase
            .from('leads')
            .select('*')
            .eq('organization_id', organization.id)
            .order('created_at', { ascending: false });

          if (error) throw error;
          setLeads(data || []);
        } catch (err) {
          console.error('Error loading leads:', err);
        } finally {
          setLoading(false);
        }
      };

      const createLead = async (lead) => {
        const { data, error } = await supabase
          .from('leads')
          .insert({ ...lead, organization_id: organization.id })
          .select()
          .single();
        return { data, error };
      };

      const updateLead = async (id, updates) => {
        const { data, error } = await supabase
          .from('leads')
          .update(updates)
          .eq('id', id)
          .select()
          .single();
        return { data, error };
      };

      const deleteLead = async (id) => {
        const { error } = await supabase
          .from('leads')
          .delete()
          .eq('id', id);
        return { error };
      };

      return { leads, loading, createLead, updateLead, deleteLead, reload: loadLeads };
    };

    const useTasks = () => {
      const { organization } = useOrg();
      const [tasks, setTasks] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!supabase || !organization) {
          setLoading(false);
          return;
        }

        loadTasks();

        const channel = supabase
          .channel('tasks-changes')
          .on('postgres_changes', {
            event: '*',
            schema: 'public',
            table: 'tasks',
            filter: `organization_id=eq.${organization.id}`
          }, (payload) => {
            if (payload.eventType === 'INSERT') {
              setTasks(prev => [...prev, payload.new]);
            } else if (payload.eventType === 'UPDATE') {
              setTasks(prev => prev.map(t => t.id === payload.new.id ? payload.new : t));
            } else if (payload.eventType === 'DELETE') {
              setTasks(prev => prev.filter(t => t.id !== payload.old.id));
            }
          })
          .subscribe();

        return () => supabase.removeChannel(channel);
      }, [organization]);

      const loadTasks = async () => {
        try {
          const { data, error } = await supabase
            .from('tasks')
            .select('*')
            .eq('organization_id', organization.id)
            .order('due_date', { ascending: true });

          if (error) throw error;
          setTasks(data || []);
        } catch (err) {
          console.error('Error loading tasks:', err);
        } finally {
          setLoading(false);
        }
      };

      const createTask = async (task) => {
        const { data, error } = await supabase
          .from('tasks')
          .insert({ ...task, organization_id: organization.id })
          .select()
          .single();
        return { data, error };
      };

      const updateTask = async (id, updates) => {
        const { data, error } = await supabase
          .from('tasks')
          .update(updates)
          .eq('id', id)
          .select()
          .single();
        return { data, error };
      };

      const deleteTask = async (id) => {
        const { error } = await supabase
          .from('tasks')
          .delete()
          .eq('id', id);
        return { error };
      };

      return { tasks, loading, createTask, updateTask, deleteTask, reload: loadTasks };
    };

    const useMeetings = () => {
      const { organization } = useOrg();
      const [meetings, setMeetings] = useState([]);
      const [slots, setSlots] = useState([]);
      const [loading, setLoading] = useState(true);

      useEffect(() => {
        if (!supabase || !organization) {
          setLoading(false);
          return;
        }

        loadMeetings();
        loadSlots();
      }, [organization]);

      const loadMeetings = async () => {
        try {
          const { data, error } = await supabase
            .from('meetings')
            .select('*, leads(company, contact)')
            .eq('organization_id', organization.id)
            .order('meeting_date', { ascending: true });

          if (error) throw error;
          setMeetings(data || []);
        } catch (err) {
          console.error('Error loading meetings:', err);
        } finally {
          setLoading(false);
        }
      };

      const loadSlots = async () => {
        const { data, error } = await supabase
          .from('availability_slots')
          .select('*')
          .eq('organization_id', organization.id)
          .gte('slot_date', new Date().toISOString().split('T')[0])
          .order('slot_date', { ascending: true });

        if (!error) setSlots(data || []);
      };

      const createMeeting = async (meeting) => {
        const { data, error } = await supabase
          .from('meetings')
          .insert({ ...meeting, organization_id: organization.id })
          .select()
          .single();

        if (!error && meeting.slot_id) {
          await supabase
            .from('availability_slots')
            .update({ is_booked: true })
            .eq('id', meeting.slot_id);
        }

        return { data, error };
      };

      const createSlot = async (slot) => {
        const { data, error } = await supabase
          .from('availability_slots')
          .insert({ ...slot, organization_id: organization.id })
          .select()
          .single();

        if (!error) loadSlots();
        return { data, error };
      };

      return { meetings, slots, loading, createMeeting, createSlot, reload: loadMeetings };
    };

    // ==================== UNIFIED DATA CONTEXT ====================
    // Abstracts data access between Supabase (multi-user) and localStorage (local) modes
    const DataContext = createContext(null);

    const useData = () => {
      const context = useContext(DataContext);
      if (!context) {
        throw new Error('useData must be used within DataProvider');
      }
      return context;
    };

    // Helper to check if we're in Supabase mode
    const isSupabaseMode = () => !!supabase;

    // DataProvider for Supabase mode - uses the Supabase hooks
    const SupabaseDataProvider = ({ children }) => {
      const leadsHook = useLeads();
      const tasksHook = useTasks();
      const meetingsHook = useMeetings();
      const { organization, config, isAdmin, isOwner, updateConfig, membership, reload: reloadOrg } = useOrg();

      // Transform Supabase data structure to match App's expected format
      const transformLead = (dbLead) => ({
        id: dbLead.id,
        company: dbLead.company,
        contact: dbLead.contact,
        title: dbLead.title,
        phone: dbLead.phone,

        duration: dbMeeting.duration,

      // Transform to DB format
      const toDbLead = (lead) => ({

        contact: lead.contact,
        title: lead.title,
        phone: lead.phone,
        email: lead.email,
        vertical: lead.vertical,
        notes: lead.notes,
        score: lead.score,
        status: lead.status,
        last_contact_date: lead.lastContactDate,
        research: lead.research,
        company_size: lead.companySize,
        revenue: lead.revenue,
        website: lead.website,
        linkedin_url: lead.linkedinUrl,
        city: lead.city,
        state: lead.state,
        country: lead.country,
        industry: lead.industry,
        source: lead.source,
        milestones: lead.milestones,
        intent_signals: lead.intentSignals
      });

      const toDbTask = (task) => ({
        lead_id: task.leadId,
        type: task.type,
        description: task.description,
        due_date: task.dueDate,
        due_time: task.dueTime,

      });

      const value = {
        // Data
        leads: leadsHook.leads.map(transformLead),
        tasks: tasksHook.tasks.map(transformTask),
        meetings: meetingsHook.meetings.map(transformMeeting),

        loading: leadsHook.loading || tasksHook.loading || meetingsHook.loading,
        isSupabase: true,
        organization,

        // Org admin info
        config: config || {},
        isAdmin: isAdmin || false,
        isOwner: isOwner || false,
        membership,
        updateConfig,
        reloadOrg,

        // Lead operations
        addLead: async (lead) => {
          const { data, error } = await leadsHook.createLead(toDbLead(lead));
          return { success: !error, data: data ? transformLead(data) : null, error };
        },
        updateLead: async (id, updates) => {
          const { data, error } = await leadsHook.updateLead(id, toDbLead(updates));
          return { success: !error, data: data ? transformLead(data) : null, error };
        },
        deleteLead: async (id) => {
          const { error } = await leadsHook.deleteLead(id);
          return { success: !error, error };
        },
        setLeads: () => console.warn('setLeads not available in Supabase mode - use addLead/updateLead'),

        // Task operations
        addTask: async (task) => {
          const { data, error } = await tasksHook.createTask(toDbTask(task));
          return { success: !error, data: data ? transformTask(data) : null, error };
        },
        updateTask: async (id, updates) => {
          const { data, error } = await tasksHook.updateTask(id, toDbTask(updates));

    // DataProvider for Local mode - uses localStorage
    const LocalDataProvider = ({ children }) => {
      const STORAGE_KEY = 'fexle_sales_engine_data';
      const [leads, setLeads] = useState([]);
      const [tasks, setTasks] = useState([]);
      const [meetings, setMeetings] = useState([]);
      const [availabilitySlots, setAvailabilitySlots] = useState([]);
      const [loading, setLoading] = useState(true);
      const [settings, setSettings] = useState({});

      // Load data on mount
      useEffect(() => {
        try {
          const data = localStorage.getItem(STORAGE_KEY);
          if (data) {
            const parsed = JSON.parse(data);
            setLeads(parsed.leads || []);
            setTasks(parsed.tasks || []);
            setMeetings(parsed.bookedMeetings || []);
            setAvailabilitySlots(parsed.ceoAvailability || []);
            setSettings({
              callerName: parsed.callerName || '',
              userEmail: parsed.userEmail || '',
              userPhone: parsed.userPhone || '',
              anthropicApiKey: parsed.anthropicApiKey || '',
              apolloApiKey: parsed.apolloApiKey || '',
              proxyUrl: parsed.proxyUrl || '',
              todayCallList: parsed.todayCallList || [],
              onboardingCompleted: parsed.onboardingCompleted || false,
              targetAction: parsed.targetAction || DEFAULT_TARGET_ACTION
            });
          }
        } catch (e) {
          console.error('Failed to load from localStorage:', e);
        } finally {
          setLoading(false);
        }
      }, []);

      // Save data on change
      useEffect(() => {
        if (!loading) {
          try {
            const current = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
            localStorage.setItem(STORAGE_KEY, JSON.stringify({
              ...current,
              leads,
              tasks,
              bookedMeetings: meetings,
              ceoAvailability: availabilitySlots,
              ...settings
            }));
          } catch (e) {
            console.error('Failed to save to localStorage:', e);
          }
        }
      }, [leads, tasks, meetings, availabilitySlots, settings, loading]);

      // Config object for consistency with Supabase mode
      const config = {
        targetAction: settings.targetAction || DEFAULT_TARGET_ACTION
      };

      const value = {
        // Data
        leads,
        tasks,
        meetings,
        availabilitySlots,
        loading,
        isSupabase: false,
        settings,
        config,

        // Lead operations (sync for local mode)
        addLead: (lead) => {
          const newLead = { ...lead, id: Date.now(), createdAt: new Date().toISOString() };
          setLeads(prev => [...prev, newLead]);
          return { success: true, data: newLead };
        },
        updateLead: (id, updates) => {
          setLeads(prev => prev.map(l => l.id === id ? { ...l, ...updates } : l));
          return { success: true };
        },
        deleteLead: (id) => {
          setLeads(prev => prev.filter(l => l.id !== id));
          return { success: true };
        },
        setLeads,

        // Task operations
        addTask: (task) => {
          const newTask = { ...task, id: Date.now(), createdAt: new Date().toISOString() };
          setTasks(prev => [...prev, newTask]);
          return { success: true, data: newTask };
        },
        updateTask: (id, updates) => {
          setTasks(prev => prev.map(t => t.id === id ? { ...t, ...updates } : t));
          return { success: true };
        },
        deleteTask: (id) => {
          setTasks(prev => prev.filter(t => t.id !== id));
          return { success: true };
        },
        setTasks,

        // Meeting operations
        addMeeting: (meeting) => {
          const newMeeting = { ...meeting, id: Date.now() };
          setMeetings(prev => [...prev, newMeeting]);
          return { success: true, data: newMeeting };
        },
        setMeetings,
        addAvailabilitySlot: (slot) => {
          const newSlot = { ...slot, id: Date.now() };
          setAvailabilitySlots(prev => [...prev, newSlot]);
          return { success: true, data: newSlot };
        },
        setAvailabilitySlots,

        // Settings
        updateSettings: (newSettings) => {
          setSettings(prev => ({ ...prev, ...newSettings }));
        },

        // Admin info (local mode = single user = owner)
        isAdmin: true,
        isOwner: true,
        membership: { role: 'owner' },
        updateConfig: (newConfig) => {
          const merged = { ...config, ...newConfig };
          setSettings(prev => ({ ...prev, ...merged }));
          return { data: merged, error: null };
        },
        reloadOrg: () => {},

        reload: () => {
          // Force reload from localStorage
          const data = localStorage.getItem(STORAGE_KEY);
          if (data) {
            const parsed = JSON.parse(data);
            setLeads(parsed.leads || []);
            setTasks(parsed.tasks || []);
          }
        }
      };

      return <DataContext.Provider value={value}>{children}</DataContext.Provider>;
    };

    // ==================== LEAD SCORING MODEL ====================
    const DEFAULT_SCORING_WEIGHTS = {

    const calculateLeadScore = (lead) => {
      let score = 0;
      let breakdown = {};

      // Company Size Score
      const sizeScore = SCORING_WEIGHTS.companySize[lead.companySize] || 10;
      score += sizeScore;
      breakdown.companySize = sizeScore;

      // Revenue Score
      const revenueScore = SCORING_WEIGHTS.revenue[lead.revenue] || 10;
      score += revenueScore;
      breakdown.revenue = revenueScore;

      // Title Score
      let titleScore = 5;
      const titleLower = (lead.title || '').toLowerCase();
      if (titleLower.includes('ceo') || titleLower.includes('chief executive') || titleLower.includes('managing director') || titleLower.includes('founder')) {
        titleScore = 25;
      } else if (titleLower.includes('coo') || titleLower.includes('cio') || titleLower.includes('cto')) {
        titleScore = 22;
      } else if (titleLower.includes('cfo')) {
        titleScore = 20;
      } else if (titleLower.includes('vp') || titleLower.includes('vice president')) {
        titleScore = 18;
      } else if (titleLower.includes('director') || titleLower.includes('head of')) {
        titleScore = 15;
      } else if (titleLower.includes('manager')) {
        titleScore = 10;
      }
      score += titleScore;
      breakdown.title = titleScore;

      // Intent Signals Score
      let intentScore = 0;
      if (lead.intentSignals) {
        if (lead.intentSignals.hiringSalesforce) intentScore += 10;
        if (lead.intentSignals.researchingCRM) intentScore += 8;
        if (lead.intentSignals.recentFunding) intentScore += 7;
        if (lead.intentSignals.newExecutive) intentScore += 5;
        if (lead.intentSignals.expansion) intentScore += 5;
        if (lead.intentSignals.techStackMatch) intentScore += 5;
      }
      score += Math.min(intentScore, 20); // Cap at 20
      breakdown.intent = Math.min(intentScore, 20);

      // Vertical Fit Score
      const verticalScore = SCORING_WEIGHTS.verticalFit[lead.vertical] || 8;
      score += verticalScore;
      breakdown.vertical = verticalScore;

      // Normalize to 0-100
      const normalizedScore = Math.min(Math.round((score / 100) * 100), 100);
      
      return { score: normalizedScore, breakdown };

      // Determine company size bucket

      // Determine revenue bucket

      if (annualRevenue < 5000000) revenue = 'Under $5M';
      else if (annualRevenue < 20000000) revenue = '$5M-$20M';
      else if (annualRevenue < 50000000) revenue = '$20M-$50M';
      else if (annualRevenue < 200000000) revenue = '$50M-$200M';
      else revenue = '$200M+';

      // Map industry to vertical
      let vertical = 'general';
      const industry = (org.industry || '').toLowerCase();
      if (industry.includes('health') || industry.includes('medical') || industry.includes('hospital') || industry.includes('aged care')) {
        vertical = 'healthcare';

        vertical = 'financial';
      } else if (industry.includes('manufactur') || industry.includes('industrial')) {
        vertical = 'manufacturing';
      } else if (industry.includes('retail') || industry.includes('ecommerce') || industry.includes('consumer')) {

      } else if (industry.includes('education') || industry.includes('university') || industry.includes('school')) {

      } else if (industry.includes('nonprofit') || industry.includes('charity') || industry.includes('ngo')) {

        vertical = 'government';

        vertical = 'realestate';
      } else if (industry.includes('logistics') || industry.includes('transport') || industry.includes('shipping')) {

        console.error('Failed to save to localStorage:', e);

    };

    // ==================== CSV FUNCTIONS ====================
    const parseCSV = (csvText) => {
      const lines = csvText.trim().split('\n');
      if (lines.length < 2) return [];
      
      const headers = lines[0].split(',').map(h => h.trim().toLowerCase().replace(/['"]/g, ''));
      const leads = [];
      
      for (let i = 1; i < lines.length; i++) {
        const values = lines[i].match(/(".*?"|[^",\s]+)(?=\s*,|\s*$)/g) || [];
        const cleanValues = values.map(v => v.replace(/^"|"$/g, '').trim());
        
        if (cleanValues.length > 0) {
          const lead = {
            id: Date.now() + i,
            company: cleanValues[headers.indexOf('company')] || cleanValues[0] || '',
            contact: cleanValues[headers.indexOf('contact')] || cleanValues[headers.indexOf('name')] || cleanValues[1] || '',
            title: cleanValues[headers.indexOf('title')] || cleanValues[headers.indexOf('role')] || cleanValues[2] || '',
            phone: cleanValues[headers.indexOf('phone')] || cleanValues[3] || '',
            email: cleanValues[headers.indexOf('email')] || cleanValues[4] || '',
            vertical: cleanValues[headers.indexOf('vertical')] || cleanValues[headers.indexOf('industry')] || 'general',
            notes: cleanValues[headers.indexOf('notes')] || '',
            score: parseInt(cleanValues[headers.indexOf('score')]) || Math.floor(Math.random() * 30) + 50,
            status: cleanValues[headers.indexOf('status')] || 'New Lead',
            lastContact: 'Never',
            research: null,
            createdAt: new Date().toISOString().split('T')[0]
          };
          
          // Normalize vertical
          const verticalLower = lead.vertical.toLowerCase();
          if (verticalLower.includes('health') || verticalLower.includes('aged') || verticalLower.includes('medical')) {
            lead.vertical = 'healthcare';
          } else if (verticalLower.includes('professional') || verticalLower.includes('legal') || verticalLower.includes('accounting') || verticalLower.includes('consulting')) {
            lead.vertical = 'professionalServices';
          } else if (verticalLower.includes('manufactur') || verticalLower.includes('industrial')) {
            lead.vertical = 'manufacturing';
          } else if (verticalLower.includes('financ') || verticalLower.includes('bank') || verticalLower.includes('wealth')) {
            lead.vertical = 'financial';
          }
          
          if (lead.company) {
            leads.push(lead);
          }
        }
      }
      
      return leads;
    };

              body: JSON.stringify(searchParams)

      };

      // Detect country from phone number
      const detectPhoneCountry = (phone) => {
        if (!phone) return null;
        const digits = phone.replace(/\D/g, '');

        // Check international format first
        if (digits.startsWith('61')) return 'AU';
        if (digits.startsWith('44')) return 'UK';
        if (digits.startsWith('1') && digits.length === 11) {
          // US or CA - check area code
          const areaCode = digits.substring(1, 4);
          const canadaAreaCodes = ['204', '226', '236', '249', '250', '289', '306', '343', '365', '403', '416', '418', '431', '437', '438', '450', '506', '514', '519', '579', '581', '587', '604', '613', '639', '647', '672', '705', '709', '778', '780', '782', '807', '819', '825', '867', '873', '902', '905'];
          return canadaAreaCodes.includes(areaCode) ? 'CA' : 'US';
        }

        // Check local formats
        if (digits.startsWith('04') && digits.length === 10) return 'AU';
        if (digits.startsWith('0') && digits.length === 10 && /^0[2378]/.test(digits)) return 'AU';
        if (digits.startsWith('07') && digits.length === 11) return 'UK';
        if (digits.startsWith('0') && digits.length >= 10 && digits.length <= 11) return 'UK';
        if (digits.length === 10 && /^[2-9]/.test(digits)) return 'US'; // Default to US for 10-digit

        return null;
      };

      // Format phone for tel: link (E.164 format)
      const formatPhoneForTel = (phone, country = null) => {
        if (!phone) return '';
        const digits = phone.replace(/\D/g, '');
        const detectedCountry = country || detectPhoneCountry(phone);

        // Already has + prefix
        if (phone.startsWith('+')) {
          return '+' + digits;
        }

        // Handle by country
        switch (detectedCountry) {
          case 'AU':
            // Already international format with 61
            if (digits.startsWith('61') && digits.length >= 11) {
              return '+' + digits;
            }
            // Australian local format (starts with 0)
            if (digits.startsWith('0') && digits.length === 10) {
              return '+61' + digits.substring(1);
            }
            // Business numbers (1300, 1800)
            if (digits.startsWith('1') && (digits.length === 10 || digits.length === 6)) {
              return '+61' + digits;
            }
            break;

          case 'US':
          case 'CA':
            // Already has country code
            if (digits.startsWith('1') && digits.length === 11) {
              return '+' + digits;
            }
            // 10-digit local format
            if (digits.length === 10) {
              return '+1' + digits;
            }
            break;

          case 'UK':
            // Already international format with 44
            if (digits.startsWith('44')) {
              return '+' + digits;
            }
            // UK local format (starts with 0)
            if (digits.startsWith('0') && digits.length >= 10) {
              return '+44' + digits.substring(1);
            }
            break;
        }

        // Return cleaned digits if format not recognized
        return phone.replace(/\s/g, '');
      };

      const formatPhoneDisplay = (phone, country = null) => {
        if (!phone) return '';
        const digits = phone.replace(/\D/g, '');
        const detectedCountry = country || detectPhoneCountry(phone);

        switch (detectedCountry) {
          case 'AU':
            // Mobile: 04XX XXX XXX
            if (digits.startsWith('04') || (digits.startsWith('614') && digits.length >= 11)) {
              const num = digits.startsWith('61') ? '0' + digits.substring(2) : digits;
              if (num.length === 10) {
                return `${num.substring(0, 4)} ${num.substring(4, 7)} ${num.substring(7)}`;
              }
            }
            // Landline: 0X XXXX XXXX
            if (digits.startsWith('0') && digits.length === 10) {
              return `${digits.substring(0, 2)} ${digits.substring(2, 6)} ${digits.substring(6)}`;
            }
            break;

          case 'US':
          case 'CA':
            // (XXX) XXX-XXXX
            const usDigits = digits.startsWith('1') ? digits.substring(1) : digits;
            if (usDigits.length === 10) {
              return `(${usDigits.substring(0, 3)}) ${usDigits.substring(3, 6)}-${usDigits.substring(6)}`;
            }
            break;

          case 'UK':
            // 07XXX XXXXXX (mobile) or 0XX XXXX XXXX (landline)
            const ukDigits = digits.startsWith('44') ? '0' + digits.substring(2) : digits;
            if (ukDigits.startsWith('07') && ukDigits.length === 11) {
              return `${ukDigits.substring(0, 5)} ${ukDigits.substring(5)}`;
            }
            if (ukDigits.length >= 10) {
              return `${ukDigits.substring(0, 3)} ${ukDigits.substring(3, 7)} ${ukDigits.substring(7)}`;
            }
            break;
        }

        // Return as-is if no formatting applied
        return phone;
      };

      // Validate phone number for a country
      const validatePhone = (phone, country) => {
        if (!phone || !country) return false;
        const digits = phone.replace(/\D/g, '');
        const format = PHONE_FORMATS[country];
        if (!format) return false;

        // Check against patterns
        const patterns = format.patterns;
        return Object.values(patterns).some(pattern => pattern.test(digits));
      };

      // Filter leads
      const filteredLeads = leads.filter(lead => {
        const matchesSearch = lead.company.toLowerCase().includes(searchQuery.toLowerCase()) ||
                             lead.contact.toLowerCase().includes(searchQuery.toLowerCase());
        const matchesVertical = filterVertical === 'all' || lead.vertical === filterVertical;
        const matchesStatus = filterStatus === 'all' ||
          (filterStatus === 'active' ? (lead.lastContactDate && !['Closed Won', 'Closed Lost'].includes(lead.status)) : lead.status === filterStatus);
        const matchesSource = filterSource === 'all' || lead.source === filterSource;
        return matchesSearch && matchesVertical && matchesStatus && matchesSource;
      });

      // Add lead
      const addNewLead = async () => {
        if (newLead.company && newLead.contact) {
          const { score } = calculateLeadScore(newLead);
          const lead = {
            ...newLead,
            score,
            status: 'New Lead',
            lastContact: 'Never',
            createdAt: new Date().toISOString().split('T')[0],
            research: null
          };

          if (dataContext?.addLead) {
            // Supabase mode - use async operation
            const { success, data, error } = await dataContext.addLead(lead);
            if (success) {
              setNewLead({
                company: '', contact: '', title: '', phone: '', email: '',
                vertical: 'general', notes: '', source: 'manual',
                companySize: '51-200', revenue: '$20M-$50M', website: '',
                linkedinUrl: '', city: '', state: '', intentSignals: {}
              });
              setShowAddLead(false);
              showNotification(`Lead added with score ${score}`);
            } else {
              showNotification(`Error adding lead: ${error?.message || 'Unknown error'}`, 'error');
            }
          } else {
            // Local mode
            lead.id = Date.now();
            setLocalLeads([...localLeads, lead]);
            setNewLead({
              company: '', contact: '', title: '', phone: '', email: '',
              vertical: 'general', notes: '', source: 'manual',
              companySize: '51-200', revenue: '$20M-$50M', website: '',
              linkedinUrl: '', city: '', state: '', intentSignals: {}
            });
            setShowAddLead(false);
            showNotification(`Lead added with score ${score}`);
          }
        }
      };

      // ==================== CALL TIMER ====================
      // Timer effect - updates every second while call is active
      useEffect(() => {
        let interval;
        if (callTimerActive && callStartTime) {
          interval = setInterval(() => {
            setCallDuration(Math.floor((Date.now() - callStartTime) / 1000));
          }, 1000);
        }
        return () => clearInterval(interval);
      }, [callTimerActive, callStartTime]);

      // Reset timer when lead changes
      useEffect(() => {
        if (callTimerActive) {
          stopCallTimer();
        }
      }, [selectedLead?.id]);

      // Format seconds to MM:SS or HH:MM:SS
      const formatCallDuration = (seconds) => {
        const hrs = Math.floor(seconds / 3600);
        const mins = Math.floor((seconds % 3600) / 60);
        const secs = seconds % 60;
        if (hrs > 0) {
          return `${hrs}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
        }
        return `${mins}:${secs.toString().padStart(2, '0')}`;
      };

      // Start call timer
      const startCallTimer = () => {
        setCallStartTime(Date.now());
        setCallDuration(0);
        setCallTimerActive(true);
        setCallOutcome('');
        setCallNotes('');
      };

      // Stop call timer (without logging)
      const stopCallTimer = () => {
        setCallTimerActive(false);
        // Keep duration for logging
      };

      // Twilio Voice Functions
      const initTwilioDevice = async () => {
        if (!isSupabaseMode || !supabase || !dataContext?.organization?.id) return false;

        try {
          setTwilioStatus('connecting');

          // Get access token from Edge Function
          const session = await supabase.auth.getSession();
          const token = session?.data?.session?.access_token;

          if (!token) {
            console.error('No auth token for Twilio');
            setTwilioStatus('offline');
            return false;
          }

          const response = await fetch(`${supabase.supabaseUrl}/functions/v1/twilio-token`, {
            method: 'POST',
            headers: {
              'Authorization': `Bearer ${token}`,
              'Content-Type': 'application/json'
            }
          });

          if (!response.ok) {
            setTwilioConfigured(false);
            setTwilioStatus('offline');
            return false;
          }

          const { token: twilioAccessToken, callerId } = await response.json();
          setTwilioToken(twilioAccessToken);
          setTwilioConfigured(true);

          // Initialize Twilio Device (SDK loaded via script tag)
          if (typeof Twilio !== 'undefined' && Twilio.Device) {
            const device = new Twilio.Device(twilioAccessToken, {
              codecPreferences: ['opus', 'pcmu'],
              enableRingingState: true
            });

            device.on('ready', () => {
              console.log('Twilio Device ready');
              setTwilioStatus('ready');
            });

            device.on('error', (error) => {
              console.error('Twilio Device error:', error);
              setTwilioStatus('offline');
            });

            device.on('connect', (connection) => {
              console.log('Twilio call connected');
              setTwilioConnection(connection);
              setTwilioStatus('on-call');
              setCurrentCallSid(connection.parameters?.CallSid);
              startCallTimer();
            });

            device.on('disconnect', () => {
              console.log('Twilio call disconnected');
              setTwilioConnection(null);
              setTwilioStatus('ready');
              setCurrentCallSid(null);
              stopCallTimer();
            });

            setTwilioDevice(device);
            return true;
          } else {
            setTwilioStatus('offline');
            return false;
          }
        } catch (error) {
          console.error('Failed to initialize Twilio:', error);
          setTwilioStatus('offline');
          return false;
        }
      };

      const makeTwilioCall = async (phoneNumber) => {
        if (!twilioDevice || twilioStatus !== 'ready') {
          // Initialize if not ready
          const initialized = await initTwilioDevice();
          if (!initialized) {
            // Fallback to tel: link
            window.location.href = `tel:${phoneNumber}`;
            startCallTimer();
            return;
          }
        }

        try {
          const params = {
            To: phoneNumber,
            userId: dataContext?.user?.id,
            leadId: selectedLead?.id,
            organizationId: dataContext?.organization?.id
          };

          setTwilioStatus('connecting');
          const connection = twilioDevice.connect(params);
          setTwilioConnection(connection);
        } catch (error) {
          console.error('Failed to make Twilio call:', error);
          // Fallback to tel: link
          window.location.href = `tel:${phoneNumber}`;
          startCallTimer();
        }
      };

      const hangupTwilioCall = () => {
        if (twilioConnection) {
          twilioConnection.disconnect();
        }
        if (twilioDevice) {
          twilioDevice.disconnectAll();
        }
        setTwilioConnection(null);
        setTwilioStatus('ready');
        stopCallTimer();
      };

      const toggleTwilioMute = () => {
        if (twilioConnection) {
          const newMuted = !twilioMuted;
          twilioConnection.mute(newMuted);
          setTwilioMuted(newMuted);
        }
      };

      // Parse call history from lead notes
      const getCallHistory = (lead) => {
        if (!lead?.notes) return [];
        const callPattern = /\[([^\]]+)\] 📞 ([^:\n]+)(?:: ([^\n]+))?(?:\n\(Duration: ([^\)]+)\))?/g;
        const calls = [];
        let match;
        while ((match = callPattern.exec(lead.notes)) !== null) {
          calls.push({
            timestamp: match[1],
            outcome: match[2],
            notes: match[3] || '',
            duration: match[4] || null
          });
        }
        return calls;
      };

      // Log call with duration
      const logCall = async () => {
        if (selectedLead && callOutcome) {
          const timestamp = new Date().toLocaleString('en-AU', { dateStyle: 'short', timeStyle: 'short' });

          // Include duration if timer was running
          const durationStr = callTimerActive || callDuration > 0
            ? formatCallDuration(callDuration)
            : null;

          // Build the call note with optional duration
          let outcomeNote = `[${timestamp}] 📞 ${callOutcome}${callNotes ? ': ' + callNotes : ''}`;
          if (durationStr) {
            outcomeNote += `\n(Duration: ${durationStr})`;
          }

          // Build updated lead object
          const updatedLeadData = {
            lastContact: 'Just now',
            lastContactDate: new Date().toISOString(),
            lastCallOutcome: callOutcome,
            lastCallDuration: callDuration > 0 ? callDuration : null,
            notes: outcomeNote + (selectedLead.notes ? '\n\n' + selectedLead.notes : '')
          };

          // If meeting requested, update status
          if (callOutcome === 'Meeting Requested') {
            updatedLeadData.status = 'Call Scheduled';
          }

          // If deck requested, mark milestone
          if (callOutcome === 'Deck Requested') {
            updatedLeadData.milestones = { ...selectedLead.milestones, deckSent: true };
            updatedLeadData.status = 'Deck Sent';
          }

          // If not interested, update status
          if (callOutcome === 'Not Interested') {
            updatedLeadData.status = 'Closed Lost';
          }

          // Update lead using helper (works in both modes)
          await updateLeadById(selectedLead.id, updatedLeadData);

          // Auto-create follow-up task based on outcome
          const followUpConfig = {
            'Voicemail': { days: 2, description: 'Follow up after voicemail' },
            'No Answer': { days: 1, description: 'Retry call - no answer' },
            'Call Back': { days: 2, description: 'Call back as requested' },
            'Deck Requested': { days: 5, description: 'Follow up on deck' },
            'Meeting Requested': { days: 1, description: `Prep for ${targetAction.shortLabel}` }
          };

          if (followUpConfig[callOutcome]) {
            const config = followUpConfig[callOutcome];
            const dueDate = new Date();
            dueDate.setDate(dueDate.getDate() + config.days);

            const newFollowUp = {
              leadId: selectedLead.id,
              type: callOutcome === 'Deck Requested' ? 'follow-up-deck'
                   : callOutcome === 'Meeting Requested' ? 'meeting-prep'
                   : 'follow-up-call',
              description: config.description,
              dueDate: dueDate.toISOString().split('T')[0],
              dueTime: '16:00',
              completed: false
            };
            await addTaskHelper(newFollowUp);
            showNotification(`Follow-up task created for ${dueDate.toLocaleDateString('en-AU')}`);
          }

          // Auto-mark as complete in today's call list
          if (todayCallList.some(item => item.leadId === selectedLead.id)) {
            markCallListItemComplete(selectedLead.id);
          }

          // Stop timer and reset
          setCallTimerActive(false);
          const loggedDuration = durationStr ? ` (${durationStr})` : '';
          showNotification(`Call logged: ${callOutcome}${loggedDuration}`);
          setCallNotes('');
          setCallOutcome('');
          setCallDuration(0);
          setCallStartTime(null);
        }
      };

      // Add call notes without changing status
      const addCallNotes = async () => {
        if (selectedLead && callNotes.trim()) {
          const timestamp = new Date().toLocaleString('en-AU', { dateStyle: 'short', timeStyle: 'short' });
          const updates = {
            lastContact: 'Just now',
            lastContactDate: new Date().toISOString(),
            notes: `[${timestamp}] ${callNotes}\n\n${selectedLead.notes || ''}`
          };

          await updateLeadById(selectedLead.id, updates);
          setSelectedLead({ ...selectedLead, ...updates });

          // Auto-mark as complete in today's call list
          if (todayCallList.some(item => item.leadId === selectedLead.id)) {
            markCallListItemComplete(selectedLead.id);
          }

          showNotification('Notes added');
          setCallNotes('');
        }
      };

      // Log call from popup window
      const logCallFromPopup = (leadId, outcome, notes) => {
        const timestamp = new Date().toLocaleString('en-AU', { dateStyle: 'short', timeStyle: 'short' });
        const outcomeNote = `[${timestamp}] 📞 ${outcome}${notes ? ': ' + notes : ''}`;

        setLeads(prevLeads => prevLeads.map(lead => {
          if (lead.id !== leadId) return lead;
          const updatedLead = {
            ...lead,
            lastContact: 'Just now',
            lastContactDate: new Date().toISOString(),
            lastCallOutcome: outcome,
            notes: outcomeNote + (lead.notes ? '\n\n' + lead.notes : '')
          };
          // If deck requested, mark milestone
          if (outcome === 'Deck Requested') {
            updatedLead.milestones = { ...lead.milestones, deckSent: true };
          }
          return updatedLead;
        }));

        // Auto-create follow-up task based on outcome
        const followUpConfig = {
          'Voicemail': { days: 2, description: 'Follow up after voicemail' },
          'No Answer': { days: 1, description: 'Retry call - no answer' },
          'Call Back': { days: 2, description: 'Call back as requested' },
          'Deck Requested': { days: 5, description: 'Follow up on deck' }
        };

        if (followUpConfig[outcome]) {
          const config = followUpConfig[outcome];
          const dueDate = new Date();
          dueDate.setDate(dueDate.getDate() + config.days);

          const newFollowUp = {
            id: Date.now(),
            leadId: leadId,
            type: outcome === 'Deck Requested' ? 'follow-up-deck' : 'follow-up-call',
            description: config.description,
            dueDate: dueDate.toISOString().split('T')[0],
            dueTime: '16:00',
            completed: false,
            createdAt: new Date().toISOString()
          };
          setTasks(prevTasks => [...prevTasks, newFollowUp]);
        }

        // Auto-mark as complete in today's call list
        if (todayCallList.some(item => item.leadId === leadId)) {
          markCallListItemComplete(leadId);
        }

        showNotification(`Call logged: ${outcome}`);
      };

      // Add notes only from popup (no outcome)
      const addCallNotesFromPopup = (leadId, notes) => {
        const timestamp = new Date().toLocaleString('en-AU', { dateStyle: 'short', timeStyle: 'short' });
        setLeads(prevLeads => prevLeads.map(lead => {
          if (lead.id !== leadId) return lead;
          return {
            ...lead,
            notes: `[${timestamp}] ${notes}\n\n${lead.notes || ''}`
          };
        }));
        showNotification('Notes saved');
      };

      // Expose functions to window for popup access
      window.logCallFromPopup = logCallFromPopup;
      window.addCallNotesFromPopup = addCallNotesFromPopup;

      // Task management functions
      const addTask = () => {
        if (newTask.description && newTask.dueDate) {
          const task = {
            id: Date.now(),
            ...newTask,
            completed: false,
            createdAt: new Date().toISOString()
          };
          setTasks([...tasks, task]);
          setNewTask({ leadId: null, type: 'call', description: '', dueDate: '', dueTime: '' });
          setShowTaskModal(false);
          showNotification('Task added');
        }
      };

      const completeTask = (taskId) => {
        setTasks(tasks.map(t => t.id === taskId ? { ...t, completed: true, completedAt: new Date().toISOString() } : t));
        showNotification('Task completed');
      };

      const deleteTask = (taskId) => {
        setTasks(tasks.filter(t => t.id !== taskId));
        showNotification('Task deleted');
      };

      const deleteLead = async (leadId) => {
        if (confirm('Are you sure you want to delete this lead? This cannot be undone.')) {
          if (dataContext?.deleteLead) {
            // Supabase mode - use async operation
            const { success, error } = await dataContext.deleteLead(leadId);
            if (success) {
              if (selectedLead?.id === leadId) {
                setSelectedLead(null);
              }
              showNotification('Lead deleted');
            } else {
              showNotification(`Error deleting lead: ${error?.message || 'Unknown error'}`, 'error');
            }
          } else {
            // Local mode
            setLocalLeads(localLeads.filter(l => l.id !== leadId));
            if (selectedLead?.id === leadId) {
              setSelectedLead(null);
            }
            showNotification('Lead deleted');
          }
        }
      };

      const snoozeTask = (taskId, days) => {
        setTasks(tasks.map(t => {
          if (t.id === taskId) {
            const newDate = new Date(t.dueDate);
            newDate.setDate(newDate.getDate() + days);
            return { ...t, dueDate: newDate.toISOString().split('T')[0] };
          }
          return t;
        }));
        showNotification(`Task snoozed ${days} day${days > 1 ? 's' : ''}`);
      };

      // Get today's tasks and follow-ups
      const getTodaysTasks = () => {
        const today = new Date().toISOString().split('T')[0];
        const todayTasks = tasks.filter(t => !t.completed && t.dueDate <= today);
        
        // Also generate implicit follow-ups from lead statuses
        const implicitFollowUps = leads
          .filter(lead => {
            if (['Closed Won', 'Closed Lost', 'New Lead'].includes(lead.status)) return false;
            if (!lead.lastContactDate) return lead.status !== 'New Lead';
            const followUpDate = calculateFollowUpDate(lead.lastContactDate, lead.status);
            return followUpDate <= new Date();
          })
          .map(lead => ({
            id: `implicit-${lead.id}`,
            leadId: lead.id,
            type: 'follow-up',
            description: `Follow up: ${lead.status}`,
            implicit: true,
            lead
          }));
        
        return { explicit: todayTasks, implicit: implicitFollowUps };
      };

      // Get prioritized call list for today
      const getPrioritizedCalls = () => {
        return leads
          .filter(l => !['Closed Won', 'Closed Lost'].includes(l.status))
          .map(lead => ({ ...lead, priority: getTaskPriority(lead) }))
          .sort((a, b) => {
            if (a.priority !== b.priority) return a.priority - b.priority;
            return b.score - a.score;
          })
          .slice(0, 10);
      };

      // Today's Call List Management
      const getFilteredLeadsForPicker = () => {
        return leads
          .filter(l => !['Closed Won', 'Closed Lost'].includes(l.status))
          .filter(l => !todayCallList.some(c => c.leadId === l.id))
          .filter(l => callListFilter.minScore === 0 || l.score >= callListFilter.minScore)
          .filter(l => callListFilter.status === 'all' || l.status === callListFilter.status)
          .filter(l => callListFilter.vertical === 'all' || l.vertical === callListFilter.vertical)
          .sort((a, b) => b.score - a.score);
      };

      const addToCallList = (leadIds) => {
        const newItems = leadIds.map(leadId => ({
          leadId,
          addedAt: new Date().toISOString(),
          completed: false,
          calledAt: null
        }));
        setTodayCallList(prev => [...prev, ...newItems]);
        setSelectedForQueue([]);
        showNotification(`Added ${leadIds.length} lead${leadIds.length > 1 ? 's' : ''} to today's call list`);
      };

      const removeFromCallList = (leadId) => {
        setTodayCallList(prev => prev.filter(item => item.leadId !== leadId));
      };

      const markCallListItemComplete = (leadId) => {
        setTodayCallList(prev => prev.map(item =>
          item.leadId === leadId
            ? { ...item, completed: true, calledAt: new Date().toISOString() }
            : item
        ));
      };

      const clearCallList = () => {
        if (confirm('Clear all items from today\'s call list?')) {
          setTodayCallList([]);
          showNotification('Call list cleared');
        }
      };

      const getCallListLeads = () => {
        return todayCallList.map(item => ({
          ...item,
          lead: leads.find(l => l.id === item.leadId)
        })).filter(item => item.lead); // Filter out any orphaned items
      };

      // Import CSV
      const handleFileImport = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = async (event) => {
            const csvText = event.target.result;
            const importedLeads = parseCSV(csvText);
            if (importedLeads.length > 0) {
              if (dataContext?.addLead) {
                // Supabase mode - add leads one by one
                let imported = 0;
                let errors = 0;
                for (const lead of importedLeads) {
                  const { success } = await dataContext.addLead(lead);
                  if (success) imported++;
                  else errors++;
                }
                showNotification(`Imported ${imported} leads${errors > 0 ? ` (${errors} errors)` : ''}`);
              } else {
                // Local mode
                setLocalLeads([...localLeads, ...importedLeads]);
                showNotification(`Imported ${importedLeads.length} leads`);
              }
              setShowImportModal(false);
            } else {
              showNotification('No valid leads found in CSV', 'error');
            }
          };
          reader.readAsText(file);
        }
      };

      // Generate full backup including tasks
      const generateFullBackup = () => {
        const timestamp = new Date().toISOString().split('T')[0];

        // Leads CSV
        const leadsCSV = generateCSV(leads);

        // Tasks CSV
        const taskHeaders = ['id', 'type', 'description', 'lead_company', 'lead_contact', 'due_date', 'due_time', 'completed', 'completed_at', 'created_at'];
        const taskRows = tasks.map(task => {
          const lead = leads.find(l => l.id === task.leadId);
          return [
            task.id,
            task.type,
            task.description,
            lead?.company || '',
            lead?.contact || '',
            task.dueDate,
            task.dueTime || '',
            task.completed ? 'Yes' : 'No',
            task.completedAt || '',
            task.createdAt || ''
          ].map(v => {
            const str = String(v);
            return str.includes(',') || str.includes('"') ? `"${str.replace(/"/g, '""')}"` : str;
          }).join(',');
        });
        const tasksCSV = [taskHeaders.join(','), ...taskRows].join('\n');

        return { leadsCSV, tasksCSV, timestamp };
      };

      // Export CSV
      const handleExport = () => {
        const { leadsCSV, tasksCSV, timestamp } = generateFullBackup();
        
        // Download leads CSV
        const leadsBlob = new Blob([leadsCSV], { type: 'text/csv' });
        const leadsUrl = URL.createObjectURL(leadsBlob);
        const leadsLink = document.createElement('a');
        leadsLink.href = leadsUrl;
        leadsLink.download = `${COMPANY_INFO.name.toLowerCase().replace(/[^a-z0-9]+/g, '_')}_leads_${timestamp}.csv`;
        leadsLink.click();
        URL.revokeObjectURL(leadsUrl);
        
        // Download tasks CSV if there are tasks
        if (tasks.length > 0) {
          setTimeout(() => {
            const tasksBlob = new Blob([tasksCSV], { type: 'text/csv' });
            const tasksUrl = URL.createObjectURL(tasksBlob);
            const tasksLink = document.createElement('a');
            tasksLink.href = tasksUrl;
            tasksLink.download = `${COMPANY_INFO.name.toLowerCase().replace(/[^a-z0-9]+/g, '_')}_tasks_${timestamp}.csv`;
            tasksLink.click();
            URL.revokeObjectURL(tasksUrl);
          }, 500);
        }
        
        // Mark any pending backup task as complete
        const updatedTasks = tasks.map(t => 
          t.type === 'backup-reminder' && !t.completed 
            ? { ...t, completed: true, completedAt: new Date().toISOString() }
            : t
        );
        setTasks(updatedTasks);
        
        // Store last backup date
        const saved = loadFromStorage() || {};
        saveToStorage({ ...saved, lastBackupDate: new Date().toISOString() });
        
        showNotification(`Exported ${leads.length} leads${tasks.length > 0 ? ` and ${tasks.length} tasks` : ''}`);
      };

      // AI Research with Claude API
      const performResearch = async (lead) => {
        // Pro feature gate
        if (!isPro()) {
          showNotification('AI Research is a Pro feature. Upgrade to Pro to unlock.', 'error');
          return;
        }

        setResearchLoading(true);
        setShowResearchModal(true);
        setResearchResult(null);

        const vertical = verticalData[lead.vertical];

        // Check for API key (not needed in Supabase mode — key is server-side)
        if (!isSupabaseMode && !anthropicApiKey) {
          setResearchResult({
            error: true,
            message: "No API key configured. Go to Settings to add your Anthropic API key for AI-powered research.",
            fallback: generateFallbackResearch(lead, vertical)
          });
          setResearchLoading(false);
          return;

                        useEffect(() => {

                            try {

                                .select('*')

                              setSmsLoading(false);

                          setSmsSending(true);
                          setSmsError(null);
                          try {
                            const session = await supabase.auth.getSession();
                            const token = session?.data?.session?.access_token;

                            const response = await fetch(`${supabase.supabaseUrl}/functions/v1/sms-send`, {
                              method: 'POST',
                              headers: {
                                'Authorization': `Bearer ${token}`,
                                'Content-Type': 'application/json'
                              },
                              body: JSON.stringify({
                                leadId: selectedLead.id,
                                message: newSmsMessage
                              })
                            });

                            const result = await response.json();

                            if (!response.ok) {
                              throw new Error(result.error || 'Failed to send SMS');
                            }

                              id: result.messageId,
                              direction: 'outbound',
                              body: newSmsMessage,
                              status: 'sent',
                              created_at: new Date().toISOString()
                            }]);
                            setNewSmsMessage('');

                            showNotification(e.message, 'error');

                            setSmsSending(false);
                          }

        // Analytics state
        const [analyticsDateRange, setAnalyticsDateRange] = useState('last7Days');
        const [analyticsLoading, setAnalyticsLoading] = useState(false);
        const [analyticsData, setAnalyticsData] = useState(null);

        // Calculate analytics data
        useEffect(() => {
          calculateAnalytics();
